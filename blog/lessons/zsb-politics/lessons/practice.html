og/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"2025 年我国在科技领域取得多项重大突破，其中属于航天领域成就的有 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"ad5a7ec178","lessonId":"模拟课2","kind":"choice","question":"6 月 26 日 21 时 29 分，经过约 6.5 小时的出舱活动，神舟二十号乘组航天员 ______ 密切协同，在空间站机械臂和地面科研人员的配合支持下，圆满完成既定任务。","options":[{"value":"A","text":"陈冬"},{"value":"B","text":"陈中瑞"},{"value":"C","text":"杨利伟"},{"value":"D","text":"王杰"}],"answer":["A","B"],"explanation":"课件外检索备注（非课件内容）：神舟二十号乘组由航天员**陈冬、陈中瑞、王杰**组成（杨利伟不在乘组），多次出舱活动均由三人密切协同完成（来源：新华网、中国载人航天工程网）。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：6 月 26 日为神舟二十号第二次出舱活动，出舱航天员为陈冬、陈中瑞（王杰舱内配合），历时约 6.5 小时；来源：新华社/中国载人航天工程网","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"6 月 26 日 21 时 29 分，经过约 6.5 小时的出舱活动，神舟二十号乘组航天员 ______ 密切协同，在空间站机械臂和地面科研人员的配合支持下，圆满完成既定任务。"},{"schemaVersion":1,"contentVersion":1,"id":"528c1155b1","lessonId":"模拟课2","kind":"choice","question":"毛泽东指出企业民主管理要实行\"两参一改三结合\"，其中\"两参\"是指 ______。","options":[{"value":"A","text":"干部参加管理"},{"value":"B","text":"干部参加劳动"},{"value":"C","text":"工人参加管理"},{"value":"D","text":"技术人员参加劳动"}],"answer":["B","C"],"explanation":"课件解析（第 42 页直接给出）：毛泽东还主张企业要建立合理的规章制度和严格的责任制，要实行民主管理，实行**干部参加劳动，工人参加管理**，改革不合理的规章制度，工人群众、领导干部和技术人员三结合，即\"两参一改三结合\"。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"毛泽东指出企业民主管理要实行\"两参一改三结合\"，其中\"两参\"是指 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"0690c81b65","lessonId":"模拟课2","kind":"choice","question":"毛泽东针对人民内部矛盾在具体实践中的不同情况，提出一系列具体方针、原则。对物质利益、分配方面的人民内部矛盾，毛泽东指出的方针是 ______。","options":[{"value":"A","text":"百花齐放"},{"value":"B","text":"团结——批评——团结"},{"value":"C","text":"统筹兼顾"},{"value":"D","text":"适当安排"}],"answer":["C","D"],"explanation":"课件解析（第 44 页红字标注 C、D；第 45 页）：关于人民内部要在政治上实行\"团结——批评——团结\"，在党与民主党派的关系上实行\"长期共存、互相监督\"，在科学文化工作中实行\"百花齐放、百家争鸣\"，在经济工作以及其他各项工作中实行\"**统筹兼顾、适当安排**\"等一系列正确方针。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"毛泽东针对人民内部矛盾在具体实践中的不同情况，提出一系列具体方针、原则。对物质利益、分配方面的人民内部矛盾，毛泽东指出的方针是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"50a1775ca9","lessonId":"模拟课2","kind":"choice","question":"建设中国特色社会主义事业的根本力量是 ______。","options":[{"value":"A","text":"知识分子"},{"value":"B","text":"农民阶级"},{"value":"C","text":"新的社会阶层"},{"value":"D","text":"工人阶级"}],"answer":[],"explanation":"课件批注（第 47 页红字）：通俗来讲，新的社会阶层就是在改革开放和社会主义市场经济发展过程中，逐步出现的、不属于传统工人阶级、农民阶级、知识分子范畴的社会群体。（批注提示 C 项不属于\"根本力量\"，据此可排除 C。）","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未直接标注答案。","grp":"题库","legacyQuestion":"建设中国特色社会主义事业的根本力量是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"69de450a9a","lessonId":"模拟课2","kind":"choice","question":"关于社会主义改造说法正确的是 ______。","options":[{"value":"A","text":"社会主义改造的基本完成，使我国社会经济结构发生了根本变化"},{"value":"B","text":"社会主义改造的基本完成，使我国社会的阶级关系发生了根本变化"},{"value":"C","text":"社会主义改造的基本完成，表明我国的一切剥削现象都已经被消灭"},{"value":"D","text":"社会主义改造的基本完成，表明社会主义制度已经基本确立"}],"answer":[],"explanation":"","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"关于社会主义改造说法正确的是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"1ed0024e07","lessonId":"模拟课2","kind":"choice","question":"全面建成小康社会中\"全面\"的含义是 ______。","options":[{"value":"A","text":"覆盖的人口全面"},{"value":"B","text":"覆盖的领域全面"},{"value":"C","text":"覆盖的区域全面"},{"value":"D","text":"覆盖的社区全面"}],"answer":[],"explanation":"","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"全面建成小康社会中\"全面\"的含义是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"bae085e9b7","lessonId":"模拟课2","kind":"choice","question":"要坚持党的领导，必须不断加强和改善党的领导，当前改善党的领导，应着力解决的问题有 ______。","options":[{"value":"A","text":"要充分发挥党总揽全局、协调各方的领导核心作用"},{"value":"B","text":"要正确处理党的领导和依法治国的关系，提高依法执政水平"},{"value":"C","text":"要妥善处理与兼顾不同阶层、不同方面群众的利益关系"},{"value":"D","text":"要不断提高党的领导水平和执政水平，提高拒腐防变和抵御风险能力"}],"answer":[],"explanation":"","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"要坚持党的领导，必须不断加强和改善党的领导，当前改善党的领导，应着力解决的问题有 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"55818e3de0","lessonId":"模拟课2","kind":"choice","question":"党的十八大以来，习近平总书记高度重视党的建设，在多个场合强调了党要管党、从严治党的重要性和紧迫性。全面从严治党要做到 ______。","options":[{"value":"A","text":"坚持党要管党、从严治党"},{"value":"B","text":"坚持思想建党与制度治党相结合"},{"value":"C","text":"加强组织、纪律和作风建设"},{"value":"D","text":"加强党风廉政建设和反腐败斗争"}],"answer":[],"explanation":"","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"党的十八大以来，习近平总书记高度重视党的建设，在多个场合强调了党要管党、从严治党的重要性和紧迫性。全面从严治党要做到 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"2aec6b55ee","lessonId":"模拟课2","kind":"choice","question":"新时代党的建设目标是把党建设成为 ______。","options":[{"value":"A","text":"始终走在时代前列的马克思主义执政党"},{"value":"B","text":"人民衷心拥护的马克思主义执政党"},{"value":"C","text":"勇于自我革命的马克思主义执政党"},{"value":"D","text":"经得起各种风浪考验、朝气蓬勃的马克思主义执政党"}],"answer":["A","B","C","D"],"explanation":"课件解析（第 54 页，结论句红字标注）：新时代党的建设总要求：坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强党的长期执政能力建设、先进性和纯洁性建设为主线，以党的政治建设为统领，以坚定理想信念宗旨为根基，以调动全党积极性、主动性、创造性为着力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量，**把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党**。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"新时代党的建设目标是把党建设成为 ______。"}],"subjs":[{"id":"5532aa5e2c","num":31,"type":"辨析","supp":false,"stem":"中国共产党是以马克思主义理论为理论基础和行动指南的。","options":[],"answer":"题干说法正确。","src":"","exp":"马克思主义是科学的世界观和方法论，揭示了人类社会发展的客观规律，是无产阶级政党的理论基石。中国共产党从成立之日起，就把马克思主义鲜明地写在自己的旗帜上，以马克思主义为理论基础，指导中国革命、建设和改革的实践。同时，党在实践中不断推进马克思主义中国化时代化，形成了毛泽东思想、中国特色社会主义理论体系、习近平新时代中国特色社会主义思想等创新理论，始终坚持以发展着的马克思主义作为行动指南。","warn":""},{"id":"43311f6178","num":32,"type":"辨析","supp":false,"stem":"中华人民共和国成立，实现了从新民主主义社会到社会主义社会的转变。","options":[],"answer":"题干说法错误。","src":"","exp":"中华人民共和国的成立，标志着我国进入新民主主义社会，这是一个过渡性质的社会形态，并非直接进入社会主义社会。\n从新民主主义社会到社会主义社会的转变，以 1956 年社会主义改造的基本完成为标志。三大改造（农业、手工业、资本主义工商业改造）的完成，使公有制经济成为国民经济的主体，社会主义基本制度在我国确立，才真正实现了向社会主义社会的转变。","warn":""},{"id":"dd3f4bc068","num":33,"type":"简答","supp":false,"stem":"简述习近平新时代中国特色社会主义思想关于\"六个必须坚持\"的内涵。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持人民至上是根本价值立场，体现了历史唯物主义群众史观；\n（2）坚持自信自立是内在精神特质，体现了客观规律性和主观能动性的有机结合；\n（3）坚持守正创新是鲜明理论品格，体现了变与不变、继承与发展的内在联系；\n（4）坚持问题导向是重要实践要求，体现了矛盾的普遍性和客观性；\n（5）坚持系统观念是基本思想和工作方法，体现了辩证唯物主义普遍联系的原理；\n（6）坚持胸怀天下是中国共产党人的境界格局，体现了马克思主义追求人类进步和解放的崇高理想。\n这六个方面相互联系、彼此支撑，贯通了唯物论和辩证法、认识论和实践论、真理论和价值论，赋予了马克思主义世界观和方法论以新的时代内涵，彰显了习近平新时代中国特色社会主义思想的理论品格和鲜明特征。","warn":""},{"id":"73167cab44","num":34,"type":"简答","supp":false,"stem":"简述走中国特色社会主义法治道路的原因。","options":[],"answer":"（见下方解析）","src":"","exp":"走中国特色社会主义法治道路，\n（1）是历史的必然结论；\n（2）是由我国社会主义国家性质所决定的；\n（3）是立足我国基本国情的必然选择。\n📎 本页边栏另附\"\"中特\"政策万能答题模板\"（万能原因/依据 6 条 + 万能意义 4 条），全文见文末附录二。","warn":""},{"id":"e2ef189c2a","num":35,"type":"简答","supp":false,"stem":"简述群众路线的主要内容。","options":[],"answer":"（见下方解析）","src":"","exp":"①群众路线，就是一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动。\n②群众路线都是我们党的生命线和根本工作路线，是我们党永葆青春活力和战斗力的重要传家宝。\n③群众路线本质上体现的是马克思主义关于人民群众是历史的创造者这一基本原理。坚持群众路线，就要坚持人民是推动历史发展的根本力量。\n④坚持群众路线，就要坚持全心全意为人民服务的根本宗旨。全心全意为人民服务，是我们党一切行动的根本出发点和落脚点，是我们党区别于其他一切政党的根本标志。检验党的一切工作的成效，最终要以最广大人民根本利益为最高标准。\n⑤坚持群众路线，就要保持党同人民群众的血肉联系。党风问题、党同人民群众的联系问题关系党的生死存亡。\n📎 课件\"自编版\"答题模板（第 13 页，\"如果丢弃了……就会……\"的因果展开写法；第④条课件原文即留白待课堂补充）：\n① 群众路线，就是一切为了群众，一切依靠群众，从群众中来，到群众中去，把党的正确主张变为群众的自觉行动。\n② 群众路线是我们党的生命线和根本工作路线。如果丢弃了这条根本工作路线，党就会失去扎根群众的土壤、丧失攻坚克难的力量。\n③ 群众路线本质上体现的是马克思主义关于人民群众是历史的创造者这一基本原理。因为人民是推动历史发展的根本力量，所以坚持群众路线是践行马克思主义立场的必然要求。\n④ 坚持群众路线，就要坚持全心全意为人民服务的根本宗旨。全心全意为人民服务是我们党的工作宗旨。只有坚守这一宗旨，才能始终站稳人民立场，夯实党的执政根基，才能……，才能……。\n⑤ 坚持群众路线，就要保持党同人民群众的血肉联系。如果脱离了人民群众，党就会失去生命力，就无法经受住长期执政的考验。","warn":""},{"id":"a5021db4f4","num":36,"type":"论述","supp":false,"stem":"论述新发展理念的内容和贯彻要求。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）新发展阶段必须坚定不移贯彻创新、协调、绿色、开放、共享的发展理念。创新是引领发展的第一动力，创新发展注重的是解决发展动力问题。协调是持续健康发展的内在要求，协调发展注重的是解决发展不平衡问题。绿色是永续发展的必要条件和人民对美好生活追求的重要体现，绿色发展注重的是解决人与自然和谐共生问题。开放是国家繁荣发展的必由之路，开放发展注重的是解决发展内外联动问题。共享是中国特色社会主义的本质要求，共享发展注重的是解决社会公平正义问题。\n（2）一是从根本宗旨把握新发展理念；二是从问题导向把握新发展理念；三是从忧患意识把握新发展理念。\n📎 课件记忆口诀（第 56 页\"必须要会回答的问题 4\"）：新发展理念内涵——\n1. **创新**是引领发展的**第一动力**【解决发展动力问题】（口诀：心动）\n2. **协调**是持续健康发展的**内在要求**【解决发展不平衡问题】（口诀：内调）\n3. **绿色**是永续发展的**必要条件**【解决人与自然和谐问题】（口诀：绿箭）\n4. **开放**是国家繁荣的**必由之路**【解决发展内外联动问题】（口诀：开路/开由/揩油）\n5. **共享**是中国特色社会主义的**本质要求**【解决社会公正问题】（口诀：本宫）\n总口诀：**本宫揩油，心动了，用绿箭内调。**\n另注（红字）：贯彻新发展理念，新发展理念所体现的发展思想的中心是**以人民为中心**。","warn":""},{"id":"10e2b11455","num":7,"type":"材料","supp":false,"stem":"问题： （1）结合材料，谈谈中国式现代化的特征。 （2）结合材料，阐明你对\"全过程人民民主是社会主义民主的本质属性\"的理解。 **材料一** 党的二十大擘画了以中国式现代化全面推进中华民族伟大复兴的宏伟蓝图。中国式现代化是中国共产党领导的社会主义现代化，既有各国现代化的共同特征，更有基于自己国情的鲜明特色。 从历史脉络看，新中国成立后，我们党提出\"四个现代化\"目标，集中力量推进工业化，为现代化建设奠定了重要物质基础；改革开放后，我们党立足社会主义初级阶段基本国情，强调发展是硬道理，推动现代化建设在经济、政治、文化等领域全面展开，人民生活水平大幅提升；进入新时代，我们党统筹推进\"五位一体\"总体布局、协调推进\"四个全面\"战略布局，在高质量发展中促进共同富裕，推动物质文明和精神文明相协调，人与自然和谐共生的现代化图景日益清晰，中国式现代化在理论和实践上都实现了新的突破。 **材料二** 全过程人民民主是中国民主的本质特征，是最广泛、最真实、最管用的民主。它深深扎根于中国社会土壤，体现了人民当家作主的社会主义民主政治本质。 在制度层面，我国通过人民代表大会制度保障人民通过选举、投票行使权利，通过立法听证、民意调查等形式让人民广泛参与国家事务管理；通过政党协商、人大协商、基层协商等多种协商渠道，使人民的意愿在决策、执行、监督等各个环节得到体现。在实践层面，从城乡社区的议事协商到企事业单位的民主管理，从人大代表联系群众制度到基层群众自治中的\"有事好商量\"，人民群众能够直接或间接地参与国家和社会事务，真正实现了\"民主选举、民主协商、民主决策、民主管理、民主监督\"的全链条覆盖，确保民主不是形式上的点缀，而是实实在在的人民权利。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）中国式现代化是社会主义现代化，是独具特色、有别于资本主义的现代化。中国式现代化是发展中国家的现代化，开辟了后发国家走向现代化的崭新道路。中国式现代化具有以下五个特征：\n第一，中国的现代化是人口规模巨大的现代化。\n第二，中国的现代化是全体人民共同富裕的现代化。\n第三，中国的现代化是物质文明和精神文明相协调的现代化。\n第四，中国的现代化是人与自然和谐共生的现代化。\n第五，中国的现代化是走和平发展道路的现代化。\n【注意：考生自行结合材料，答案合理酌情给分。】\n①我国是人民民主专政的社会主义国家，本质是人民当家作主。党的领导是人民当家作主的政治保证。社会主义民主是全过程人民民主，是最广泛、最真实、最管用的民主。\n②全过程人民民主是全体人民的民主，坚持以人民为中心，坚持人民至上，保证人民当家作主。我国不断健全人民当家作主的制度体系，扩大人民有序政治参与，发挥人民群众积极性、主动性、创造性。\n③推进全过程人民民主的生动实践，是发挥中国特色社会主义制度优势，推进国家治理体系和治理能力现代化的有益探索。\n【注意：考生自行结合材料，答案合理酌情给分。】","warn":""}],"keyed":8,"doubts":0},{"id":"押题卷03","name":"押题卷3","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"押题卷03","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"8934d6268a","lessonId":"押题卷03","kind":"choice","question":"中国共产党第二十届中央委员会第四次全体会议于 2025 年 10 月 20 日至 23 日在北京举行。全会最重要的成果是（ ）","options":[{"value":"A","text":"高度评价\"十四五\"时期我国发展取得的重大成就"},{"value":"B","text":"明确提出 2035 年全面建成社会主义现代化强国的具体时间表"},{"value":"C","text":"审议通过了《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》"},{"value":"D","text":"审议通过了《中共中央关于进一步全面深化改革、推进中国式现代化的决定》"}],"answer":["C"],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 判定·非原卷答案：二十届四中全会最重要的成果是审议通过《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》；D 项为二十届三中全会的成果。可对照库内 时政-专题背诵版 四中全会专题","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"中国共产党第二十届中央委员会第四次全体会议于 2025 年 10 月 20 日至 23 日在北京举行。全会最重要的成果是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"adc41ed38e","lessonId":"押题卷03","kind":"choice","question":"《市场准入负面清单（2025 年版）》指出，负面清单管理模式最核心的要求是（ ）","options":[{"value":"A","text":"\"全国统一\""},{"value":"B","text":"\"事权法定\""},{"value":"C","text":"\"公开透明\""},{"value":"D","text":"\"非禁即入\""}],"answer":["D"],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 判定·非原卷答案：负面清单管理模式的核心是\"非禁即入\"，清单之外市场主体可依法平等进入；可对照库内 时政-专题背诵版","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"《市场准入负面清单（2025 年版）》指出，负面清单管理模式最核心的要求是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"145fe044e5","lessonId":"押题卷03","kind":"choice","question":"2025 年 4 月，国务院新闻办公室发布《关于中美经贸关系若干问题的中方立场》白皮书，系统阐述了中方对中美经贸关系的政策立场。白皮书指出，中美经贸关系的本质是（ ）","options":[{"value":"A","text":"竞争博弈"},{"value":"B","text":"互利共赢"},{"value":"C","text":"相互依存"},{"value":"D","text":"合作制约"}],"answer":["B"],"explanation":"**讲解（课件第28页）**：2025 年 4 月发布的《关于中美经贸关系若干问题的中方立场》白皮书第一部分明确指出：中美经贸关系的本质是互利共赢。 **延伸·书本知识点（课件第29-30页）**：推动构建新型国际关系，就是要秉持相互尊重、公平正义、合作共赢原则，走出一条对话而不对抗、结伴而不结盟的国与国交往新路；中国坚持在和平共处五项原则基础上同各国发展友好合作，深化拓展平等、开放、合作的全球伙伴关系。要推进大国协调合作，构建和平共处、总体稳定、均衡发展的大国关系格局；坚持亲诚惠容和与邻为善、以邻为伴周边外交方针，深化同周边国家友好互信和利益融合；秉持真实亲诚理念和正确义利观，加强同发展中国家团结合作；秉持求同存异、相互尊重、互学互鉴理念，构建新型政党关系。 **记忆口诀**：大国稳均合，周边亲诚邻，发展真诚义，政党求尊重。","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025 年 4 月，国务院新闻办公室发布《关于中美经贸关系若干问题的中方立场》白皮书，系统阐述了中方对中美经贸关系的政策立场。白皮书指出，中美经贸关系的本质是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"b6b3b14fd6","lessonId":"押题卷03","kind":"choice","question":"今年是中国同欧盟建交 50 周年，中欧建交 50 年来，交流合作成果丰硕，既成就彼此又惠及世界，其中的重要经验和启示就是（ ）","options":[{"value":"A","text":"平等相待、求同存异、互利合作"},{"value":"B","text":"守望相助、对外开放、互利共赢、公道正义、交流互鉴"},{"value":"C","text":"创新驱动、开放包容、公平公正、共同繁荣"},{"value":"D","text":"相互尊重、求同存异、开放合作、互利共赢"}],"answer":["D"],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：2025 年 5 月 6 日习近平同科斯塔、冯德莱恩互致贺电指出，中欧建交 50 年发展历程的重要经验和启示就是\"相互尊重、求同存异、开放合作、互利共赢\"；来源：新华网/外交部","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"今年是中国同欧盟建交 50 周年，中欧建交 50 年来，交流合作成果丰硕，既成就彼此又惠及世界，其中的重要经验和启示就是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"eb9435de33","lessonId":"押题卷03","kind":"choice","question":"（ ）开始改变了起义军中旧军队的习气和不良作风，从组织上确立了党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。","options":[{"value":"A","text":"三湾改编"},{"value":"B","text":"北伐战争"},{"value":"C","text":"遵义会议"},{"value":"D","text":"南昌起义"}],"answer":[],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"（ ）开始改变了起义军中旧军队的习气和不良作风，从组织上确立了党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。"},{"schemaVersion":1,"contentVersion":1,"id":"289e80a1b9","lessonId":"押题卷03","kind":"choice","question":"近代中国社会进步和发展的最大障碍是（ ）","options":[{"value":"A","text":"封建土地所有制和专制统治"},{"value":"B","text":"买办的、封建的、垄断的资本主义"},{"value":"C","text":"在革命关键时刻表现出明显动摇性的民族资产阶级"},{"value":"D","text":"帝国主义发动的一系列侵略战争"}],"answer":["D"],"explanation":"**讲解·近代中国知识点归纳（课件第34-36页）** 一、社会性质：半殖民地半封建社会 二、最主要矛盾：帝国主义和中华民族的矛盾（最主要）；封建主义和人民大众的矛盾 三、两大历史任务：民族独立、人民解放；国家富强、人民富裕 四、最大障碍/最凶恶敌人：帝国主义侵略 五、革命性质：资产阶级民主革命；五四运动后：新民主主义革命 新民主主义革命：开端——五四运动；领导力量——无产阶级（通过中国共产党）；指导思想——马克思主义；革命对象——帝国主义、封建主义、官僚资本主义；革命动力——工人、农民、小资产阶级、民族资产阶级；农民是中国革命的主力军，无产阶级是中国革命的领导阶级。","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"依据课件第35页知识点归纳：\"近代中国发展的最大障碍：帝国主义侵略\"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"近代中国社会进步和发展的最大障碍是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"be41f50523","lessonId":"押题卷03","kind":"choice","question":"1987 年召开的党的（ ），第一次比较系统地论述了我国社会主义初级阶段理论，明确概括和全面阐发了党的\"一个中心、两个基本点\"的基本路线。","options":[{"value":"A","text":"十二大"},{"value":"B","text":"十三大"},{"value":"C","text":"十四大"},{"value":"D","text":"十五大"}],"answer":[],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"1987 年召开的党的（ ），第一次比较系统地论述了我国社会主义初级阶段理论，明确概括和全面阐发了党的\"一个中心、两个基本点\"的基本路线。"},{"schemaVersion":1,"contentVersion":1,"id":"413864bb92","lessonId":"押题卷03","kind":"choice","question":"走中国工业化道路，必须调整和完善所有制结构。陈云提出的设想是（ ）","options":[{"value":"A","text":"\"三个主体，三个补充\""},{"value":"B","text":"\"两参一改三结合\""},{"value":"C","text":"\"两种劳动制度、两种教育制度\""},{"value":"D","text":"\"实行职工代表大会制度\""}],"answer":["A"],"explanation":"**讲解（课件第39页）**：陈云提出了\"三个主体，三个补充\"的设想，即在工商业经营方面，国家经营和集体经营是工商业的主体，一定数量的个体经营是国家经营和集体经营的补充；在生产计划方面，计划生产是工农业生产的主体，按照市场变化在国家计划许可范围内的自由生产是计划生产的补充；在社会主义的统一市场里，国家市场是它的主体，一定范围内国家领导的自由市场是国家市场的补充。","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"走中国工业化道路，必须调整和完善所有制结构。陈云提出的设想是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"bb146bb566","lessonId":"押题卷03","kind":"choice","question":"对思想政治领域里的人民内部矛盾实行的方针是（ ）","options":[{"value":"A","text":"百花齐放、百家争鸣"},{"value":"B","text":"团结—批评—团结"},{"value":"C","text":"长期共存、互相监督"},{"value":"D","text":"肝胆相照、荣辱与共"}],"answer":["B"],"explanation":"**讲解·矛盾性质与处理方法（课件第40页）** | 矛盾性质 | 处理方法 | | --- | --- | | 敌我矛盾（对抗性） | 专政 | | 人民内部矛盾（非对抗性、主导地位） | 基本方法：民主 | 人民内部矛盾总方针（分领域）： - 政治思想：团结—批评—团结［思想不好得批评］ - 科学文化：百花齐放、百家争鸣［化—花］ - 党派间：长期共存、互相监督［共—共］ - 物质利益分配：统筹兼顾、适当安排［穷富得顾］ - 人民群众和政府机关：民主集中制［民—民］ - 民族：民族平等、团结互助［民族—民族］","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"对思想政治领域里的人民内部矛盾实行的方针是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"b4570 perTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"在保障和改善民生中，最大的、最基本的民生是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"13e023b8ff","lessonId":"押题卷03","kind":"choice","question":"（ ）是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量。","options":[{"value":"A","text":"国有企业"},{"value":"B","text":"集体企业"},{"value":"C","text":"个体经济"},{"value":"D","text":"私营经济"}],"answer":[],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"（ ）是中国特色社会主义的重要物质基础和政治基础，是我们党执政兴国的重要支柱和依靠力量。"},{"schemaVersion":1,"contentVersion":1,"id":"789ae2fc67","lessonId":"押题卷03","kind":"choice","question":"加快建设世界一流军队，有效履行我军的根本职能，需要牢固树立的唯一的根本标准是（ ）","options":[{"value":"A","text":"执行力"},{"value":"B","text":"战斗力"},{"value":"C","text":"竞争力"},{"value":"D","text":"判断力"}],"answer":[],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"加快建设世界一流军队，有效履行我军的根本职能，需要牢固树立的唯一的根本标准是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"842caf536e","lessonId":"押题卷03","kind":"choice","question":"（ ）是改革开放的鲜明特征和首要任务，也是新时代贯彻新发展理念、构建新发展格局、推动高质量发展的必然要求。","options":[{"value":"A","text":"解放和发展社会生产力"},{"value":"B","text":"解放和增强社会活力"},{"value":"C","text":"促进人的全面发展"},{"value":"D","text":"维护社会公平正义"}],"answer":[],"explanation":"**讲解·社会主义改革开放理论要点（课件第44-46页）** 1. 党的十一届三中全会作出把党和国家工作中心转移到经济建设上来、实行改革开放的历史性决策，实现了新中国成立以来党的历史上具有深远意义的伟大转折，开启了改革开放和社会主义现代化的伟大征程。 2. 改革是一场深刻的社会变革，是中国的第二次革命，是实现中国现代化的必由之路。 3. 改革是社会主义社会发展的直接动力。 4. 改革是一项崭新的事业，是一个大试验。改革中难免遇到这样那样的风险，胆子要大，步子要稳。判断改革和各方面是非得失，归根到底，主要看是否有利于发展社会主义社会的生产力，是否有利于增强社会主义国家的综合国力，是否有利于提高人民生活水平，即\"三个有利于\"。\"三个有利于\"标准是内在统一的，发展社会主义社会的生产力是首要的也是最根本的一条。 5. 开放也是改革，对外开放是建设中国特色社会主义的一项基本国策，和改革一起成为新时期最鲜明的特征。1984 年 10 月，党的十二届三中全会把实行对外开放作为基本国策。对外开放是对世界所有国家的开放，包括对发达国家的开放，也包括对发展中国家的开放；不仅是经济领域的开放，还包括科技、教育、文化等领域的开放。 6. 我国改革从农村实行家庭联产承包责任制率先突破，逐步转向城市经济体制改革并全面铺开；开放从兴办深圳等经济特区、开发开放浦东、推动沿海沿边沿江沿线和内陆中心城市对外开放到加入世界贸易组织，实现了从高度集中的计划经济体制到充满活力的社会主义市场经济体制、从封闭半封闭到全方位开放的历史性转变。 7. 实践证明，改革开放是当代中国的鲜明标志和活力源泉，是决定中国命运的关键一招，也是实现中华民族伟大复兴的关键一招。改革开放只有进行时，没有完成时，必须毫不动摇地坚持。 **延伸·\"必由之路\"总结（课件第47页）** 1. 坚持党的全面领导/改革开放是坚持和发展中国特色社会主义的必由之路； 2. 全面从严治党是党永葆生机活力、走好新的赶考之路的必由之路； 3. 团结奋斗是中国共产党和中国人民最显著的精神标识，是中国人民创造历史伟业的必由之路； 4. 中国特色社会主义是实现中华民族伟大复兴的必由之路（坚定道路自信，就是坚信中国特色社会主义道路是我国实现社会主义现代化、创造人民美好生活的必由之路，是实现中华民族伟大复兴的必由之路）； 5. 贯彻新发展理念是新时代我国发展壮大的必由之路； 6. 开放是国家繁荣发展的必由之路； 7. 自力更生是中华民族自立于世界民族之林的奋斗基点，自主创新是我们攀登世界科技高峰的必由之路； 8. 依法治港治澳，是全面依法治国的应有之义，是全面准确贯彻\"一国两制\"方针的必由之路。","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"（ ）是改革开放的鲜明特征和首要任务，也是新时代贯彻新发展理念、构建新发展格局、推动高质量发展的必然要求。"},{"schemaVersion":1,"contentVersion":1,"id":"be353b3257","lessonId":"押题卷03","kind":"choice","question":"维护我国国家利益，放在第一位的是（ ）","options":[{"value":"A","text":"世界和谐与繁荣"},{"value":"B","text":"外交宗旨"},{"value":"C","text":"国家主权和安全"},{"value":"D","text":"相互尊重"}],"answer":[],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"维护我国国家利益，放在第一位的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"7a9c0a827b","lessonId":"押题卷03","kind":"choice","question":"新发展理念具有丰富的科学内涵和具体的实践要求。在新发展理念中，注重解决发展内外联动问题的是（ ）","options":[{"value":"A","text":"创新"},{"value":"B","text":"开放"},{"value":"C","text":"协调"},{"value":"D","text":"共享"}],"answer":["B"],"explanation":"**讲解·新发展理念内涵（课件第49页）**：贯彻新发展理念是新时代我国发展壮大的必由之路。 1. 创新是引领发展的第一动力【解决发展动力问题】 2. 协调是持续健康发展的内在要求【解决发展不平衡问题】 3. 绿色是永续发展的必要条件【解决人与自然和谐问题】 4. 开放是国家繁荣的必由之路【解决发展内外联动问题】 5. 共享是中国特色社会主义的本质要求【解决社会公正问题】 **记忆口诀**：本宫揩油，心动了，用绿箭内调。","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"新发展理念具有丰富的科学内涵和具体的实践要求。在新发展理念中，注重解决发展内外联动问题的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"016c9159eb","lessonId":"押题卷03","kind":"choice","question":"党的十九届五中全会首次把统筹发展和安全纳入\"十四五\"时期我国经济社会发展的指导思想，党的二十大强调\"统筹发展和安全\"，并将其写入党章。以习近平同志为核心的党中央着眼统筹发展和安全、把握国家安全主动权，明确提出加快构建新安全格局。其中，安全解决的是（ ）","options":[{"value":"A","text":"策略问题"},{"value":"B","text":"动力问题"},{"value":"C","text":"方向问题"},{"value":"D","text":"保障问题"}],"answer":[],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案（课件题干中将\"统筹发展和安全\"标红强调，但未标注选项）","grp":"题库","legacyQuestion":"党的十九届五中全会首次把统筹发展和安全纳入\"十四五\"时期我国经济社会发展的指导思想，党的二十大强调\"统筹发展和安全\"，并将其写入党章。以习近平同志为核心的党中央着眼统筹发展和安全、把握国家安全主动权，明确提出加快构建新安全格局。其中，安全解决的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"f200b5febf","lessonId":"押题卷03","kind":"choice","question":"把（ ）纳入中国特色社会主义法治体系，是我国法治区别于其他国家法治的鲜明特征。","options":[{"value":"A","text":"法治监督体系"},{"value":"B","text":"党内法规体系"},{"value":"C","text":"法律规范体系"},{"value":"D","text":"法治实施体系"}],"answer":[],"explanation":"","chapter":"押题卷3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"把（ ）纳入中国特色社会主义法治体系，是我国法治区别于其他国家法治的鲜明特征。"},{"schemaVersion":1,"contentVersion":1,"id":"31e795cdf5","lessonId":"押题卷03","kind":"choice","question":"2025 年 9 月 1 日上午，上海合作组织成员国元首理事会第二十五次会议在天津梅江会展中心举行。习近平指出，24 年来，成员国秉持这一初心，共享机遇、共谋发展，推动上海合作组织建设和合作取得一系列开创性成果、历史性成就。这些开创性成果、历史性成就包括（ ）","options":[{"value":"A","text":"率先建立边境地区军事领域信任机制"},{"value":"B","text":"率先启动共建\"一带一路\"合作"},{"value":"C", alse,"stem":"新民主主义社会主要的经济成分是三种：社会主义经济、个体经济和资本主义经济。","options":[],"answer":null,"src":"","exp":"","warn":"课件未给出参考答案"},{"id":"daa7372fd9","num":32,"type":"辨析","supp":false,"stem":"党在过渡时期总路线的主要内容被概括为\"一化三改\"。","options":[],"answer":null,"src":"","exp":"","warn":"课件未给出参考答案"},{"id":"ddf9f0c48a","num":33,"type":"简答","supp":false,"stem":"如何理解坚持在发展中增进民生福祉？","options":[],"answer":null,"src":"","exp":"**考场应急思路（课件第64页）**——假设考场上记不住这个知识点的核心要点，比如可以从以下角度组织：\n- 发展是基础，民生是目的。\n- 以人民为中心，在发展中保障和改善民生。\n- 解决民生问题，促进公平正义、共同富裕。","warn":"课件未给出标准参考答案，仅给出考场应急思路（课件第64页）："},{"id":"e34bcd5313","num":34,"type":"简答","supp":false,"stem":"简述社会主义初级阶段的科学内涵。","options":[],"answer":null,"src":"","exp":"","warn":"课件未给出参考答案"},{"id":"64af006a97","num":35,"type":"简答","supp":false,"stem":"简述习近平新时代中国特色社会主义思想的历史地位。","options":[],"answer":null,"src":"","exp":"","warn":"课件未给出参考答案"},{"id":"80c79f6966","num":36,"type":"论述","supp":false,"stem":"论述中国特色大国外交坚持的原则要求。","options":[],"answer":null,"src":"","exp":"","warn":"课件未给出参考答案（可结合第3题延伸知识点\"新型国际关系/大国关系口诀\"作答，并参考附录B论述题模板）"},{"id":"0231361cc3","num":37,"type":"材料","supp":false,"stem":"结合材料回答问题： **材料一**（摘自习近平总书记《求是》杂志重要文章《朝着建成科技强国的宏伟目标奋勇前进》）： 科技兴则民族兴，科技强则国家强。科技强国是把握新一轮科技革命和产业变革重大机遇的必然选择，是应对风险挑战和赢得国际竞争主动权的现实之需，更是强国建设、民族复兴的战略支撑。 （课件附白话解读：科技发展直接关系民族兴衰与国家强弱，建设科技强国至关重要：它是抓住新一轮科技革命与产业变革机遇的必然选择，是应对各类风险挑战、在国际竞争中掌握主动权的现实需要，更是强国建设与民族复兴的关键战略支撑。） **材料二**（摘自习近平总书记《求是》杂志重要文章《朝着建成科技强国的宏伟目标奋勇前进》）： 建设科技强国必须坚持八大重要经验，包括坚持党的全面领导、走中国特色自主创新道路、创新引领发展、\"四个面向\"战略导向等。科技强国应具备五大基本要素：强大的基础研究和原始创新能力、关键核心技术攻关能力、国际影响力和引领力、高水平科技人才培养集聚能力、科技治理体系和治理能力。实现这一目标，要充分发挥新型举国体制优势，推动科技创新与产业创新深度融合，全面深化科技体制机制改革，一体推进教育科技人才事业发展，推动科技开放合作造福人类。 （课件附白话解读：实现这一目标，要发挥新型举国体制优势，推动科技与产业创新融合，深化科技体制改革，统筹推进教育、科技、人才一体化发展，并加强科技开放合作。） **材料三**（摘自党的二十大报告）： 坚持创新在我国现代化建设全局中的核心地位，加快实现高水平科技自立自强，加快建设科技强国。科技自立自强不仅是发展问题，更是生存问题，是国家强盛之基、安全之要。实现高水平科技自立自强，能够有效破解\"卡脖子\"技术难题，保障产业链供应链安全，为构建新发展格局提供战略支撑；同时，通过持续提升自主创新能力，不断夯实科技强国的根基，推动科技创新从量的积累向质的飞跃、从点的突破向系统能力提升转变，最终实现科技强国的战略目标。可以说，没有高水平科技自立自强，就没有真正意义上的科技强国。 （课件附白话解读：我国要把创新放在现代化建设核心位置，加快实现高水平科技自立自强、建设科技强国。科技自立自强是国家强盛、安全的关键，能破解\"卡脖子\"难题、保障产业链安全，推动科技创新整体提升，是建成科技强国的根本前提。） **（1）以上材料说明了什么？**","options":[],"answer":"（见下方解析）","src":"课件第72页全文","exp":"答：\n以上材料说明了：\n建设科技强国是民族复兴、国家强盛的战略支撑，是应对国际竞争、把握科技革命机遇的必然要求。\n建设科技强国必须坚持党的领导、自主创新、\"四个面向\"等重要经验，具备强大创新能力、关键核心技术攻关、人才集聚、国际影响力与科技治理等基本要素，要发挥举国体制优势，统筹教育、科技、人才一体化发展。必须把创新摆在现代化建设全局核心地位，实现高水平科技自立自强，破解\"卡脖子\"问题，保障国家发展与安全，这是建成科技强国的根本前提。\n**（2）请说说如何加快建设科技强国？**\n答：\n①坚持党的全面领导，坚持中国特色自主创新道路，落实\"四个面向\"战略导向。\n②强化国家战略科技力量，加强基础研究和原始创新，坚决打赢关键核心技术攻坚战。\n③发挥新型举国体制优势，深化科技体制改革，促进科技创新与产业创新深度融合。\n④坚持教育、科技、人才一体化推进，培养集聚高水平科技人才。\n⑤加快实现高水平科技自立自强，破解\"卡脖子\"问题，保障产业链供应链安全。\n⑥扩大科技开放合作，提升国际科技影响力与引领力。","warn":""}],"keyed":11,"doubts":0},{"id":"模拟课3","name":"模拟课3","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"模拟课3","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"046804a8bd","lessonId":"模拟课3","kind":"choice","question":"1840 年鸦片战争之后，近代中国社会最主要的矛盾是 ______。","options":[{"value":"A","text":"帝国主义和中华民族的矛盾"},{"value":"B","text":"封建主义和人民大众的矛盾"},{"value":"C","text":"生产力和生产关系的矛盾"},{"value":"D","text":"经济基础和上层建筑的矛盾"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"1840 年鸦片战争之后，近代中国社会最主要的矛盾是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"dbb30d6688","lessonId":"模拟课3","kind":"choice","question":"党的 ______ 全面阐发了党在社会主义初级阶段的基本路线可以概括为\"一个中心，两个基本点\"。","options":[{"value":"A","text":"十三大"},{"value":"B","text":"十三届四中全会"},{"value":"C","text":"十四大"},{"value":"D","text":"十二大"}],"answer":[],"explanation":"课件考点讲解（第 5 页，红字强调\"一个中心，两个基本点\"）：社会主义初级阶段的基本路线是：领导和团结全国各族人民，**以经济建设为中心，坚持四项基本原则，坚持改革开放**，自力更生，艰苦创业，为把我国建设成为富强民主文明和谐美丽的社会主义现代化强国而奋斗。（讲解未点名是哪次党代会。）","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"党的 ______ 全面阐发了党在社会主义初级阶段的基本路线可以概括为\"一个中心，两个基本点\"。"},{"schemaVersion":1,"contentVersion":1,"id":"00d7978643","lessonId":"模拟课3","kind":"choice","question":"走中国工业化道路，毛泽东提出\"两参一改三结合\"等重要思想，\"两参一改三结合\"中的\"一改\"是 ______","options":[{"value":"A","text":"改革财产分配制度"},{"value":"B","text":"改革不合理的规章制度"},{"value":"C","text":"改革所有制结构"},{"value":"D","text":"改革经济运行体制机制"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"走中国工业化道路，毛泽东提出\"两参一改三结合\"等重要思想，\"两参一改三结合\"中的\"一改\"是 ______"},{"schemaVersion":1,"contentVersion":1,"id":"013fef125c","lessonId":"模拟课3","kind":"choice","question":"改革开放和社会主义现代化建设新时期创立的邓小平理论的精髓是 ______","options":[{"value":"A","text":"一切从理论出发"},{"value":"B","text":"解放思想，实事求是"},{"value":"C","text":"一切从观念出发"},{"value":"D","text":"拨乱反正，正本清源"}],"answer":[],"explanation":"课件补充（第 8 页）：所谓精髓，对于理论而言，指的是能使这一理论得以形成和发展并贯穿始终，同时又体现在这一理论中最本质的东西。","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"改革开放和社会主义现代化建设新时期创立的邓小平理论的精髓是 ______"},{"schemaVersion":1,"contentVersion":1,"id":"5753e4ab4b","lessonId":"模拟课3","kind":"choice","question":"基于当代中国基本国情，党作出了我国处于社会主义初级阶段的科学判断。这一阶段指的是 ______","options":[{"value":"A","text":"我国实现四个现代化之后的阶段"},{"value":"B","text":"社会主义经济基础尚未奠定的过渡时期"},{"value":"C","text":"任何国家进入社会主义都会经历的起始阶段"},{"value":"D","text":"我国在生产力落后，商品经济不发达条件下建设社会主义必然要经历的特定阶段"}],"answer":["D"],"explanation":"课件解析（第 10 页红字标注）：党的十三大系统地阐述了社会主义初级阶段的科学内涵。首先，阐明了社会主义初级阶段这个论断包括两层含义：第一，我国社会已经是社会主义社会，我们必须坚持而不能离开社会主义；第二，我国的社会主义社会还处在初级阶段，我们必须从这个实际出发，而不能超越这个阶段。其次，强调了社会主义初级阶段的长期性——我国社会主义的初级阶段，不是泛指任何国家进入社会主义都会经历的起始阶段，而是**特指我国在生产力落后、商品经济不发达条件下建设社会主义必然要经历的特定阶段**。最后，阐述了社会主义初级阶段的基本特征：这一阶段既不同于社会主义经济基础尚未奠定的过渡时期，又不同于已经实现社会主义现代化的阶段；总起来说，是逐步摆脱贫穷、摆脱落后的阶段，是由农业人口占多数的手工劳动为基础的农业国逐步变为非农产业人口占多数的现代化的工业国的阶段，是由自然经济半自然经济占很大比重变为商品经济高度发达的阶段，是通过改革和探索建立和发展充满活力的社会主义经济、政治、文化体制的阶段，是全民奋起、艰苦创业、实现中华民族伟大复兴的阶段。","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"基于当代中国基本国情，党作出了我国处于社会主义初级阶段的科学判断。这一阶段指的是 ______"},{"schemaVersion":1,"contentVersion":1,"id":"84b6889595","lessonId":"模拟课3","kind":"choice","question":"我国对农业的社会主义改造采取的过渡形式是 ______。","options":[{"value":"A","text":"初级社、互助组、高级社"},{"value":"B","text":"高级社、初级社、互助组"},{"value":"C","text":"互助组、高级社、初级社"},{"value":"D","text":"互助组、初级社、高级社"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"我国对农业的社会主义改造采取的过渡形式是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"c15e9acbd5","lessonId":"模拟课3","kind":"choice","question":"中共八大提出我国国内的主要矛盾是 ______。","options":[{"value":"A","text":"无产阶级与资产阶级的矛盾"},{"value":"B","text":"社会主义道路与资本主义道路的矛盾"},{"value":"C","text":"先进的生产关系与落后的生产力之间的矛盾"},{"value":"D","text":"人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要之间的矛盾"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"中共八大提出我国国内的主要矛盾是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"b8a1e36435","lessonId":"模拟课3","kind":"choice","question":"\"三个代表\"重要思想用一系列紧密联系、相互贯通的新思想、新观点、新论断进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性地回答了 ______ 的问题。","options":[{"value":"A","text":"什么是马克思主义，怎样坚持和发展马克思主义"},{"value":"B","text":"什么是社会主义，怎样建设社会主义"},{"value":"C","text":"什么是小康社会，怎样建设小康社会"},{"value":"D","text":"建设什么样的党，怎样建设党"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"\"三个代表\"重要思想用一系列紧密联系、相互贯通的新思想、新观点、新论断进一步回答了什么是社会主义、怎样建设社会主义的问题，创造性地回答了 ______ 的问题。"},{"schemaVersion":1,"contentVersion":1,"id":"757c901424","lessonId":"模拟课3","kind":"choice","question":"我国改革的性质是 ______。","options":[{"value":"A","text":"从根本上改变社会主义基本制度"},{"value":"B","text":"一个阶级推翻另一个阶级统治的政治斗争"},{"value":"C","text":"用市场调节代替计划调节"},{"value":"D","text":"社会主义制度的自我完善和发展"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"我国改革的性质是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"848c41b2a1","lessonId":"模拟课3","kind":"choice","question":"中国共产党首次提出\"解放台湾\"的口号，是 1949 年 3 月新华社发表在 ______ 的时评中提出的。","options":[{"value":"A","text":"《中国人民一定要解放台湾》"},{"value":"B","text":"《别了，司徒雷登》"},{"value":"C","text":"《论持久战》"},{"value":"D","text":"《实践论》"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"中国共产党首次提出\"解放台湾\"的口号，是 1949 年 3 月新华社发表在 ______ 的时评中提出的。"},{"schemaVersion":1,"contentVersion":1,"id":"8fa2238795","lessonId":"模拟课3","kind":"choice","question":"\"一国两制\"的构想提出当初是为了解决 ______。","options":[{"value":"A","text":"台湾问题"},{"value":"B","text":"香港问题"},{"value":"C","text":"澳门问题"},{"value":"D","text":"港澳问题"}],"answer":[],"explanation":"课件考点讲解（第 17 页，红字强调）：**坚持一个中国**，这是\"和平统一、一国两制\"的核心，是发展两岸关系和实现和平统一的基础；**两制并存**，在祖国统一的前提下，国家的主体部分实行社会主义制度，同时在香港、澳门、台湾保持原有的社会制度和生活方式长期不变；**高度自治**，祖国完全统一后，香港、澳门、台湾作为中央政府全面管辖下的特别行政区，享有不同于中国其他省、市、自治区的高度自治权，台湾、香港、澳门同胞各种合法权益将得到切实尊重和维护；**尽最大努力争取和平统一，但不承诺放弃使用武力**；解决台湾问题，实现祖国完全统一，**寄希望于台湾人民**。（讲解未直接点名答案。）","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"\"一国两制\"的构想提出当初是为了解决 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"3c6ef6f4f0","lessonId":"模拟课3","kind":"choice","question":"人民民主是社会主义的生命。没有民主就没有社会主义，就没有社会主义的现代化，就没有中华民族伟大复兴。社会主义愈发展，民主也愈发展。在前进道路上，要坚定不移走中国特色社会主义政治发展道路，继续推进社会主义民主政治建设、发展社会主义政治文明。社会主义民主政治的本质和核心是 ______。","options":[{"value":"A","text":"人民当家作主"},{"value":"B","text":"多党合作"},{"value":"C","text":"基层民主"},{"value":"D","text":"全过程民主"}],"answer":["A"],"explanation":"课件讲解（第 19 页，开篇加粗直接给出）：**社会主义民主政治的本质和核心是人民当家作主。** 发展社会主义民主政治，必须坚定不移地走中国特色社会主义政治发展道路。世界上没有完全相同的政治模式，没有也不可能有一种放之四海而皆准的政治发展道路。中国特色社会主义政治发展道路，深深植根于中华民族几千年来赖以生存和发展的广阔沃土，是党带领人民通过长期实践找到的正确道路。坚持中国特色社会主义政治发展道路，最根本的是要坚持党的领导、人民当家作主、依法治国有机统一，其中，党的领导是人民当家作主和依法治国的根本保证，人民当家作主是社会主义民主政治的本质和核心，依法治国是党领导人民治理国家的基本方略。","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"人民民主是社会主义的生命。没有民主就没有社会主义，就没有社会主义的现代化，就没有中华民族伟大复兴。社会主义愈发展，民主也愈发展。在前进道路上，要坚定不移走中国特色社会主义政治发展道路，继续推进社会主义民主政治建设、发展社会主义政治文明。社会主义民主政治的本质和核心是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"b04115a7d4","lessonId":"模拟课3","kind":"choice","question":"党的十七大通过的党章把\"和谐\"与\"富强、民主、文明\"一起作为社会主义现代化建设的目标写入了社会主义初级阶段的基本路线。其原因在于社会和谐是 ______。","options":[{"value":"A","text":"中国特色社会主义的本质属性"},{"value":"B","text":"中国传统文化的价值取向"},{"value":"C","text":"经济建设的内在要求"},{"value":"D","text":"解决收入分配差距的重要途径"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"党的十七大通过的党章把\"和谐\"与\"富强、民主、文明\"一起作为社会主义现代化建设的目标写入了社会主义初级阶段的基本路线。其原因在于社会和谐是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"e8290461bd","lessonId":"模拟课3","kind":"choice","question":"构建新发展格局，是以习近平同志为核心的党中央积极应对国际国内形势变化、与时俱进提升我国经济发展水平、塑造国际经济合作和竞争新优势作出的战略抉择。这一新发展格局是 ______。","options":[{"value":"A","text":"以体制机制创新为主体、利用好国际国内两个市场"},{"value":"B","text":"以维护产业链供应链稳定为主体、促进国内经济复苏"},{"value":"C","text":"以国内大循环为主体、国内国际双循环相互促进"},{"value":"D","text":"以发展先进制造业为主体、促进产业结构优化升级"}],"answer":[],"explanation":"课件考点讲解（第 22 页，红字强调）：构建新发展格局，涉及我国经济发展的各个方面、各个领域，要准确把握基本要求，加强整体协调和系统布局，推动国内循环和国际循环相互促进、良性互动。构建新发展格局必须具备**强大的国内经济循环体系**和**稳固的基本盘**，保持国内经济持续健康发展，巩固和发展我国经济的强大竞争力；必须**发挥比较优势**，以**国内大循环**吸引**全球资源要素**；必须保证经济循环的**畅通无阻**，实现**生产、分配、流通、消费**各环节有机衔接。（讲解未直接点名答案。）","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"构建新发展格局，是以习近平同志为核心的党中央积极应对国际国内形势变化、与时俱进提升我国经济发展水平、塑造国际经济合作和竞争新优势作出的战略抉择。这一新发展格局是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"8c554087f8","lessonId":"模拟课3","kind":"choice","question":"习近平指出，坚持反腐败无禁区、全覆盖、零容忍，坚定不移\"打虎\"\"拍蝇\"\"猎狐\"，不敢腐的目标初步实现，不能腐的笼子越扎越牢，不想腐的堤坝正在构筑，反腐败斗争压倒性态势已经形成并巩固发展。全面从严治党的长远之策、根本之策是 ______。","options":[{"value":"A","text":"加强制度建设"},{"value":"B","text":"加强思想建设"},{"value":"C","text":"加强作风建设"},{"value":"D","text":"加强纪律建设"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"习近平指出，坚持反腐败无禁区、全覆盖、零容忍，坚定不移\"打虎\"\"拍蝇\"\"猎狐\"，不敢腐的目标初步实现，不能腐的笼子越扎越牢，不想腐的堤坝正在构筑，反腐败斗争压倒性态势已经形成并巩固发展。全面从严治党的长远之策、根本之策是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"467d564694","lessonId":"模拟课3","kind":"choice","question":"检验党的一切执政活动的最高标准是 ______。","options":[{"value":"A","text":"以人为本、执政为民"},{"value":"B","text":"始终维护最广大人民的根本利益"},{"value":"C","text":"全心全意为人民服务"},{"value":"D","text":"实现中华民族伟大复兴的中国梦"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"检验党的一切执政活动的最高标准是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"58373172cc","lessonId":"模拟课3","kind":"choice","question":"中国梦的科学内涵是 ______","options":[{"value":"A","text":"国家富强"},{"value":"B","text":"社会和谐"},{"value":"C","text":"民族振兴"},{"value":"D","text":"人民幸福"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"中国梦的科学内涵是 ______"},{"schemaVersion":1,"contentVersion":1,"id":"d2cc845b64","lessonId":"模拟课3","kind":"choice","question":"确保党始终总揽全局、协调各方，必须增强 ______，自觉维护党中央权威和集中统一领导，自觉在思想上政治上行动上同党中央保持高度一致。","options":[{"value":"A","text":"大局意识"},{"value":"B","text":"核心意识"},{"value":"C","text":"政治意识"},{"value":"D","text":"看齐意识"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"确保党始终总揽全局、协调各方，必须增强 ______，自觉维护党中央权威和集中统一领导，自觉在思想上政治上行动上同党中央保持高度一致。"},{"schemaVersion":1,"contentVersion":1,"id":"473ea23585","lessonId":"模拟课3","kind":"choice","question":"毛泽东论述新民主主义的基本纲领的文章有 ______。","options":[{"value":"A","text":"《新民主主义论》"},{"value":"B","text":"《论联合政府》"},{"value":"C","text":"《中国的红色政权为什么能够存在》"},{"value":"D","text":"《井冈山的斗争》"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"毛泽东论述新民主主义的基本纲领的文章有 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"338071e3ad","lessonId":"模拟课3","kind":"choice","question":"关于全面从严治党，下列说法正确的是 ______。","options":[{"value":"A","text":"核心是加强党的领导"},{"value":"B","text":"基础在全面"},{"value":"C","text":"关键在严"},{"value":"D","text":"要害在治"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"关于全面从严治党，下列说法正确的是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"dacd118e8b","lessonId":"模拟课3","kind":"choice","question":"新时代党的建设目标是把党建设成为 ______。","options":[{"value":"A","text":"始终走在时代前列的马克思主义执政党"},{"value":"B","text":"人民衷心拥护的马克思主义执政党"},{"value":"C","text":"勇于自我革命的马克思主义执政党"},{"value":"D","text":"经得起各种风浪考验、朝气蓬勃的马克思主义执政党"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"新时代党的建设目标是把党建设成为 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"91873081f1","lessonId":"模拟课3","kind":"choice","question":"科学发展观最鲜明的精神实质是 ______。","options":[{"value":"A","text":"解放思想"},{"value":"B","text":"实事求是"},{"value":"C","text":"与时俱进"},{"value":"D","text":"求真务实"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"科学发展观最鲜明的精神实质是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"1ae0c630b9","lessonId":"模拟课3","kind":"choice","question":"习近平指出：\"不论过去、现在和将来，我们都要坚持一切从实际出发，理论联系实际，在实践中检验真理和发展真理。\"坚持实事求是，就要 ______。","options":[{"value":"A","text":"深入实际了解事物的本来面貌"},{"value":"B","text":"把握事物内在必然联系，按照客观规律办事"},{"value":"C","text":"清醒认识和正确把握我国基本国情"},{"value":"D","text":"不断推进实践基础上的理论创新"}],"answer":[],"explanation":"课件考点讲解（第 34 页，红字强调）：实事求是是毛泽东思想的**基本点**，是毛泽东思想的**精髓**。实事求是，就是**一切从实际出发**，**理论联系实际**，**坚持在实践中检验真理和发展真理**。这是中国共产党人认识世界、改造世界的根本要求，是中国共产党的**思想路线**。毛泽东指出：\"'实事'就是客观存在着的一切事物，'是'就是客观事物的内部联系，即规律性，'求'就是我们去研究。\"毛泽东还把实事求是形象地比喻为\"有的放矢\"，强调我们要坚持用马克思主义之\"矢\"去射中国革命之\"的\"。经过延安整风和党的七大，实事求是的思想路线在全党得到了确立。","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"习近平指出：\"不论过去、现在和将来，我们都要坚持一切从实际出发，理论联系实际，在实践中检验真理和发展真理。\"坚持实事求是，就要 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"59b027bd68","lessonId":"模拟课3","kind":"choice","question":"新形势下，党需要应对的危险有 ______。","options":[{"value":"A","text":"精神懈怠的危险"},{"value":"B","text":"能力不足的危险"},{"value":"C","text":"脱离群众的危险"},{"value":"D","text":"消极腐败的危险"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"新形势下，党需要应对的危险有 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"68cd53904e","lessonId":"模拟课3","kind":"choice","question":"改革开放以来，中国成功走上了一条与本国国情和时代特征相适应的和平发展道路。坚持走和平发展道路，符合中国历史文化传统，这是因为 ______。","options":[{"value":"A","text":"中华民族是热爱和平的民族"},{"value":"B","text":"和平与发展成为时代发展的潮流"},{"value":"C","text":"中国人民在对外交往中始终强调亲仁善邻、和而不同"},{"value":"D","text":"中华文化是一种和平的文化，渴望和平始终是中国人民的精神特征"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"改革开放以来，中国成功走上了一条与本国国情和时代特征相适应的和平发展道路。坚持走和平发展道路，符合中国历史文化传统，这是因为 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"68dc553bc3","lessonId":"模拟课3","kind":"choice","question":"在台湾问题上，我国政府不承诺放弃使用武力是因为 ______。","options":[{"value":"A","text":"这是国际社会所确立的原则"},{"value":"B","text":"这不是针对台湾同胞的"},{"value":"C","text":"这是针对国际上一股企图把台湾从中国分裂出去的势力的"},{"value":"D","text":"这是针对台湾岛内一小撮搞\"台湾独立\"的分裂势力的"}],"answer":[],"explanation":"","chapter":"模拟课3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课3","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"在台湾问题上，我国政府不承诺放弃使用武力是因为 ______。"}],"subjs":[{"id":"0170d18bd6","num":31,"type":"辨析","supp":false,"stem":"我国社会主义初级阶段的主要矛盾是生产力和生产关系的矛盾。","options":[],"answer":"题干说法错误。","src":"","exp":"（1）生产力和生产关系的矛盾是我国社会的基本矛盾，但不是主要矛盾，这种说法把基本矛盾和主要矛盾混为一谈，因而是错误的。\n（2）我国社会主义改造基本完成以后，主要矛盾是人民日益增长的物质文化需要同落后的社会生产之间的矛盾。这个矛盾贯穿于我国社会主义初级阶段的全过程和社会生活的各个方面，其他各种矛盾都受它的决定和制约。\n（3）我国社会主义初级阶段，在经济、政治、文化和社会生活等各方面，都存在着种种矛盾，都要受到这个主要矛盾的决定和制约。由于国内和国际的各种因素，阶级矛盾还将在一定范围内长期存在，但它不是主要矛盾。\n题干说法错误。生产力和生产关系的矛盾是人类社会发展的基本矛盾，我国社会主义初级阶段的主要矛盾是人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。1956 年底，我国完成\"三大改造\"，标志着社会主义基本制度正式确立，我国从此进入社会主义社会，直接进入社会主义初级阶段，目前我国仍处于社会主义初级阶段，中国特色社会主义进入新时代，是我国社会主要矛盾发生新变化的反映，我国发展站在了新的历史起点上，社会主要矛盾已由人民日益增长的物质文化需要同落后的社会生产之间的矛盾，转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。故题干说法有误。\n📎 课件归纳（第 40 页）——辨析题答题模板总结：严格遵循\"判断 + 考点 + 结论\"的固定布局，直接用考点表述，不口语化。\n- 第一步：明确判断。直接写\"该说法正确 / 错误\"（无需额外修饰）。\n- 第二步：对应考点纠正 / 论证。若说法错误：直接写出正确考点，对比题干错误（用教材原文表述，不掺杂口语）。例（题干：人才是党执政兴国的第一要务）——正确考点是\"**发展**是党执政兴国的第一要务\"，题干将\"人才\"混淆为\"发展\"，表述错误。若说法正确：直接写出对应考点，强化观点（用教材原文）。\n- 第三步：总结结论。以\"因此，以上说法是正确 / 错误的\"收尾（简洁明确）。","warn":""},{"id":"8fafc44daf","num":32,"type":"辨析","supp":false,"stem":"新时期推进党的建设新的伟大工程的重点，是加强党的执政能力建设和先进性建设。","options":[],"answer":"题干说法正确。","src":"","exp":"中国共产党是社会主义事业的领导核心。在新的历史条件下，党肩负着带领全国各族人民全面建设小康社会，实现继续推进现代化建设、完成祖国统一、维护世界和平与促进共同发展三大历史任务；中国共产党要完成这些任务，必须将党建重点放在提高党的执政能力和先进性。因为这是中国共产党正确应对面临的机遇和挑战、顺利完成肩负的历史使命的现实要求，是世界上一些长期执政的大党、老党相继丧失政权的惨痛教训给我们的历史警示，是进一步提高中国共产党的领导水平和执政水平的迫切需要。","warn":""},{"id":"515329f2e8","num":33,"type":"简答","supp":false,"stem":"简述科学发展观的科学内涵是什么。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）推动经济社会发展是科学发展观的第一要义；\n（2）以人为本是科学发展观的核心立场；\n（3）全面协调可持续是科学发展观的基本要求；\n（4）统筹兼顾是科学发展观的根本方法。\n课件记忆口诀（第 44 页，红字标注）：① 第一要**义**——**发**展（口诀：法医）；② 核**心**立场——以**人**为本（口诀：人心）；③ **基**本要求——全面协调可**持**续（口诀：鸡翅）；④ 根本**方**法——统筹**兼**顾（口诀：房间）。总口诀：**法医走进房间，吃着鸡翅看着人心。**","warn":""},{"id":"a1b3f49406","num":34,"type":"简答","supp":false,"stem":"简述中国特色社会主义进入新时代的重大意义。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）从中华民族复兴的历史进程看，中国特色社会主义进入新时代，意味着近代以来久经磨难的中华民族迎来了从站起来、富起来到强起来的伟大飞跃，迎来了实现中华民族伟大复兴的光明前景。\n（2）从科学社会主义发展进程看，中国特色社会主义进入新时代，意味着科学社会主义在 21 世纪的中国焕发出强大生机活力，在世界上高高举起了中国特色社会主义伟大旗帜。\n（3）从人类文明进程看，中国特色社会主义进入新时代，意味着中国特色社会主义拓展了发展中国家走向现代化的途径，为解决人类问题贡献了中国智慧和中国方案。","warn":""},{"id":"57e11648c2","num":35,"type":"简答","supp":false,"stem":"决胜全面建成小康社会要坚决打好的\"三大攻坚战\"是什么？","options":[],"answer":"（见下方解析）","src":"","exp":"决胜全面建成小康社会要坚决打好\"三大攻坚战\"：\n（1）坚决打好防范化解重大风险攻坚战；\n（2）坚决打好精准脱贫攻坚战；\n（3）坚决打好污染防治攻坚战。","warn":""},{"id":"ce4da67046","num":36,"type":"论述","supp":false,"stem":"论述中国式现代化创造人类文明新形态。","options":[],"answer":"（见下方解析）","src":"","exp":"在漫长的历史长河中，人类创造和发展了多姿多彩的文明，构成了波澜壮阔的文明图谱。中国式现代化，深深植根于中华优秀传统文化，体现科学社会主义的先进本质，借鉴吸收一切人类优秀文明成果，代表人类文明进步的发展方向，是一种全新的人类文明形态。\n① 中国式现代化提供了一种全新的现代化模式。中国式现代化，打破了\"现代化 = 西方化\"的迷思，展现了不同于西方现代化的新图景。\n② 中国式现代化是对西方式现代化理论和实践的重大超越。中国式现代化蕴含的独特世界观、价值观、历史观、文明观、民主观、生态观等及其伟大实践，是对世界现代化理论和实践的重大创新。\n③ 中国式现代化为广大发展中国家提供了全新选择。中国式现代化的初步成功和取得的显著成就，新时代以来\"东升西降\"\"中治西乱\"的鲜明对比，为广大发展中国家独立自主迈向现代化、探索现代化道路的多样性提供了全新选择。","warn":""},{"id":"19c2638204","num":7,"type":"材料","supp":false,"stem":"材料一 2025 年 6 月，\"一带一路\"国际合作高级别视频会议召开，来自 152 个国家和 30 个国际组织的代表参会。会议聚焦\"绿色发展与数字合作\"主题，中国与沿线国家签署 12 项合作协议：包括在东南亚共建 5 个新能源电站，为非洲国家培训 1000 名数字技术人才，与中东国家联合开展沙漠化治理研究等。中国提出\"共商项目清单、共建合作平台、共享发展成果\"的倡议，强调尊重各国发展道路选择，不附加任何政治条件。 课件解读（第 50 页，红字/黄底强调）：\"一带一路\"已成为推动全球合作的重要平台，**绿色与数字是高质量发展的核心方向**，中国以**共商共建共享**原则和无政治附加的合作模式，**为全球治理与人类发展贡献了中国智慧**，彰显了**人类命运共同体**的实践价值。 **材料二** 2025 年 8 月，全球公共卫生安全峰会在日内瓦举行。中国宣布向世界卫生组织捐赠 5000 万美元，用于支持发展中国家疫苗研发和公共卫生体系建设；同时与欧盟、东盟等建立\"跨境疫情联防机制\"，共享病毒变异数据和防控经验。中国代表在发言中指出：\"公共卫生安全是人类共同挑战，没有国家能独善其身，需要各国超越分歧，以科学合作取代政治操弄。\" 课件解读（第 52 页）：面对公共卫生安全这一人类共同挑战，中国始终秉持人类命运共同体理念，以资金、机制、理念的多重行动，主动承担大国责任，推动多边科学合作，坚决反对政治操弄，为完善全球公共卫生治理、守护人类共同健康福祉作出了重要贡献，也为应对全球性问题提供了中国示范。 **问题：** 1. 上述材料说明了什么。 2. 结合材料谈谈，如何理解构建人类命运共同体是世界各国人民前途所在？","options":[],"answer":"（见下方解析）","src":"","exp":"两份材料分别从\"一带一路\"国际合作和全球公共卫生安全两大维度，展现了中国在不同全球性议题下的一致立场、行动与担当，核心说明中国始终秉持人类命运共同体理念，坚定践行多边主义，以务实行动推动国际合作、破解全球发展与治理难题，主动承担负责任大国使命，为世界和平与发展贡献中国智慧和中国方案，同时坚决反对将国际议题政治化，倡导以平等协作、科学务实的方式应对人类共同挑战。\n（1）构建人类命运共同体是我们党审视当今世界发展趋势、针对当今世界面临的重大问题提出的重要理念。\n（2）人类命运共同体，就是每个民族、每个国家的前途命运都紧紧联系在一起，把世界各国人民对美好生活的向往变成现实。构建人类命运共同体，就是要携手世界各国人民共同建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。\n（3）构建人类命运共同体理念顺应了历史潮流，回应了时代要求，凝聚了各国共识，为人类社会实现共同发展、持续繁荣、长治久安绘制了蓝图，对中国的和平发展、世界的繁荣进步都具有重大而深远的意义。","warn":""}],"keyed":2,"doubts":0},{"id":"押题卷04","name":"押题卷4","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"押题卷04","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"ea532bf399","lessonId":"押题卷04","kind":"choice","question":"2025 年 9 月 12 日，十四届全国人大常委会第十七次会议表决通过《中华人民共和国法治宣传教育法》，自 2025 年 11 月 1 日起施行。该法明确规定的国家实行的法治教育制度是（ ）","options":[{"value":"A","text":"青少年专项法治教育制度"},{"value":"B","text":"公民终身法治教育制度"},{"value":"C","text":"国家工作人员强制普法制度"},{"value":"D","text":"基层群众定期学法制度"}],"answer":["B"],"explanation":"","chapter":"押题卷4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：《法治宣传教育法》第四条\"国家实行公民终身法治教育制度，将法治教育纳入国民教育、干部教育、社会教育体系\"；来源：司法部官网 moj.gov.cn、新华社","paperTitle":"押题卷4","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025 年 9 月 12 日，十四届全国人大常委会第十七次会议表决通过《中华人民共和国法治宣传教育法》，自 2025 年 11 月 1 日起施行。该法明确规定的国家实行的法治教育制度是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"05f7a8184c","lessonId":"押题卷04","kind":"choice","question":"2025 年\"一带一路\"国际智库合作论坛于 11 月 21 日在（ ）开幕，论坛以\"高质量共建'一带一路'，构建开放型世界经济\"为主题。","options":[{"value":"A","text":"浙江杭州"},{"value":"B","text":"江苏南京"},{"value":"C","text":"广东广州"},{"value":"D","text":"山东青岛"}],"answer":["B"],"explanation":"","chapter":"押题卷4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：新华社南京 11 月 21 日电——2025 年\"一带一路\"国际智库合作论坛 21 日在江苏南京开幕，主题\"高质量共建'一带一路'，构建开放型世界经济\"；来源：新华网 xinhuanet.com","paperTitle":"押题卷4","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025 年\"一带一路\"国际智库合作论坛于 11 月 21 日在（ ）开幕，论坛以\"高质量共建'一带一路'，构建开放型世界经济\"为主题。"},{"schemaVersion":1,"contentVersion":1,"id":"5642e14e21","lessonId":"押题卷04","kind":"choice","question":"2025 年 6 月 13 日，巴西政府以轮值主席国身份宣布，（ ）正式加入金砖国家合作机制成为伙伴国。","options":[{"value":"A","text":"白俄罗斯"},{"value":"B","text":"古巴"},{"value":"C","text":"越南"},{"value":"D","text":"韩国"}],"answer":["C"],"explanation":"**讲解（课件第12页）**：课件同页补充——1 月 6 日，2025 年金砖国家主席国巴西发表新闻公告，宣布印度尼西亚成为金砖国家正式成员。","chapter":"押题卷4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"课件选项标红","paperTitle":"押题卷4","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025 年 6 月 13 日，巴西政府以轮值主席国身份宣布，（ ）正式加入金砖国家合作机制成为伙伴国。"},{"schemaVersion":1,"contentVersion":1,"id":"d4e80308a5","lessonId":"押题卷04","kind":"choice","question":"1 月 15 日，纪念遵义会议（ ）周年大会在贵州遵义举行，重温伟大历史，传承红色基因。","options":[{"value":"A","text":"80"},{"value":"B","text":"85"},{"value":"C","text":"90"},{"value":"D","text":"95"}],"answer":["C"],"explanation":"","chapter":"押题卷4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：遵义会议于 1935 年 1 月 15 日至 17 日召开，2025 年 1 月 15 日是遵义会议召开 90 周年的纪念日。","paperTitle":"押题卷4","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"1 月 15 日，纪念遵义会议（ ）周年大会在贵州遵义举行，重温伟大历史，传承红色基因。"},{"schemaVersion":1,"contentVersion":1,"id":"40335dfc1b","lessonId":"押题卷04","kind":"choice","question":"跳出历史周期率问题，是关系党千秋伟业的一个重大问题。如何跳出历史周期率？如何实现长期执政？党始终在思索、一直在探索。毛泽东在延安的窑洞里给出了第一个答案，是（ ）。","options":[{"value":"A","text":"让人们来监督政府"},{"value":"B","text":"党的自我革命"},{"value":"C","text":"坚定不移惩治腐败"},{"value":"D","text":"坚持走和平发展道路"}],"answer":[],"explanation":"","chapter":"押题卷4","knowledgePoint":"","s b-politics/lessons/practice.html","label":"","paperTitle":"押题卷4","course":"模拟押题"},"answerStatus":"missing","warn":"课件未给出答案","grp":"题库","legacyQuestion":"习近平外交思想中，推动构建人类命运共同体的宗旨是（ ）。"}],"subjs":[{"id":"98407c6a60","num":31,"type":"辨析","supp":false,"stem":"毛泽东思想是中国革命和建设的科学指南。","options":[],"answer":"（见下方解析）","src":"课件第42页全文","exp":"答：\n该观点正确。毛泽东思想是马克思主义中国化第一次历史性飞跃的理论成果，毛泽东思想是正确的理论原则和经验总结。在毛泽东思想指引下，我们党领导全国人民，找到了一条新民主主义革命的正确道路，建立了中华人民共和国；确立了社会主义基本制度，实现了中国历史上最深刻最伟大的社会变革。毛泽东领导我们建立起独立的比较完整的工业体系和国民经济体系，为社会主义现代化建设奠定了重要的物质技术基础，为社会主义建设积累了重要经验。","warn":""},{"id":"699b18768d","num":32,"type":"辨析","supp":false,"stem":"国家的制度完善程度是最大的政治，决定事业兴衰成败。","options":[],"answer":"（见下方解析）","src":"课件第44页全文","exp":"答：\n该观点错误。民心才是最大的政治，民心向背决定事业兴衰成败，这是马克思主义群众观的核心论断，也是中国共产党百年奋斗的实践结论。人民是历史的创造者，是党和国家事业的根本依靠力量，脱离民心的事业必然难以持久。制度完善是保障事业发展的重要条件，而非\"最大的政治\"和决定性因素。制度的制定、执行、完善，其根本目的都是为了顺应民心、维护民利、凝聚民力；若制度脱离群众需求、违背民心所向，即便形式上再完善，也无法真正推动事业发展，甚至会阻碍进步。要坚持以人民为中心的发展思想，把顺应民心、汇聚民智、保障民利作为制度建设的出发点和落脚点，让制度服务于民心、服务于事业发展。","warn":""},{"id":"f6791f5031","num":33,"type":"简答","supp":false,"stem":"简述社会主义基本制度确立的意义。","options":[],"answer":"（见下方解析）","src":"课件第46页全文","exp":"答：\n第一，社会主义基本制度的确立是中国历史上最深刻最伟大的社会变革，为当代中国一切发展奠定了制度基础，也为中国特色社会主义制度的创新和发展提供了重要条件。\n第二，社会主义基本制度的确立，极大提高了工人阶级和广大劳动人民的积极性和创造性，极大地促进了我国社会生产力的发展。\n第三，社会主义基本制度的确立，使广大劳动人民真正成为国家的主人。\n第四，中国社会主义基本制度的确立，这是世界社会主义发展史上又一个历史性的伟大胜利，对维护世界和平产生了积极影响。\n第五，社会主义基本制度的确立，不仅再次证明了马克思列宁主义的真理性，而且以其独创性的理论原则和经验总结丰富和发展科学社会主义理论。","warn":""},{"id":"98305a6f92","num":34,"type":"简答","supp":false,"stem":"简述如何办好人民满意的教育。","options":[],"answer":"（见下方解析）","src":"课件第48页全文","exp":"答：\n①大力促进教育公平。\n②加快建设高质量教育体系。\n③提升教育服务经济社会发展能力。\n④坚持深化教育改革创新。\n⑤坚持把教师队伍建设作为基础工作。","warn":""},{"id":"453b9b601b","num":35,"type":"简答","supp":false,"stem":"简述习近平新时代中国特色社会主义思想产生的时代背景。","options":[],"answer":"（见下方解析）","src":"课件第50-51页全文","exp":"答：\n①世界百年未有之大变局加速演进。世界百年未有之大变局概括来说就是，当前国际格局和国际体系正在发生深刻调整；全球治理体系正在发生深刻变革；国际力量对比正在发生近代以来最具革命性的变化；世界范围呈现出影响人类历史进程和趋向的重大态势。\n②中华民族伟大复兴正处于关键时期。中华民族迎来了从站起来、富起来到强起来的伟大飞跃，实现中华民族伟大复兴进入了不可逆转的历史进程。中华民族伟大复兴，是造成世界百年未有之大变局的重要原因；世界面临百年未有之大变局给中华民族伟大复兴带来重大机遇。\n③中国式现代化全面推进拓展。习近平新时代中国特色社会主义思想，正是在成功推进和拓展中国式现代化、推动人类文明发展的历史进程中创立并不断丰富发展的。\n④科学社会主义在 21 世纪的中国焕发新的蓬勃生机。习近平新时代中国特色社会主义思想，正是在对科学社会主义理论与实践的深邃思考、深刻总结，对坚持和发展中国特色社会主义的不懈探索、砥砺前行中创立并不断丰富发展的。\n⑤中国共产党自我革命开辟新的境界。习近平新时代中国特色社会主义思想，正是在党不断实现自我净化、自我完善、自我革新、自我提高，以伟大自我革命引领伟大社会革命的过程中创立并不断丰富发展的。\n【本题给分标准是答出 4 个要点可以拿 4 分，剩下分数是分析分，言之有理即可】","warn":""},{"id":"c0cc33dcca","num":36,"type":"论述","supp":false,"stem":"论述中国式现代化的中国特色和本质要求。","options":[],"answer":"（见下方解析）","src":"课件第53页全文","exp":"答：中国式现代化的中国特色是：\n①中国式现代化是人口规模巨大的现代化。\n②中国式现代化是全体人民共同富裕的现代化。\n③中国式现代化是物质文明和精神文明相协调的现代化。\n④中国式现代化是人与自然和谐共生的现代化。\n⑤中国式现代化是走和平发展道路的现代化。\n中国式现代化的本质要求是：\n坚持中国共产党领导，坚持中国特色社会主义，实现高质量发展，发展全过程人民民主，丰富人民精神世界，实现全体人民共同富裕，促进人与自然和谐共生，推动构建人类命运共同体，创造人类文明新形态。","warn":""},{"id":"a271f80057","num":7,"type":"材料","supp":false,"stem":"结合材料回答问题： **材料一**（2025 年 4 月 30 日，习近平在部分省区市\"十五五\"时期经济社会发展座谈会上的讲话）： 谋划\"十五五\"时期经济社会发展，要前瞻性把握国际形势发展变化对我国的影响，因势利导对经济布局进行调整优化。要坚定不移办好自己的事，坚定不移扩大高水平对外开放，多措并举稳就业、稳企业、稳市场、稳预期，有效稳住经济基本盘，加快构建新发展格局，全面推动高质量发展。 （课件附白话解读：规划未来五年发展，要审时度势、办好自己的事、稳住经济、推动高质量发展。） **材料二**（2025 年 4 月 28 日，习近平在庆祝中华全国总工会成立 100 周年暨全国劳动模范和先进工作者表彰大会上的讲话）： 要聚焦推动高质量发展，动员激励广大职工和劳动群众建功立业、创新创造。高质量发展离不开高质量的劳动创造。要结合发展新质生产力，深入贯彻新发展理念，广泛开展各种建功立业和群众性创新创造活动，组织引导广大劳动者立足本职岗位，在传统产业转型升级中攻坚克难，在新兴产业发展壮大中开拓进取，在未来产业培育生长中大胆探索，为构建新发展格局、推动高质量发展不断注入新动能。 （课件附白话解读：高质量发展靠高质量劳动，结合新质生产力，在传统 / 新兴 / 未来产业创新，为新发展格局添动能。） **材料三**（2024 年 8 月 22 日，习近平在纪念邓小平同志诞辰 120 周年座谈会上的讲话）： 要紧紧抓住高质量发展这个首要任务，全面推进中国式现代化。我们要完整准确全面贯彻新发展理念，统筹推进\"五位一体\"总体布局、协调推进\"四个全面\"战略布局。着力构建全国统一大市场，扎实推进新型工业化、信息化、城镇化、农业现代化，全面推进乡村振兴，促进区域协调发展，加快建设现代化经济体系。要强化教育、科技、人才支撑，推进高水平科技自立自强，因地制宜发展新质生产力。要大力发展社会主义先进文化，坚定走生产发展、生活富裕、生态良好的文明发展道路，形成物质文明和精神文明相协调、人与自然和谐共生的良好局面。 （课件附白话解读：以高质量发展为首要任务，全面推进中国式现代化，从理念、布局、经济、科技、文化、生态等多方面系统发力，实现全面协调发展。） **（1）上述材料说明了什么？**","options":[],"answer":"（见下方解析）","src":"课件第58页全文","exp":"**（2）谈谈如何建设现代化经济体系。**\n答：\n①建设创新引领，协同发展的产业体系；\n②建设彰显优势，协调联动的城乡区域发展体系；\n③建设资源节约，环境友好的绿色发展体系；\n④建设多元平衡，安全高效的全面开放体系；\n⑤建设体现效率，促进公平的收入分配体系；\n⑥建设统一开放，竞争有序的市场体系；\n⑦建设 "text":"顶层设计和摸着石头过河的关系"},{"value":"D","text":"胆子要大和步子要稳的关系"}],"answer":[],"explanation":"","chapter":"模拟课4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课4","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"习近平总书记系列重要讲话提出，要把握和处理好全面深化改革的一些重大关系，包括处理好 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"61fd5feb87","lessonId":"模拟课4","kind":"choice","question":"人民群众 ______ 的充分发挥，是社会主义事业成功的根本保证。","options":[{"value":"A","text":"积极性"},{"value":"B","text":"主动性"},{"value":"C","text":"创造性"},{"value":"D","text":"主体性"}],"answer":[],"explanation":"","chapter":"模拟课4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课4","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"人民群众 ______ 的充分发挥，是社会主义事业成功的根本保证。"},{"schemaVersion":1,"contentVersion":1,"id":"bfcc17a8bc","lessonId":"模拟课4","kind":"choice","question":"关于改革、发展、稳定之间的关系，以下说法正确的是 ______。","options":[{"value":"A","text":"改革是动力，发展是关键，稳定是前提"},{"value":"B","text":"要把改革的力度、发展的速度和社会可以承受的程度统一起来"},{"value":"C","text":"必须通过改革发展促进社会稳定，在保持社会稳定中推进改革和发展"},{"value":"D","text":"把不断改善人民生活作为处理改革、发展、稳定关系的重要结合点"}],"answer":[],"explanation":"","chapter":"模拟课4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课4","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"关于改革、发展、稳定之间的关系，以下说法正确的是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"a9249e0e26","lessonId":"模拟课4","kind":"choice","question":"走中国特色社会主义法治道路的核心要义，就是要 ______。","options":[{"value":"A","text":"坚持党的领导"},{"value":"B","text":"坚持中国特色社会主义制度"},{"value":"C","text":"贯彻中国特色社会主义理论"},{"value":"D","text":"人民当家作主"}],"answer":[],"explanation":"","chapter":"模拟课4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课4","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"走中国特色社会主义法治道路的核心要义，就是要 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"2c1043a69a","lessonId":"模拟课4","kind":"choice","question":"以下属于我国重大创新工程取得突破性进展的成果是 ______。","options":[{"value":"A","text":"\"神舟飞天\""},{"value":"B","text":"\"蛟龙入海\""},{"value":"C","text":"\"墨子\"传信"},{"value":"D","text":"\"天问\"探火"}],"answer":[],"explanation":"","chapter":"模拟课4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课4","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"以下属于我国重大创新工程取得突破性进展的成果是 ______。"}],"subjs":[{"id":"f566f2a369","num":1,"type":"材料","supp":false,"stem":"材料一 2025 年 6 月，\"一带一路\"国际合作高级别视频会议召开，来自 152 个国家和 30 个国际组织的代表参会。会议聚焦\"绿色发展与数字合作\"主题，中国与沿线国家签署 12 项合作协议：包括在东南亚共建 5 个新能源电站，为非洲国家培训 1000 名数字技术人才，与中东国家联合开展沙漠化治理研究等。中国提出\"共商项目清单、共建合作平台、共享发展成果\"的倡议，强调尊重各国发展道路选择，不附加任何政治条件。 课件解读（第 3 页，红字/黄底强调）：\"一带一路\"已成为推动全球合作的重要平台，**绿色与数字是高质量发展的核心方向**，中国以**共商共建共享**原则和无政治附加的合作模式，**为全球治理与人类发展贡献了中国智慧**，彰显了**人类命运共同体**的实践价值。 **材料二** 2025 年 8 月，全球公共卫生安全峰会在日内瓦举行。中国宣布向世界卫生组织捐赠 5000 万美元，用于支持发展中国家疫苗研发和公共卫生体系建设；同时与欧盟、东盟等建立\"跨境疫情联防机制\"，共享病毒变异数据和防控经验。中国代表在发言中指出：\"公共卫生安全是人类共同挑战，没有国家能独善其身，需要各国超越分歧，以科学合作取代政治操弄。\" 课件解读（第 4 页）：面对公共卫生安全这一人类共同挑战，中国始终秉持人类命运共同体理念，以资金、机制、理念的多重行动，主动承担大国责任，推动多边科学合作，坚决反对政治操弄，为完善全球公共卫生治理、守护人类共同健康福祉作出了重要贡献，也为应对全球性问题提供了中国示范。 **问题：** 1. 上述材料说明了什么。 2. 结合材料谈谈，如何理解构建人类命运共同体是世界各国人民前途所在？","options":[],"answer":"（见下方解析）","src":"","exp":"两份材料分别从\"一带一路\"国际合作和全球公共卫生安全两大维度，展现了中国在不同全球性议题下的一致立场、行动与担当，核心说明中国始终秉持**人类命运共同体**理念，坚定践行多边主义，以务实行动推动**国际合作**、破解全球发展与治理难题，主动承担负责任大国使命，**为世界和平与发展贡献中国智慧和中国方案**，同时坚决反对将国际议题政治化，倡导以**平等协作、科学务实的方式应对人类共同挑战**。\n（1）构建人类命运共同体是我们党审视当今世界发展趋势、针对当今世界面临的重大问题提出的重要理念。\n（2）人类命运共同体，就是每个民族、每个国家的前途命运都紧紧联系在一起，把世界各国人民对美好生活的向往变成现实。**构建人类命运共同体，就是要携手世界各国人民共同建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。**\n（3）构建人类命运共同体理念顺应了历史潮流，回应了时代要求，凝聚了各国共识，为人类社会实现共同发展、持续繁荣、长治久安绘制了蓝图，对中国的和平发展、世界的繁荣进步都具有重大而深远的意义。","warn":""},{"id":"31769125ed","num":31,"type":"辨析","supp":false,"stem":"中国特色社会主义政治制度是由根本政治制度和基本政治制度组成的制度体系。","options":[],"answer":"错误","src":"","exp":"参考答案（第 39 页）：\n中国特色社会主义政治制度是由**根本政治制度、基本政治制度、重要政治制度**等组成的制度体系。人民代表大会制度是坚持党的领导、人民当家作主、依法治国有机统一的根本政治制度安排。中国共产党领导的多党合作和政治协商制度、民族区域自治制度以及基层群众自治制度构成我国的基本政治制度。在根本政治制度、基本政治制度基础之上，形成了一系列具有中国特色的重要政治制度。这些制度共同构成了中国特色社会主义政治制度的四梁八柱。","warn":""},{"id":"0ed264d5f9","num":32,"type":"辨析","supp":false,"stem":"如果没有共同的核心价值观，一个民族、一个国家就会魂无定所、行无所归。","options":[],"answer":"正确","src":"","exp":"参考答案（第 41 页，前两句为课件标红重点）：\n**社会主义核心价值观集中体现着全体人民共同的价值追求，是凝聚人心、汇聚民力的强大力量。核心价值观，承载着一个民族、一个国家的精神追求，体现着一个社会评判是非曲直的价值标准。**以富强、民主、文明、和谐，自由、平等、公正、法治，爱国、敬业、诚信、友善为基本内容的社会主义核心价值观，把涉及国家、社会、公民的价值要求融为一体，回答了我们要建设什么样的国家、建设什么样的社会、培育什么样的公民的重大问题。社会主义核心价值观既体现了社会主义本质要求，继承了中华优秀传统文化，也吸收了世界文明有益成果，体现了时代精神，对于巩固社会主义制度、推进国家繁荣发展、维系社会和谐稳定具有重要作用。社会主义核心价值观只有成为广泛的社会共识，内化为人们的精神追求，外化为人们的自觉行动，才能真正在社会生活中发挥作用。","warn":""},{"id":"dd92e8f535","num":33,"type":"简答","supp":false,"stem":"实事求是思想路线的科学内涵。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）一切从实际出发，这是思想路线的前提和基础；\n（2）理论联系实际，是思想路线的途径和方法；\n（3）实事求是，是思想路线的核心；\n（4）在实践中检验真理和发展真理，这是思想路线的条件和目的。","warn":""},{"id":"cf9b817bc2","num":34,"type":"简答","supp":false,"stem":"如何认识全面建成小康社会在我国社会主义现代化进程中的重大意义？","options":[],"answer":"（见下方解析）","src":"","exp":"全面建成小康社会是我国社会主义现代化进程中的一座重要里程碑。\n（1）全面建成小康社会，成效卓著、成果丰硕、成色十足。\n（2）全面建成小康社会，高质量完成了社会主义现代化建设\"三步走\"战略的第二步，使中华民族伟大复兴向前迈出新的一大步。①如期全面建成小康社会，兑现了党向人民、向历史作出的庄严承诺，践行了党为中国人民谋幸福、为中华民族谋复兴的初心使命。②如期全面建成小康社会，标志着第一个百年奋斗目标胜利实现，国家更富强、人民更幸福、社会更稳定、环境更优美，人民获得感幸福感安全感显著提升，中华民族实现了从大幅落后于时代到大踏步赶上时代的新跨越。③如期全面建成小康社会，极大彰显了中国特色社会主义制度的优势，极大提升了民族自信心自豪感，极大增强了实现中华民族伟大复兴的能量。\n（3）全面建成小康社会，探索了人类解决贫困问题的新路径，为推动人类文明进步作出了重大贡献。","warn":""},{"id":"7de1f1765a","num":35,"type":"简答","supp":false,"stem":"如何认识中国最大的国情就是中国共产党的领导？","options":[],"answer":"（见下方解析）","src":"","exp":"中国共产党是中国特色社会主义事业的坚强领导核心。\n（1）中国共产党的领导地位是在历史奋斗中形成的。\n（2）中国共产党领导是人民当家作主的可靠保障。\n（3）中国共产党领导关系中国特色社会主义的性质、方向和命运。\n（4）中国共产党领导是实现中华民族伟大复兴的根本保证。","warn":""},{"id":"6813696eb8","num":36,"type":"论述","supp":false,"stem":"如何理解实现祖国完全统一是中华民族的根本利益。","options":[],"answer":"（见下方解析）","src":"","exp":"实现祖国的完全统一是海内外中华儿女的共同心愿，是中华民族的根本利益所在，对实现国家繁荣富强和民族伟大复兴具有巨大的推动作用。\n第一，维护祖国统一是中华民族的爱国主义传统。中华民族富有爱国主义传统。\n第二，实现祖国完全统一是中华民族伟大复兴的历史任务之一。实现祖国完全统一是中华民族伟大复兴的重要内容和基本任务。国家的完全统一是民族复兴的重要标志，没有国家的完全统一就没有完全意义上的民族复兴。中华民族的伟大复兴既是一个走向现代化的实现繁荣强盛的过程，同时也是一个实现祖国完全统一的过程。\n第三，实现祖国完全统一是中国人民不可动摇的坚强意志。民族团结和国家统一符合我国各族人民的根本利益，符合中国社会发展的历史潮流。实现祖国完全统一是包括台湾同胞在内的所有海内外中华儿女的共同心愿。","warn":""},{"id":"dacfe3bc30","num":8,"type":"材料","supp":false,"stem":"材料一 \"改革是由问题倒逼而产生，又在不断解决问题中得以深化。要有强烈的问题意识，以重大问题为导向，抓住重大问题、关键问题进一步研究思考，找出答案，着力推动解决我国发展面临的一系列突出矛盾和问题。我们中国共产党人干革命、搞建设、抓改革，从来都是为了解决中国的现实问题。\" —— 习近平《关于〈中共中央关于全面深化改革若干重大问题的决定〉的说明》 **材料二** 习近平主席强调，新时代全面深化改革需以坚持和完善中国特色社会主义制度、推进国家治理体系和治理能力现代化为主轴，突出制度建设和治理能力建设。这一要求在自贸试验区改革中集中体现。 我国自贸试验区曾面临\"制度型开放不足\"\"区域协同弱\"\"风险防控不完善\"等问题，早期多聚焦商品流动便利化，与国际高标准存在差距，改革难成系统效应。 为实现全方位制度创新，国家推动自贸试验区向\"制度创新型\"转型。投资制度上，全面实行\"外商投资准入前国民待遇 + 负面清单\"，2024 年自贸试验区外资准入负面清单仅 27 项，较 2013 年缩减 86%，还推出\"跨境服务贸易负面清单\"，吸引大量重大外资项目，2024 年自贸试验区实际使用外资占全国 28%。贸易制度上，探索\"通关一体化 + 监管智能化\"，压缩企业通关时间，开展跨境电商零售进口药品等试点。监管制度上，构建\"风险防控 + 协同监管\"体系，实现跨区域监管协作与全链条风险把控。此外，自贸试验区还在知识产权保护、数据跨境流动等领域突破制度瓶颈，形成\"投资 - 贸易 - 监管 - 权益保护\"一体化制度体系。2024 年，128 项自贸试验区制度创新成果在全国复制推广，深刻改变我国对外开放制度框架，体现新时代改革开放制度创新的全面性、系统性和根本性。","options":[],"answer":null,"src":"","exp":"","warn":""},{"id":"b729cebbbd","num":37,"type":"材料","supp":false,"stem":"请结合材料，回答问题： （1）根据所学的知识，回答为什么说新时代全面深化改革开放是一场深刻革命？ （2）结合材料说一说全面深化改革开放要坚持的正确方法论。","options":[],"answer":null,"src":"","exp":"","warn":"课件未附参考答案（材料与问题见第 48–50 页，其后即为封底宣传页）。"}],"keyed":3,"doubts":0},{"id":"模拟卷05","name":"模拟卷5","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"模拟卷05","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"5314e5847a","lessonId":"模拟卷05","kind":"choice","question":"党的二十届四中全会提出，要构建更加完善的社会主义市场经济体制，其中重点强调要进一步发挥 ______ 在资源配置中的决定性作用。","options":[{"value":"A","text":"政府"},{"value":"B","text":"市场"},{"value":"C","text":"企业"},{"value":"D","text":"社会组织"}],"answer":["B"],"explanation":"","chapter":"模拟卷5","knowledgeP 生福祉的重大社会问题。 （2）良好的生态环境是最公平的公共产品，是最普惠的民生福祉。 （3）生态文明建设战略地位更加凸显。党的十九大把\"增强绿水青山就是金山银山的意识\"等写入党章。2018 年 3 月十三届全国人大一次会议通过的宪法修正案把生态文明写入宪法。 （4）生态文明制度体系更加健全。 （5）污染防治和生态保护更加有力。优化国土空间开发布局，严守生态保护红线、环境质量底线、资源利用上线三条红线。","chapter":"模拟卷5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷5","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"关于生态文明制度建设，党的二十届四中全会提出要完善（ ）制度，推动绿色低碳发展，加快美丽中国建设。"},{"schemaVersion":1,"contentVersion":1,"id":"9474d43038","lessonId":"模拟卷05","kind":"choice","question":"针对城乡区域发展不平衡问题，党的二十届四中全会提出要健全（ ）机制，推动城乡要素平等交换、双向流动，缩小区域发展差距。","options":[{"value":"A","text":"城乡融合发展"},{"value":"B","text":"城乡分割管理"},{"value":"C","text":"区域协调发展"},{"value":"D","text":"区域同步发展"}],"answer":[],"explanation":"","chapter":"模拟卷5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷5","course":"模拟押题"},"answerStatus":"missing","warn":"**题干表述错置，暂不补确定答案。** AI 联网核实·非原卷答案：“促进城乡要素平等交换、双向流动，缩小城乡差别”出自二十届三中全会《决定》的“完善城乡融合发展体制机制”部分；二十届四中全会《十五五》建议分别部署城乡融合与区域协调，未出现题干拼接的完整表述。疑似命题意图为 AC，但不足以据官方原文硬判。[31][39]","grp":"题库","legacyQuestion":"针对城乡区域发展不平衡问题，党的二十届四中全会提出要健全（ ）机制，推动城乡要素平等交换、双向流动，缩小区域发展差距。"},{"schemaVersion":1,"contentVersion":1,"id":"77a55169fb","lessonId":"模拟卷05","kind":"choice","question":"推动构建新型国际关系，就是要秉持 ______ 的原则。","options":[{"value":"A","text":"相互尊重"},{"value":"B","text":"公平正义"},{"value":"C","text":"合作共赢"},{"value":"D","text":"友好合作"}],"answer":[],"explanation":"","chapter":"模拟卷5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷5","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"推动构建新型国际关系，就是要秉持 ______ 的原则。"},{"schemaVersion":1,"contentVersion":1,"id":"e9d204b6c2","lessonId":"模拟卷05","kind":"choice","question":"坚持 ______ 周边外交方针，深化同周边国家友好互信和利益融合。","options":[{"value":"A","text":"亲诚惠容"},{"value":"B","text":"与邻为善"},{"value":"C","text":"与邻为伴"},{"value":"D","text":"协调合作"}],"answer":["A","B","C"],"explanation":"课件解析（红字标注）：推进大国协调合作，构建和平共处、总体稳定、均衡发展的大国关系格局，是中国对外关系的重要内容。坚持亲诚惠容和与邻为善、以邻为伴周边外交方针，深化同周边国家友好互信和利益融合。秉持真实亲诚理念和正确义利观，加强同发展中国家团结合作。秉持求同存异、相互尊重、互学互鉴理念，构建新型政党关系。","chapter":"模拟卷5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷5","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"坚持 ______ 周边外交方针，深化同周边国家友好互信和利益融合。"},{"schemaVersion":1,"contentVersion":1,"id":"f685dfc5a6","lessonId":"模拟卷05","kind":"choice","question":"在台湾问题上，我国政府不承诺放弃使用武力是因为 ______。","options":[{"value":"A","text":"这是国际社会所确立的原则"},{"value":"B","text":"这不是针对台湾同胞的"},{"value":"C","text":"这是针对国际上一股企图把台湾从中国分裂出去的势力的"},{"value":"D","text":"这是针对台湾岛内一小撮搞\"台湾独立\"的分裂势力的"}],"answer":[],"explanation":"","chapter":"模拟卷5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷5","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"在台湾问题上，我国政府不承诺放弃使用武力是因为 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"d771a7f8fd","lessonId":"模拟卷05","kind":"choice","question":"人民群众 ______ 的充分发挥，是社会主义事业成功的根本保证。","options":[{"value":"A","text":"积极性"},{"value":"B","text":"主动性"},{"value":"C","text":"创造性"},{"value":"D","text":"主体性"}],"answer":[],"explanation":"","chapter":"模拟卷5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷5","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"人民群众 ______ 的充分发挥，是社会主义事业成功的根本保证。"},{"schemaVersion":1,"contentVersion":1,"id":"429c46d13a","lessonId":"模拟卷05","kind":"choice","question":"新时代加强和创新社会治理，要求坚持 ______。","options":[{"value":"A","text":"依法治理"},{"value":"B","text":"系统治理"},{"value":"C","text":"综合治理"},{"value":"D","text":"源头治理"}],"answer":[],"explanation":"","chapter":"模拟卷5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb- ,"subjs":[{"id":"a50e4cea34","num":31,"type":"辨析","supp":false,"stem":"实施对外开放要正确对待资本主义社会创造的现代文明成果。","options":[],"answer":"该观点正确。（模板化作答）","src":"","exp":"**定性：** 该观点正确。\n**正面阐述：** 资本主义的现代文明成果是人类共同财富，社会主义需吸收借鉴以发展生产力，这是对外开放的重要目标。\n**原则强调：** 正确对待并非全盘照搬，需坚持以我为主、为我所用，批判吸收优秀成果，抵制腐朽落后内容。\n**实践总结：** 这是我国对外开放的成功经验，符合中国国情和人类文明发展规律，是实现社会主义现代化的必然要求。/ 实施对外开放的过程中，正确对待资本主义社会创造的现代文明成果，是我国对外开放的重要原则和实践要求，也是实现社会主义现代化的必然选择。","warn":""},{"id":"4a42331208","num":32,"type":"辨析","supp":false,"stem":"习近平新时代中国特色社会主义思想是实现中华民族伟大复兴的行动指南。","options":[],"answer":"正确。","src":"","exp":"习近平新时代中国特色社会主义思想是全党全国人民团结奋斗的共同思想基础，是全面建设社会主义现代化国家、实现中华民族伟大复兴中国梦的行动指南。为新时代坚持和发展中国特色社会主义提供了根本指引；为新时代治国理政提供了基本遵循；为全面从严治党、把党建设成为中国特色社会主义事业的坚强领导核心提供了强大思想武器。\n课件另附一版作答（p38）：习近平新时代中国特色社会主义思想，是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家事业发展的根本遵循。这一思想指导我们党团结带领全国各族人民，统揽伟大斗争、伟大工程、伟大事业、伟大梦想，开创了中国特色社会主义新时代，完成了脱贫攻坚、全面建成小康社会的历史任务，续写了经济快速发展和社会长期稳定两大奇迹，推动中华民族伟大复兴进入不可逆转的历史进程，为人类和平与发展崇高事业作出重大贡献。这一思想是全面建成社会主义现代化强国、以中国式现代化全面推进中华民族伟大复兴的科学指引，是我们应对各种风险挑战、战胜一切艰难险阻的根本指针，是全党全国各族人民团结奋斗、勇毅前行创造新的历史伟业的精神旗帜。","warn":""},{"id":"c04da801f1","num":33,"type":"简答","supp":false,"stem":"简述习近平新时代中国特色社会主义思想创立的时代背景。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）世界百年未有之大变局加速演进；\n（2）中华民族伟大复兴进入关键时期；\n（3）中国式现代化全面推进拓展；\n（4）科学社会主义在 21 世纪的中国焕发新的蓬勃生机；\n（5）中国共产党自我革命开辟新的境界。","warn":""},{"id":"a9947cc1d3","num":34,"type":"简答","supp":false,"stem":"如何理解人民对美好生活的向往是党的奋斗目标？","options":[],"answer":"（见下方解析）","src":"","exp":"坚持人民至上，必须始终把人民放在心中最高的位置。必须把人民对美好生活的向往作为党的奋斗目标，团结带领人民共同创造美好的未来。\n（1）为人民谋幸福是党始终坚守的初心，让人民过上好日子是党一贯的追求。\n（2）人民对美好生活的向往就是党的奋斗目标，这体现了我国社会主要矛盾转化对党和国家工作的新要求。必须牢牢把握我国社会主要矛盾的新变化，顺应人民对高品质生活的新期待，在高质量发展中努力为人民创造更美好、更幸福的生活。","warn":""},{"id":"d995be9b81","num":35,"type":"简答","supp":false,"stem":"如何正确处理改革、发展、稳定的关系？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）加强各项改革关联性、系统性、可行性研究。\n（2）坚持改革、发展、稳定的统一。\n（3）必须坚持把改革力度、发展速度和社会可承受程度统一起来。\n（4）把不断改善人民生活作为处理改革、发展、稳定关系的重要结合点。\n（5）保持改革、发展、稳定在动态中的相互协调和相互促进。\n课件另附（版本二，毛概第七章）：要正确认识和处理改革、发展、稳定的关系。江泽民提出抓住机遇、深化改革、扩大开放、促进发展、保持稳定的基本方针，领导我们制定和实施了促进改革发展稳定的一系列方针政策和重大战略。改革是动力，发展是目的，稳定是前提。没有改革，就不可能走出一条建设中国特色社会主义的正确道路，我们的事业就不可能顺利前进；没有发展，就不可能实现现代化，也就不可能保持党和国家的长治久安；没有稳定，改革和发展都无从进行。要把改革的力度、发展的速度和社会可承受的程度统一起来，把不断改善人民生活作为处理改革发展稳定关系的重要结合点，在社会稳定中推进改革发展，通过改革发展促进社会稳定。\n课件另附（版本三，\"这样回答也没问题\"）：改革、发展、稳定是辩证统一的关系：发展是目的，改革是动力，稳定是前提。处理三者关系，要 ①坚持以发展为第一要务，以改革破解发展难题，以稳定为改革发展营造环境；②把握改革节奏、发展速度和社会可承受度的统一；③始终以人民为中心，在稳定中推进改革发展，在改革发展中维护社会稳定。","warn":""},{"id":"c292ebb1d4","num":36,"type":"论述","supp":false,"stem":"论述为什么要坚定中国特色社会主义道路自信、理论自信、制度自信、文化自信？","options":[],"answer":"原因/依据、意义万能模板\"）：","src":"","exp":"一、万能原因/依据\n1. 制度与国情层面：由中国国情、社会主义性质、社会主义基本制度决定。\n2. 发展需求层面：满足发展生产力、社会化大生产的要求；适配经济发展新常态、五个文明协调发展、创新驱动战略、生态文明理念、国家治理现代化、改革创新、社会主义核心价值观培育的需要。\n3. 战略目标层面：服务于全面建成小康社会、社会主义现代化建设、祖国统一、世界和平与发展、中华民族伟大复兴中国梦、\"四个全面\"战略布局的推进。\n4. 党的建设层面：源于党面临的\"提高领导执政水平、拒腐防变能力\"两大历史课题，由党的先进性、性质、宗旨及全面从严治党要求决定。\n5. 经验总结层面：基于革命、现代化建设的自身经验，及他国经验，为中国特色社会主义提供了经验、理论、物质基础，丰富了科学社会主义理论与实践。\n6. 理论指导层面：以马克思主义及毛泽东、邓小平、江泽民、胡锦涛、习近平等的理论为指导。\n二、万能意义\n1. 理论层面：是党制定执行正确方针政策的理论基础、根本依据，有助于克服错误思想。\n2. 经济社会层面：助力社会主义市场经济体制建立、把握经济新常态，推动经济社会科学发展，提高人民生活水平，维护安定团结政治局面，巩固社会主义制度。\n3. 发展效能层面：利于优化资源配置、提高劳动生产率，调动人民积极性创造性，加快现代化建设，提升管理水平与企业竞争力，推进国家治理现代化。\n4. 战略全局层面：关系我国国际地位与竞争力、社会主义现代化进程、祖国繁荣富强与民族复兴，关联\"两个一百年\"奋斗目标。","warn":""},{"id":"6ac9397bcc","num":7,"type":"材料","supp":false,"stem":"【题目】** 请结合材料，回答问题： （1）结合材料和所学知识，如何理解让人民生活幸福是\"国之大者\"？ （2）根据所学知识和结合材料谈谈如何坚持在发展中增进民生福祉？ **材料 1** 悠悠万事，民生为大。习近平主席在新年贺词中指出：\"家事国事天下事，让人民过上幸福生活是头等大事。\"这句话深刻体现出，让人民生活幸福是\"国之大者\"，国家的各项工作，都要以实现人民的幸福生活为根本出发点和落脚点。——摘自《人民日报》 **材料 2** 人民对美好生活的向往，就是我们的奋斗目标。——摘自《习近平在十八届中央政治局常委同中外记者见面时的讲话》 **材料 3** 保障和改善民生要抓住人民最关心最直接最现实的利益问题，既尽力而为，又量力而行，一件事情接着一件事情办，一年接着一年干。坚持人人尽责、人人享有，坚守底线、突出重点、完善制度、引导预期，完善公共服务体系，保障群众基本生活，不断满足人民日益增长的美好生活需要，不断促进社会公平正义，形成有效的社会治理、良好的社会秩序，使人民获得感、幸福感、安全感更加充实、更有保障、更可持续。——摘自党的十九大报告","options":[],"answer":"（见下方解析）","src":"","exp":"（1）全面建设社会主义现代化国家，出发点和落脚点是让人民生活越过越好。习近平指出，以人民为中心是我们党的根本执政理念，让人民生活幸福是\"国之大者\"。民生事关人民的生存生活生计，事关民心所向、民情所系、民意所指，决定党的事业成败和国家命运兴衰。\n① 增进民生福祉是坚持立党为公、执政为民的本质要求。\n② 增进民生福祉是社会主义生产的根本目的。\n③ 增进民生福祉是全面建设社会主义现代化国家的应有之义。\n（2）\n① 正确把握民生和发展的关系，是保障和改善民生的重要前提。\n② 坚守底线、突出重点、完善制度、引导预期，是保障和改善民生的工作思路。\n③ 解决人民群众最关心最直接最现实的利益问题，是保障和改善民生的重中之重。\n④ 坚持尽力而为、量力而行，是保障和改善民生的重要方针。\n⑤ 坚持人人尽责、人人享有，让所有劳动者在推动发展中分享发展成果，是保障和改善民生的重要原则。","warn":""}],"keyed":6,"doubts":0},{"id":"模拟卷06","name":"模拟卷6","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"模拟卷06","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"b0a8ddc493","lessonId":"模拟卷06","kind":"choice","question":"2025年8月17日22时15分，我国在______卫星发射中心使用______运载火箭，成功将卫星互联网低轨09组卫星发射升空，卫星顺利进入预定轨道，发射任务获得圆满成功。","options":[{"value":"A","text":"酒泉；长征六号改"},{"value":"B","text":"文昌；长征五号改"},{"value":"C","text":"太原；长征六号改"},{"value":"D","text":"太原；长征五号改"}],"answer":["C"],"explanation":"","chapter":"模拟卷6","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：2025 年 8 月 17 日 22 时 15 分，我国在太原卫星发射中心使用长征六号改运载火箭成功发射卫星互联网低轨 09 组卫星；来源：航天科技集团/公开报道","paperTitle":"模拟卷6","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025年8月17日22时15分，我国在______卫星发射中心使用______运载火箭，成功将卫星互联网低轨09组卫星发射升空，卫星顺利进入预定轨道，发射任务获得圆满成功。"},{"schemaVersion":1,"contentVersion":1,"id":"59e47ab1f7","lessonId":"模拟卷06","kind":"choice","question":"8月17日，随着开挖直径17.5米的______盾构机刀盘破土而出，由济南城市建设集团投资建设、中铁十四局集团承建的济南市黄岗路黄河隧道盾构段掘进完成，这一世界最大直径水下盾构隧道顺利贯通。","options":[{"value":"A","text":"\"掘进号\""},{"value":"B","text":"\"山河号\""},{"value":"C","text":"\"领航号\""},{"value":"D","text":"\"运河号\""}],"answer":["B"],"explanation":"","chapter":"模拟卷6","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：济南黄岗路黄河隧道采用开挖直径 17.5 米的\"山河号\"盾构机施工，2025 年 8 月 17 日盾构段掘进完成、隧道贯通，为世界最大直径水下盾构隧道；来源：新华网、中国铁建","paperTitle":"模拟卷6","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"8月17日，随着开挖直径17.5米的______盾构机刀盘破土而出，由济南城市建设集团投资建设、中铁十四局集团承建的济南市黄岗路黄河隧道盾构段掘进完成，这一世界最大直径水下盾构隧道顺利贯通。"},{"schemaVersion":1,"contentVersion":1,"id":"3569963112","lessonId":"模拟卷06","kind":"choice","question":"第 alue":"D","text":"基本国情"}],"answer":[],"explanation":"","chapter":"模拟卷6","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷6","course":"模拟押题"},"answerStatus":"missing","warn":"课件未提供答案。","grp":"题库","legacyQuestion":"我国基本分配制度是由我国______决定的。"},{"schemaVersion":1,"contentVersion":1,"id":"da0b3ffd5f","lessonId":"模拟卷06","kind":"choice","question":"加快建设法治中国，必须坚持______。","options":[{"value":"A","text":"统筹兼顾"},{"value":"B","text":"把握重点"},{"value":"C","text":"整体谋划"},{"value":"D","text":"相互配合"}],"answer":[],"explanation":"","chapter":"模拟卷6","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷6","course":"模拟押题"},"answerStatus":"missing","warn":"课件未提供答案。","grp":"题库","legacyQuestion":"加快建设法治中国，必须坚持______。"}],"subjs":[{"id":"bb2348bb5c","num":31,"type":"辨析","supp":false,"stem":"政治安全与人民安全、国家利益至上是有机统一的。","options":[],"answer":"正确。","src":"","exp":"政治安全与人民安全、国家利益至上是有机统一的。\n政治安全是维护人民安全和国家利益的根本保证；人民安全居于中心地位，国家安全归根到底是保障人民利益；国家利益至上是实现政治安全和人民安全的要求和原则。要把政治安全、人民安全、国家利益至上三者统一起来，确保实现党的长期执政、人民安居乐业、国家长治久安。","warn":""},{"id":"9492853d4b","num":32,"type":"辨析","supp":false,"stem":"改革是社会主义制度的自我完善和发展。","options":[],"answer":"正确。","src":"","exp":"改革是社会主义制度的自我完善，改革要达到的总的目的是要有利于巩固社会主义制度，有利于巩固党的领导，有利于在党的领导和社会主义制度下发展生产力。无论从解放生产力、扫除发展生产力的障碍这个意义上来说，还是从政策的重新选择、体制的重新建构这个转变的深刻性和广泛性，以及由此引起的社会生活和人们观念变化的深刻性和广泛性来说，改革都是一场新的革命，是推动社会主义社会发展的直接动力。而且，改革是社会主义制度的自我完善和发展，解决社会主义社会矛盾的主要方式就是通过改革，不断解放和发展生产力使之与先进的生产关系相适应。","warn":""},{"id":"c0d04372f2","num":33,"type":"简答","supp":false,"stem":"怎样加快发展方式绿色转型？","options":[],"answer":"（见下方解析）","src":"","exp":"习近平指出：\"绿色发展，就其要义来讲，是要解决好人与自然和谐共生问题。\"要加快推动发展方式绿色低碳转型，坚持把绿色低碳发展作为解决生态环境问题的治本之策。\n（1）加快推动产业结构、能源结构、交通运输结构等调整优化。\n（2）推进各类资源节约集约利用。\n（3）积极稳妥推进碳达峰碳中和。\n（4）健全绿色发展的保障体系。\n（5）坚持把建设美丽中国转化为全体人民自觉行动。\n（课件红字记忆口诀：**调结构、节资源、促双碳、建保障、共行动**）","warn":""},{"id":"4277a04d5e","num":34,"type":"简答","supp":false,"stem":"简述中国积极推动全球可持续发展的措施。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）积极参与全球气候治理。\n（2）积极推进全球生物多样性治理。\n（3）积极打造绿色\"一带一路\"。","warn":""},{"id":"566e40d775","num":35,"type":"简答","supp":false,"stem":"\"和平统一、一国两制\"构想的重大意义。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）实践：\"和平统一，一国两制\"构想，体现了照顾历史实际和现实可能的灵活性，有利于保持港、澳、台地区的稳定和繁荣，是实现国家统一的最佳方案。\n（2）理论：\"和平统一，一国两制\"构想，创造性地发展了马克思主义的国家学说。\n（3）理论：\"和平统一、一国两制\"构想是对和平共处五项原则的创造性运用和发展。\n（4）国际：\"和平统一、一国两制\"构想为解决国际争端和遗留问题提供了新的思路和范例。","warn":""},{"id":"6d3a22b119","num":36,"type":"论述","supp":false,"stem":"如何理解全过程人民民主是社会主义民主政治的伟大创造？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）全过程人民民主植根于我国社会主义民主的长期实践，是中国特色社会主义民主政治理论和实践的重大成果。\n（2）全过程人民民主是新时代我国民主政治领域具有重大创新意义的标志性成果。\n（3）全过程人民民主是过程民主和成果民主的统一。\n（4）全过程人民民主是程序民主和实质民主的统一。\n（5）全过程人民民主是直接民主和间接民主的统一。\n（6）全过程人民民主是人民民主和国家意志的统一。","warn":""},{"id":"54b510bdd1","num":37,"type":"材料","supp":false,"stem":"阅读材料，回答问题。 **材料1** 上个世纪80年代初，邓小平同志等老一辈领导人提出\"一国两制\"伟大构想时，就坚信这个方针是对头的，是行得通、办得到、得人心的。30多年来，\"一国两制\"实践取得的成功举世公认。当然，\"一国两制\"的制度体系也要在实践中不断加以完善。我们坚信，包括港澳同胞在内的中国人民完全有智慧、有能力把\"一国两制\"实践发展得更好，把\"一国两制\"制度体系完善得更好，把特别行政区治理得更好。 中华民族伟大复兴的前进步伐势不可挡，香港、澳门与祖国内地同发展、共繁荣的道路必将越走越宽广！ ——摘自习近平出席澳门回归祖国20周年大会暨澳门特别行政区第五届政府就职典礼演讲 （课件另附释义：\"一国两制\"是邓小平等老一辈领导人提出的正确方针，实践成果举世公认且制度体系需在实践中不断完善，中国人民有智慧和能力把这一实践发展好、把特别行政区治理好；中华民族伟大复兴势不可挡，香港、澳门必将与祖国内地同发展、共繁荣。） **材料2** 中华民族具有反对分裂、维护统一的光荣传统。\"台独\"分裂是祖国统一的最大障碍，是民族复兴的严重隐患。凡是数典忘祖、背叛祖国、分裂国家的人，从来没有好下场，必将遭到人民的唾弃和历史的审判！台湾问题纯属中国内政，不容任何外来干涉。任何人都不要低估中国人民捍卫国家主权和领土完整的坚强决心、坚定意志、强大能力！祖国完全统一的历史任务一定要实现，也一定能够实现！ ——摘自习近平于纪念辛亥革命110周年演讲 **请结合材料，回答问题：** （1）如何理解\"香港、澳门与祖国内地同发展、共繁荣的道路必将越走越宽广\"？ （2）为什么说\"祖国完全统一一定要实现，也一定能够实现\"？","options":[],"answer":"（见下方解析）","src":"","exp":"**（1）**\n① 积极主动助力国家全面开放。在国家扩大对外开放的过程中，香港、澳门的地位和作用只会加强，不会减弱。\n② 积极主动参与粤港澳大湾区建设。建设粤港澳大湾区，是党中央立足全局和长远作出的重大决策，也是保持香港、澳门长期繁荣稳定的重大举措，对于香港、澳门探索发展新路向、开拓发展新空间、增添发展新动力具有十分重要的作用。\n③ 积极主动参与国家治理实践。香港、澳门回归祖国后，已纳入国家治理体系。港澳人士有许多在国际社会发挥作用的优势，可以用多种方式支持国家参与全球治理。\n④ 积极主动促进国际人文交流。香港、澳门多元文化共存，是中西文化交流的重要纽带。\n在中华民族伟大复兴的历史进程中，香港、澳门必将在融入国家发展大局中实现更好发展，为全面建设社会主义现代化国家发挥更大作用、作出更大贡献，共同谱写中华民族伟大复兴的时代篇章。\n**（2）**\n解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务，是全体中华儿女的共同愿望，是实现中华民族伟大复兴的必然要求。\n① 实现祖国完全统一是由中华民族伟大复兴的时和势决定的，是不可阻挡的历史潮流。\n② 民族复兴、国家统一是大势所趋、大义所在、民心所向。\n③ 台湾前途在于国家统一，台湾同胞福祉系于民族复兴。\n④ 统一是历史大势，是正道；\"台独\"是历史逆流，是绝路。","warn":""}],"keyed":10,"doubts":0},{"id":"模拟卷07","name":"模拟卷7","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"模拟卷07","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"33b9cab36b","lessonId":"模拟卷07","kind":"choice","question":"浙江大学脑机智能全国重点实验室近日发布新一代神经拟态类脑计算机，它的昵称是______。这是基于专用神经拟态芯片的类脑计算机，所支持的脉冲神经元规模超过 20 亿，神经突触超过千亿，其神经元数量已接近猕猴大脑规模。","options":[{"value":"A","text":"大圣"},{"value":"B","text":"悟空"},{"value":"C","text":"行者"},{"value":"D","text":"弼马温"}],"answer":["B"],"explanation":"","chapter":"模拟卷7","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：浙江大学发布的全球规模最大神经拟态类脑计算机中文名为“悟空”。","paperTitle":"模拟卷7","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"浙江大学脑机智能全国重点实验室近日发布新一代神经拟态类脑计算机，它的昵称是______。这是基于专用神经拟态芯片的类脑计算机，所支持的脉冲神经元规模超过 20 亿，神经突触超过千亿，其神经元数量已接近猕猴大脑规模。"},{"schemaVersion":1,"contentVersion":1,"id":"46b107b61c","lessonId":"模拟卷07","kind":"choice","question":"2025 年两会中，首次被写入政府工作报告，需培育发展的未来产业是什么______。","options":[{"value":"A","text":"量子计算"},{"value":"B","text":"具身智能"},{"value":"C","text":"虚拟现实"},{"value":"D","text":"基因编辑"}],"answer":["B"],"explanation":"","chapter":"模拟卷7","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：2025 年政府工作报告首次写入“具身智能”和“6G”，给定选项中对应“具身智能”。","paperTitle":"模拟卷7","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025 年两会中，首次被写入政府工作报告，需培育发展的未来产业是什么______。"},{"schemaVersion":1,"contentVersion":1,"id":"de2c37736a","lessonId":"模拟卷07","kind":"choice","question":"为实现 2025 年经济目标，国家发展改革委将做到四个\"加力\"，不包括______。","options":[{"value":"A","text":"加力提振居民消费"},{"value":"B","text":"加力扩大有效投资"},{"value":"C","text":"加力降低企业税负"},{"value":"D","text":"加力构建现代化产业体系"}],"answer":["C"],"explanation":"","chapter

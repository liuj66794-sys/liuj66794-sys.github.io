n":"构建社会主义和谐社会的总要求______。"},{"schemaVersion":1,"contentVersion":1,"id":"21719dd102","lessonId":"模拟卷07","kind":"choice","question":"中国梦是______的梦，与世界各国人民的美好梦想相通。","options":[{"value":"A","text":"和平"},{"value":"B","text":"发展"},{"value":"C","text":"合作"},{"value":"D","text":"共赢"}],"answer":[],"explanation":"","chapter":"模拟卷7","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷7","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"中国梦是______的梦，与世界各国人民的美好梦想相通。"}],"subjs":[{"id":"39d4237377","num":31,"type":"辨析","supp":false,"stem":"把经济建设纳入党的建设总体布局并摆在首位，是新时代我们党对马克思主义党建理论的重大创新。","options":[],"answer":"错误","src":"","exp":"**参考答案（全文转录）：**\n把政治建设纳入党的建设总体布局并摆在首位，是新时代我们党对马克思主义党建理论的重大创新，体现了我们党对共产党执政规律的深刻认识，有着充分的理论和实践依据。\n（1）旗帜鲜明讲政治是我们党作为马克思主义政党的根本要求。马克思主义政党具有崇高政治理想、高尚政治追求、纯洁政治品质、严明政治纪律。如果马克思主义政党政治上的先进性丧失了，党的先进性和纯洁性就无从谈起。\n（2）从全面从严治党的实践看，党的政治建设决定党的建设方向和效果，不抓党的政治建设或背离党的政治建设指引的方向，党的其他建设就难以取得预期成效。只有党的政治建设抓好了，党的政治方向、政治立场、政治大局把握住了，党的政治能力提高了，党的建设才能夯基固本。\n📌 **本卷附：新时代党的建设总要求（原卷填空背诵页）**\n坚持和加强党的全面领导，坚持党要管党、全面从严治党，以加强党的（长期执政能力建设、先进性和纯洁性建设）为主线，以党的（政治建设）为统领，以坚定（理想信念宗旨）为根基，以调动全党（积极性、主动性、创造性）为着力点，全面推进党的政治建设、思想建设、组织建设、作风建设、纪律建设，把制度建设贯穿其中，深入推进反腐败斗争，不断提高党的建设质量，把党建设成为始终走在时代前列、人民衷心拥护、勇于自我革命、经得起各种风浪考验、朝气蓬勃的马克思主义执政党。\n（记忆口诀：珠姐正统，里脊是动力／领证不设限，跟踪是极点）","warn":""},{"id":"da1eda4f01","num":32,"type":"辨析","supp":false,"stem":"解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务，是全体中华儿女的共同愿望。","options":[],"answer":"正确","src":"","exp":"**参考答案（全文转录）：**\n解决台湾问题、实现祖国完全统一，是党矢志不渝的历史任务，是全体中华儿女的共同愿望，是实现中华民族伟大复兴的必然要求。\n（1）实现祖国完全统一是由中华民族伟大复兴的时和势决定的，是不可阻挡的历史潮流。\n（2）民族复兴、国家统一是大势所趋、大义所在、民心所向。\n（3）台湾前途在于国家统一，台湾同胞福祉系于民族复兴。\n（4）统一是历史大势，是正道；\"台独\"是历史逆流，是绝路。\n📌 **本卷附：辨析题答题模板总结（原卷第 32 页）**\n严格遵循\"判断 + 考点 + 结论\"的固定布局，直接用考点表述，不口语化：\n- 第一步：明确判断——直接写\"该说法正确 / 错误\"（无需额外修饰）。\n- 第二步：对应考点纠正 / 论证——若说法错误：直接写出正确考点，对比题干错误（用教材原文表述，不掺杂口语）。例（题干：人才是党执政兴国的第一要务）：正确考点是\"发展是党执政兴国的第一要务\"，题干将\"人才\"混淆为\"发展\"，表述错误。若说法正确：直接写出对应考点，强化观点（用教材原文）。\n- 第三步：总结结论——以\"因此，以上说法是正确 / 错误的\"收尾（简洁明确）。","warn":""},{"id":"c21f601a36","num":33,"type":"简答","supp":false,"stem":"为什么我国要坚定奉行独立自主的和平外交政策？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持走和平发展道路，是我们党根据时代发展潮流和我国根本利益作出的战略抉择，是新时代中国外交的基本原则。\n（2）走和平发展道路，是对国际社会关注中国发展走向的回应，更是中国人民对实现自身发展目标的自信和自觉。走和平发展道路是由中国共产党性质宗旨和我国社会主义制度决定的。走和平发展道路是基于中国历史文化传统作出的必然选择。走和平发展道路符合历史潮流、顺应世界大势。追求和平发展是世界各国人民的共同心声。\n（3）走和平发展道路，就要坚定奉行独立自主的和平外交政策。\n（4）走和平发展道路，既要通过维护世界和平发展自己，又要通过自身发展维护世界和平。","warn":""},{"id":"01a7b9fc50","num":34,"type":"简答","supp":false,"stem":"简述法治中国建设的工作布局。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持依法治国、依法执政、依法行政共同推进；\n（2）坚持法治国家、法治政府、法治社会一体建设；\n（3）坚持统筹推进国内法治和涉外法治。\n（口诀：依法共同，法治一体，统筹国内外。）","warn":""},{"id":"d328712783","num":35,"type":"简答","supp":false,"stem":"如何坚持中国特色社会主义文化发展道路？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持举旗帜、聚民心、育新人、兴文化、展形象。\n（2）坚持\"二为\"方向、\"双百\"方针。坚持为人民服务、为社会主义服务的根本方向，是决定社会主义文化事业前途命运的关键。坚持百花齐放、百家争鸣，是繁荣发展社会主义文化的重要方针。\n（3）激发全民族文化创新创造活力。","warn":""},{"id":"7cfe0bc7c1","num":36,"type":"论述","supp":false,"stem":"论述推动建立新型国际关系的具体要求。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）推动建立新型国际关系，要坚决维护国家核心利益。中国始终把坚决维护国家主权、安全、发展利益作为外交工作的基本出发点和落脚点，稳妥应对涉我领土主权和海洋权益争端，坚决维护国家的领土主权。\n（2）推动建立新型国际关系，要在和平共处五项原则基础上发展同世界各国的友好合作。要按照大国是关键、周边是首要、发展中国家是基础、多边是舞台的外交工作布局，发展与各国的友好关系。\n（3）推动建立新型国际关系，要积极参与全球治理体系改革和建设。中国秉持共商共建共享的全球治理观，倡导国际关系民主化，坚持国家不分大小、强弱、贫富一律平等，支持扩大发展中国家在国际事务中的代表性和发言权。\n（4）推动建立新型国际关系，要加强涉外法律工作，完善涉外法律法规体系。\n（5）推动建立新型国际关系，还要把相互尊重、公平正义、合作共赢理念体现到政治、经济、安全、文化等对外合作的方方面面，推动构建人类命运共同体。","warn":""},{"id":"41008b28c3","num":7,"type":"材料","supp":false,"stem":"请结合所学知识分析材料回答问题： **材料一：** 全面建设社会主义现代化国家、全面推进中华民族伟大复兴，关键在党。我们党作为世界上最大的马克思主义执政党，要始终赢得人民拥护、巩固长期执政地位，必须时刻保持解决大党独有难题的清醒和坚定。全党必须牢记，全面从严治党永远在路上，党的自我革命永远在路上，决不能有松劲歇脚、疲劳厌战的情绪，必须持之以恒推进全面从严治党，深入推进新时代党的建设新的伟大工程，以党的自我革命引领社会革命。 ——摘自 2022 年 10 月 16 日习近平在中国共产党第二十次全国代表大会上的报告 **材料二：** 意识形态工作是为国家立心、为民族立魂的工作，事关党的前途命运，事关国家长治久安，事关民族凝聚力和向心力。党的十八大以来，以习近平同志为核心的党中央高度重视意识形态工作，确立和坚持马克思主义在意识形态领域指导地位的根本制度。奋进新征程，我们必须高举马克思主义旗帜不动摇，不断巩固马克思主义在意识形态领域的指导地位，确保中国式现代化根基永远坚固、航向永不偏离。 ——摘自《解放军报》文章《坚持马克思主义在意识形态领域的指导地位》 **材料三：** 意识形态作为政党、国家和民族的政治目标导向和社会价值追求，直接关系到举什么旗、走什么路等重大政治方向问题。意识形态的自觉是政治坚定的前提，意识形态的自信是道路自信、理论自信、制度自信和文化自信的基础。马克思恩格斯特别重视意识形态问题，构建起完整的意识形态理论。中国共产党在领导人民进行革命、建设和改革的过程中，不断开创新实践、总结新经验、概括新理论，丰富和发展马克思主义意识形态理论，为我们提供了科学的思想方法和工作方法。 ——摘自《中国纪检监察报》文章《牢牢掌握马克思主义意识形态理论》","options":[],"answer":null,"src":"","exp":"","warn":""},{"id":"88727cea18","num":37,"type":"材料","supp":false,"stem":"请根据以上材料回答问题： （1）谈谈如何理解中国最大的国情就是中国共产党的领导。 （2）谈谈为什么要坚持马克思主义在意识形态领域指导地位的根本制度。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）①中国共产党是中国特色社会主义事业的坚强领导核心。②中国共产党的领导地位是在历史奋斗中形成的。③中国共产党领导是人民当家作主的可靠保障。④中国共产党领导关系中国特色社会主义的性质、方向和命运。⑤中国共产党领导是实现中华民族伟大复兴的根本保证。\n（2）①坚持马克思主义在意识形态领域指导地位的制度是中国特色社会主义制度体系的一项根本制度，是坚持和加强党对宣传思想文化工作全面领导的本质要求，是发展社会主义先进文化的有力保障。②坚持马克思主义在意识形态领域指导地位的根本制度是历史的结论，是关系党和国家事业长远发展、关系我国文化前进方向和发展道路的重大制度创新。③坚持马克思主义在意识形态领域指导地位的根本制度，是坚持和巩固我国社会主义制度、保证我国文化建设正确方向的必然要求。\n📌 **本卷附：材料分析题相关考点小结（原卷第 44 页）**\n1. 为什么坚持党的领导？\n党的领导是中国特色社会主义最本质的特征、最大优势。是历史和人民的选择。是国家统一、社会稳定、事业发展的根本保证。是实现中华民族伟大复兴的根本保证。\n2. 为什么坚持马克思主义指导地位？\n马克思主义是立党立国、兴党兴国的根本指导思想。是被历史和实践证明的科学真理。关乎旗帜、道路、国家政治安全。确保党和国家事业始终沿着正确方向前进。\n3. 为什么坚持中国特色社会主义道路？\n符合我国国情，体现社会主义制度优势。是历史和人民的选择。是实现国家富强、民族振兴、人民幸福的必由之路。是实现中华民族伟大复兴的唯一正确道路。","warn":""}],"keyed":9,"doubts":0},{"id":"模拟卷08","name":"模拟卷8","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"模拟卷08","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"c21bd5eaa6","lessonId":"模拟卷08","kind":"choice","question":"第一届全国青少年田径运动会 8 月 15 日在辽宁省沈阳市闭幕。来自全国 29 个省（区、市）、新疆生产建设兵团和香港、澳门特别行政区的 1100 多名青少年运动员在为期 6 天的比赛中连创佳绩。第二届全国青少年田径运动会将于明年在______举行。","options":[{"value":"A","text":"江苏省苏州市"},{"value":"B","text":"福建省厦门市"},{"value":"C","text":"广东省珠海市"},{"value":"D","text":"山东省日照市"}],"answer":["D"],"explanation":"","chapter":"模拟卷8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：国家体育总局公布，第二届全国青少年田径运动会将于 2026 年下半年在日照市举行。","paperTitle":"模拟卷8","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"第一届全国青少年田径运动会 8 月 15 日在辽宁省沈阳市闭幕。来自全国 29 个省（区、市）、新疆生产建设兵团和香港、澳门特别行政区的 1100 多名青少年运动员在为期 6 天的比赛中连创佳绩。第二届全国青少年田径运动会将于明年在______举行。"},{"schemaVersion":1,"contentVersion":1,"id":"7bd17d34b3","lessonId":"模拟卷08","kind":"choice","question":"8 月 17 日，随着开挖直径 17.5 米的______盾构机刀盘破土而出，由济南城市建设集团投资建设、中铁十四局集团承建的济南市黄岗路黄河隧道盾构段掘进完成，这一世界最大直径水下盾构隧道顺利贯通。","options":[{"value":"A","text":"\"掘进号\""},{"value":"B","text":"\"山河号\""},{"value":"C","text":"\"领航号\""},{"value":"D","text":"\"运河号\""}],"answer":["B"],"explanation":"","chapter":"模拟卷8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：济南市政府官网确认，8 月 17 日破洞而出的 17.5 米盾构机名为“山河号”。","paperTitle":"模拟卷8","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"8 月 17 日，随着开挖直径 17.5 米的______盾构机刀盘破土而出，由济南城市建设集团投资建设、中铁十四局集团承建的济南市黄岗路黄河隧道盾构段掘进完成，这一世界最大直径水下盾构隧道顺利贯通。"},{"schemaVersion":1,"contentVersion":1,"id":"4d27473b30","lessonId":"模拟卷08","kind":"choice","question":"8 月 15 日至 17 日，第七届大运河文化旅游博览会在______举办，本届运博会延续______主题，坚持专业化、市场化和品牌化理念，努力为运河沿线省市及全国文旅行业搭建一个文旅融合发展、文旅精品推广、美好生活共享的综合平台。","options":[{"value":"A","text":"苏州；\"融合·互鉴·合作\""},{"value":"B","text":"苏州；\"融合·创新·共享\""},{"value":"C","text":"杭州；\"融合·互鉴·合作\""},{"value":"D","text":"南京；\"融合·创新·共享\""}],"answer":["B"],"explanation":"","chapter":"模拟卷8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：江苏省政府官网确认，第七届大运河文化旅游博览会于 8 月 15 日至 17 日在苏州举办，主题为“融合·创新·共享”。","paperTitle":"模拟卷8","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"8 月 15 日至 17 日，第七届大运河文化旅游博览会在______举办，本届运博会延续______主题，坚持专业化、市场化和品牌化理念，努力为运河沿线省市及全国文旅行业搭建一个文旅融合发展、文旅精品推广、美好生活共享的综合平台。"},{"schemaVersion":1,"contentVersion":1,"id":"0ed2862476","lessonId":"模拟卷08","kind":"choice","question":"8 月 20 日，我国首个获得核准的沙戈荒新能源外送工程——______正负 800 千伏特高压直流工程投产送电。","options":[{"value":"A","text":"宁夏至安徽"},{"value":"B","text":"宁夏至湖南"},{"value":"C","text":"甘肃至湖南"},{"value":"D","text":"新疆至河北"}],"answer":["B"],"e ersion":1,"id":"7c051cccfb","lessonId":"模拟卷08","kind":"choice","question":"毛泽东指出，敌我矛盾和人民内部矛盾的性质和解决方法分别是______。","options":[{"value":"A","text":"前者是分清是非的问题，后者是分清敌我的问题"},{"value":"B","text":"前者是分清敌我的问题，后者是分清是非的问题"},{"value":"C","text":"前者采用专政方法，后者采用民主方法"},{"value":"D","text":"前者采用民主方法，后者采用专政方法"}],"answer":[],"explanation":"","chapter":"模拟卷8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷8","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"毛泽东指出，敌我矛盾和人民内部矛盾的性质和解决方法分别是______。"},{"schemaVersion":1,"contentVersion":1,"id":"f6233502fb","lessonId":"模拟卷08","kind":"choice","question":"加强党的先进性建设，必须______。","options":[{"value":"A","text":"在各方面推进党的建设"},{"value":"B","text":"反映全国各族人民的利益和愿望"},{"value":"C","text":"始终发挥领导核心和战斗堡垒作用"},{"value":"D","text":"始终发挥先锋模范作用"}],"answer":[],"explanation":"","chapter":"模拟卷8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷8","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"加强党的先进性建设，必须______。"},{"schemaVersion":1,"contentVersion":1,"id":"75564e106d","lessonId":"模拟卷08","kind":"choice","question":"社会主义初级阶段党的基本路线中的\"两个基本点\"是指______。","options":[{"value":"A","text":"坚持中国共产党的领导"},{"value":"B","text":"坚持社会主义道路"},{"value":"C","text":"坚持四项基本原则"},{"value":"D","text":"坚持改革开放"}],"answer":[],"explanation":"","chapter":"模拟卷8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷8","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"社会主义初级阶段党的基本路线中的\"两个基本点\"是指______。"},{"schemaVersion":1,"contentVersion":1,"id":"1fc784d8ce","lessonId":"模拟卷08","kind":"choice","question":"社会主义市场经济理论的要点有______。","options":[{"value":"A","text":"计划经济和市场经济不是划分社会制度的标志"},{"value":"B","text":"计划经济不等于社会主义"},{"value":"C","text":"计划和市场都是经济手段"},{"value":"D","text":"市场经济不等于资本主义"}],"answer":[],"explanation":"","chapter":"模拟卷8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷8","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"社会主义市场经济理论的要点有______。"}],"subjs":[{"id":"3fbf0e9bde","num":31,"type":"辨析","supp":false,"stem":"马克思主义中国化就是把马克思主义和中国文化结合起来。","options":[],"answer":"错误","src":"","exp":"**参考答案（全文转录）：**\n马克思主义中国化是将马克思主义基本原理同中国具体实际相结合，不断形成具有中国特色的马克思主义理论成果的过程。具体地说，就是把马克思主义的基本原理进一步同中国实践、中国历史、中国文化结合起来，使马克思主义在中国实现具体化。而马克思主义同中国文化的结合也不是一般意义上的结合，而是把马克思主义基本原理同中国的优秀文化结合起来。所以，该说法既没有看到马克思主义中国化是把马克思主义基本原理与中国的社会实践相结合，也没有看到它是同中国优秀文化的结合，因此是片面的。","warn":""},{"id":"daa4ea3ed1","num":32,"type":"辨析","supp":false,"stem":"实事求是与解放思想在本质上是完全一致的。","options":[],"answer":"正确","src":"","exp":"**参考答案（全文转录）：**\n（1）坚持实事求是的思想路线，就要深刻理解解放思想的深刻含义。解放思想是指在马克思主义的指导下，敢于超越已有的结论，敢于追随时代的发展和历史的步伐，确定符合实际的新思想，新观念；就是不唯上，不唯书，只唯实，使思想和实际相结合，使主观和客观相结合，也就是实事求是。\n（2）解放思想和实事求是在本质上是完全一致的：一方面，实事求是是解放思想的基础，只有坚持实事求是，才能真正达到解放思想；另一方面，解放思想是坚持实事求是原则的重要条件。只有坚持解放思想，才能保证做到实事求是。\n📌 **本卷附：辨析题答题模板总结（原卷第 28 页）**\n严格遵循\"判断 + 考点 + 结论\"的固定布局，直接用考点表述，不口语化：\n- 第一步：明确判断——直接写\"该说法正确 / 错误\"（无需额外修饰）。\n- 第二步：对应考点纠正 / 论证——若说法错误：直接写出正确考点，对比题干错误（用教材原文表述，不掺杂口语）。例（题干：人才是党执政兴国的第一要务）：正确考点是\"发展是党执政兴国的第一要务\"，题干将\"人才\"混淆为\"发展\"，表述错误。若说法正确：直接写出对应考点，强化观点（用教材原文）。\n- 第三步：总结结论——以\"因此，以上说法是正确 / 错误的\"收尾（简洁明确）。","warn":""},{"id":"5a17cc8b1f","num":33,"type":"简答","supp":false,"stem":"如何推动中华优秀传统文化创造性转化、创新性发展？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）创造性转化，就是要按照时代特点和要求，对那些至今仍有借鉴价值的内涵和陈旧的表现形式加以改造，赋予其新的时代内涵和现代表达形式，激活其生命力。\n（2）创新性发展，就是要按照时代的新进步新进展，对中华优秀传统文化的内涵加以补充、拓展、完善，增强其影响力和感召力。","warn":""},{"id":"759c8e1e80","num":34,"type":"简答","supp":false,"stem":"简述党的领导制度体系的主要内容。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）建立不忘初心、牢记使命的制度，形成长效机制，为坚持和完善党的领导制度体系奠定坚实基础。\n（2）完善坚定维护党中央权威和集中统一领导的各项制度，坚决把维护习近平同志党中央的核心、全党的核心地位落到实处，明确党的领导制度体系必须坚持的最高原则。\n（3）健全党的全面领导制度，确保党在各种组织中发挥领导作用，是党的领导制度体系的主体内容。\n（4）健全为人民执政、靠人民执政各项制度，巩固党执政的阶级基础，厚植党执政的群众基础，反映党的领导制度体系的价值追求。\n（5）健全提高党的执政能力和领导水平制度，提高党把方向、谋大局、定政策、促改革的能力，体现党的领导制度体系的实践要求。\n（6）完善全面从严治党制度，贯彻新时代党的建设总要求，为坚持和完善党的领导制度体系提供坚强保证。\n（口诀：不忘初心、维护中央、全面领导、为民执政、执政能力、从严治党。）","warn":""},{"id":"64ac3c556e","num":35,"type":"简答","supp":false,"stem":"简答人类命运共同体的内涵。","options":[],"answer":"（见下方解析）","src":"","exp":"核心是建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽世界。\n（1）政治上，相互尊重、平等协商，坚决摒弃冷战思维和强权政治，走对话而不对抗、结伴而不结盟的国与国交往新路；\n（2）安全上，要坚持以对话解决争端、以协商化解分歧，统筹应对传统和非传统安全威胁，反对一切形式的恐怖主义；\n（3）经济上，要同舟共济，促进贸易和投资自由化便利化，推动经济全球化朝着更加开放、包容、普惠、平衡、共赢的方向发展；\n（4）文化上，要尊重世界文明多样性，促进文明交流、加强文明互鉴、实现文明共存；\n（5）生态上，要坚持环境友好，合作应对气候变化，保护好人类赖以生存的地球家园。","warn":""},{"id":"16be4e44d6","num":36,"type":"论述","supp":false,"stem":"如何理解党在新时代的历史使命？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）实现中华民族伟大复兴是近代以来中华民族最伟大的梦想。新时代中国共产党的历史使命，就是统揽伟大斗争、伟大工程、伟大事业、伟大梦想，在全面建成小康社会的基础上全面建成社会主义现代化强国，实现中华民族伟大复兴的中国梦。\n①实现伟大梦想，必须进行具有许多新的历史特点的伟大斗争。\n②实现伟大梦想，必须深入推进党的建设新的伟大工程。\n③实现伟大梦想，必须推进中国特色社会主义伟大事业。\n（2）伟大斗争、伟大工程、伟大事业、伟大梦想是一个紧密联系、相互贯通、相互作用、有机统一的整体，统一于新时代坚持和发展中国特色社会主义伟大实践。伟大梦想是目标，指引前进方向；伟大斗争是手段，激发前进动力；伟大工程是保障，提供前进保证；伟大事业是主题，开辟前进道路。其中，起决定性作用的是党的建设伟大工程。\n因此，必须把党建设好，把伟大工程建设好，确保党在世界形势深刻变化的历史进程中始终走在时代前列，在坚持和发展中国特色社会主义的历史进程中始终成为坚强领导核心。","warn":""},{"id":"99f45a0a47","num":7,"type":"材料","supp":false,"stem":"请结合所学知识分析材料回答： **材料 1：** 习近平总书记指出：\"党的十八大以来我们对经济社会发展提出了许多重大理论和理念，其中新发展理念是最重要、最主要的。新发展理念是一个系统的理论体系，回答了关于发展的目的、动力、方式、路径等一系列理论和实践问题，阐明了我们党关于发展的政治立场、价值导向、发展模式、发展道路等重大政治问题。全党必须完整、准确、全面贯彻新发展理念。\" \"'十四五'时期我国将进入新发展阶段，改革又到了一个新的关头。\"2020 年 11 月 2 日，习近平总书记主持召开中央全面深化改革委员会第十六次会议时指出，\"贯彻党的十九届五中全会精神，要继续把握好改革和发展的内在联系，深刻认识我国社会主要矛盾变化带来的新特征新要求，深刻认识错综复杂国际环境带来的新矛盾新挑战，深刻认识全面深化改革的阶段性新特点新任务，紧扣贯彻新发展理念、推进高质量发展、构建新发展格局，紧盯解决突出问题，提高改革的战略性、前瞻性、针对性，使改革更好对接发展所需、基层所盼、民心所向，推动改革和发展深度融合、高效联动。\" ——摘编自《人民日报》（2021 年 12 月 8 日第 1、3 版） **材料 2：** 发展是党执政兴国的第一要务，是解决中国所有问题的关键。我们党领导人民治国理政，很重要的一个方面就是要回答好实现什么样的发展、怎样实现发展这个重大问题。《中共中央关于党的百年奋斗重大成就和历史经验的决议》以\"十个明确\"对习近平新时代中国特色社会主义思想的核心内容进行了系统概括，其中一个重要方面就是：\"明确必须坚持和完善社会主义基本经济制度，使市场在资源配置中起决定性作用，更好发挥政府作用，把握新发展阶段，贯彻创新、协调、绿色、开放、共享的新发展理念，加快构建以国内大循环为主体、国内国际双循环相互促进的新发展格局，推动高质量发展，统筹发展和安全\"。 习近平总书记强调：\"立足新发展阶段，贯彻新发展理念，构建新发展格局，推动高质量发展，是当前和今后一个时期全党全国必须抓紧抓好的工作。\"进入新发展阶段明确了我国发展的历史方位，贯彻新发展理念明确了我国现代化建设的指导原则，构建新发展格局明确了我国经济现代化的路径选择，高质量发展是\"十四五\"乃至更长时期我国经济社会发展的主题。只要完整、准确、全面贯彻新发展理念，加快构建新发展格局，推动高质量发展，加快实现科技自立自强，我们就一定能够不断提高我国发展的竞争力和持续力，在日趋激烈的国际竞争中把握主动、赢得未来。 ——摘编自《人民日报》（2022 年 4 月 6 日第 5 版）","options":[],"answer":null,"src":"","exp":"","warn":""},{"id":"065e98e6a8","num":37,"type":"材料","supp":false,"stem":"（原卷未标号，按整卷题序编为第 37 题）请结合所学知识分析材料回答： （1）结合材料 1，谈谈如何完整、准确、全面贯彻新发展理念？ （2）结合材料 2，谈谈把握新发展阶段、贯彻新发展理念、构建新发展格局三者之间的关系。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）一是从根本宗旨把握新发展理念。\n二是从问题导向把握新发展理念。\n三是从忧患意识把握新发展理念。\n（2）进入新发展阶段、贯彻新发展理念、构建新发展格局，是由我国经济社会发展的理论逻辑、历史逻辑、现实逻辑决定的，三者紧密关联。\n进入新发展阶段明确了我国发展的历史方位，贯彻新发展理念明确了我国现代化建设的指导原则，构建新发展格局明确了我国经济现代化的路径选择。\n把握新发展阶段是贯彻新发展理念、构建新发展格局的现实依据，贯彻新发展理念为把握新发展阶段、构建新发展格局提供了行动指南，构建新发展格局则是应对新发展阶段机遇和挑战、贯彻新发展理念的战略选择。\n【注意】主观题均为参考答案，考生自行结合材料发挥，答案合理，酌情给分。\n📌 **本卷附：材料 1 讲解页总结（原卷第 39 页；第 36、38 页为材料 1、材料 2 的要点复述页，已并入上文材料）**\n新发展理念是新时代我国经济社会发展的指导原则，必须完整、准确、全面贯彻落实。\n我国已进入新发展阶段，推动高质量发展、构建新发展格局是当前和今后一个时期的核心任务。\n必须坚持以发展为第一要务，推动改革与发展深度融合，不断提升我国发展的竞争力与主动权。","warn":""}],"keyed":5,"doubts":0}]</script>
<script>
(function () {
  var papers = JSON.parse(document.getElementById("bank").textContent);
  var tabsBox = document.getElementById("ptabs");
  var listBox = document.getElementById("papers");
  var view = document.getElementById("paperview");
  var note = document.getElementById("zone-note");
  var ZONES = ["毛中特", "习概", "题海（混合）", "模拟押题"];
  var current = "全部";

  function wrongByPaper() {
    var map = {};
    var all = ZQ.wrong.all();
    Object.keys(all).forEach(function (k) {
      var f = all[k].from || "";
      map[f] = (map[f] || 0) + 1;
    });
    return map;
  }

  function renderTabs() {
    tabsBox.innerHTML = "";
    ["全部"].concat(ZONES).forEach(function (z) {
      var b = document.createElement("button");
      b.textContent = z;
      if (z === current) b.className = "active";
      b.addEventListener("click", function () { current = z; renderTabs(); renderList(); });
      tabsBox.appendChild(b);
    });
  }

  function renderList() {
    view.style.display = "none";
    listBox.style.display = "";
    listBox.innerHTML = "";
    var wrongMap = wrongByPaper();
    var list = papers.filter(function (p) { return current === "全部" || p.zone === current; });
    var byGroup = {};
    list.forEach(function (p) { (byGroup[p.group] = byGroup[p.group] || []).push(p); });
    Object.keys(byGroup).forEach(function (g) {
      var h = document.createElement("h2");
      h.textContent = g;
      h.style.margin = "1.2rem 0 .6rem";
      listBox.appendChild(h);
      var grid = document.createElement("div");
      grid.className = "papergrid";
      byGroup[g].forEach(function (p) {
        var a = document.createElement("a");
        a.className = "papercard";
        a.href = "#";
        var w = wrongMap[p.name] || wrongMap[p.note] || 0;
        a.innerHTML = '<span class="pz">' + p.zone + '</span>' +
          '<span class="pt">' + p.name + '</span>' +
          '<span>客观 ' + p.mcqs.length + '（有答案 ' + p.keyed + '）· 主观 ' + p.subjs.length + '</span>' +
          (p.doubts ? ' · <span style="color:var(--gold)">存疑 ' + p.doubts + '</span>' : '') +
          (w ? '<br><span class="wrongchip">📕 错过 ' + w + ' 题</span>' : '');
        a.addEventListener("click", function (e) { e.preventDefault(); openPaper(p.id); });
        grid.appendChild(a);
      });
      listBox.appendChild(grid);
    });
    if (!list.length) listBox.innerHTML = '<p class="hint">该分区暂无试卷。</p>';
  }

  function openPaper(pid) {
    var p = papers.find(function (x) { return x.id === pid; });
    if (!p) return;
    listBox.style.display = "none";
    view.style.display = "";
    view.innerHTML = "";
    var back = document.createElement("button");
    back.className = "btn";
    back.textContent = "‹ 返回卷列表";
    back.addEventListener("click", renderList);
    var head = document.createElement("header");
    head.className = "lesson-head";
    head.innerHTML = '<div class="kicker">' + p.zone + ' · ' + p.group + '</div>' +
      '<h1 class="title" style="font-size:1.5rem">' + p.name + '</h1>' +
      '<p class="lede">客观 ' + p.mcqs.length + ' · 有答案 ' + p.keyed + ' · 主观 ' + p.subjs.length + '</p>' +
      '<div class="meta-row"><a class="chip" href="' + "obsidian://open?vault=%E7%9F%A5%E8%AF%86%E5%BA%93&file=" + encodeURIComponent(p.note) + '">Obsidian 原卷 ↗</a></div>';
    view.appendChild(back);
    view.appendChild(head);

    if (p.subjs.length) {
      var sh = document.createElement("h3");
      sh.textContent = "主观题 · 先自己写要点，再展开对答案";
      view.appendChild(sh);
      p.subjs.forEach(function (q) {
        var d = document.createElement("details");
        d.className = "qa subj";
        var ans = q.answer
          ? '<span class="anslabel">' + q.type + '答案</span>' + escRich(q.answer) +
            (q.src ? '<br><span style="font-family:var(--sans);font-size:.78rem;color:var(--ink-soft)">（' + escRich(q.src) + '）</span>' : '')
          : '<span class="anslabel warn">⚠️ 原卷未给答案</span>';
        if (q.exp) ans += '<div style="margin-top:.4rem;white-space:pre-wrap">' + escRich(q.exp) + '</div>';
        if (q.warn) ans += '<div style="margin-top:.4rem;color:var(--gold)">⚠️ ' + escRich(q.warn) + '</div>';
        d.innerHTML = '<summary><span class="tag">' + q.type + '</span>' + escRich(q.stem) + '</summary>' +
          '<div class="ans">' + ans + '</div>';
        view.appendChild(d);
      });
    }

    if (p.mcqs.length) {
      var mh = document.createElement("h3");
      mh.textContent = "客观题 · 点击选项即时判分（多选需确认）";
      view.appendChild(mh);
      var mount = document.createElement("div");
      view.appendChild(mount);
      ZQ.mountQuiz(mount, p.mcqs, { from: p.name });
    }
    window.scrollTo({ top: 0 });
  }

  renderTabs();
  renderList();
/* zhixu-review-paper */
  var reviewRef = new URLSearchParams(location.search).get('reviewQuestion');
  var reviewPaper = reviewRef && papers.find(function (p) { return p.mcqs.some(function (q) { return q.id === reviewRef; }); });
  if (reviewPaper) openPaper(reviewPaper.id);

})();
</script>
</body>
</html>

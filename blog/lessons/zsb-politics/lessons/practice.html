estion":"毛泽东指出，中国共产党区别于其他任何政党的显著标志是（ ）","options":[{"value":"A","text":"理论和实践相结合的作风"},{"value":"B","text":"和人民群众紧密地联系在一起的作风"},{"value":"C","text":"自我批评的作风"},{"value":"D","text":"艰苦奋斗的作风"}],"answer":["A","B","C"],"explanation":"三大作风（理论和实践相结合、和人民群众紧密地联系在一起、自我批评）是党区别于其他任何政党的显著标志；D 艰苦奋斗属\"两个务必\"内容，不在三大作风之列。","chapter":"随堂练习 · 毛中特2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特2","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"毛泽东指出，中国共产党区别于其他任何政党的显著标志是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"39d2837b5d","lessonId":"随堂练习-毛中特2","kind":"choice","question":"党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》指出：毛泽东思想的活 的灵魂，是贯穿于其各个理论组成部分的立场、观点和方法，它们有三个基本方面，即（ ） （原文如此，\"活\"后留有空格）","options":[{"value":"A","text":"实事求是"},{"value":"B","text":"统一战线"},{"value":"C","text":"群众路线"},{"value":"D","text":"独立自主"}],"answer":["A","C","D"],"explanation":"活的灵魂三个基本方面即实事求是、群众路线、独立自主；B 统一战线属三大法宝。","chapter":"随堂练习 · 毛中特2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特2","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"党的十一届六中全会通过的《关于建国以来党的若干历史问题的决议》指出：毛泽东思想的活 的灵魂，是贯穿于其各个理论组成部分的立场、观点和方法，它们有三个基本方面，即（ ） （原文如此，\"活\"后留有空格）"},{"schemaVersion":1,"contentVersion":1,"id":"5da3c64e8d","lessonId":"随堂练习-毛中特2","kind":"choice","question":"毛泽东指出：\"'实事'就是客观存在着的一切事物，'是'就是客观事物的内部联系，即规律性，'求'就是我们去研究。\"实事求是，就是（ ）","options":[{"value":"A","text":"理论联系实践"},{"value":"B","text":"一切从实际出发"},{"value":"C","text":"理论联系实际"},{"value":"D","text":"坚持在实践中检验真理和发展真理"}],"answer":["B","C","D"],"explanation":"实事求是就是一切从实际出发、理论联系实际、坚持在实践中检验真理和发展真理；A\"理论联系实践\"系措辞干扰，标准表述为\"理论联系实际\"。","chapter":"随堂练习 · 毛中特2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特2","course":"毛中特"},"answerStatus":"provided","warn":"","g ,"lessonId":"随堂练习-毛中特4","kind":"choice","question":"从 1949 年至 1952 年，党领导人民集中力量恢复国民经济，继续完成民主革命遗留的任务。与此同时，实际上开始了向社会主义的过渡。这期间的主要任务有（ ）","options":[{"value":"A","text":"没收官僚资本，建立社会主义性质的国营经济"},{"value":"B","text":"在完成土地改革以后的农村及时地开展互助合作运动"},{"value":"C","text":"广泛发展初级形式的国家资本主义"},{"value":"D","text":"巩固公有制的基础地位"}],"answer":["A","B","C"],"explanation":"没收官僚资本建立国营经济、土改后及时开展互助合作、广泛发展初级形式国家资本主义，均为这三年实际开始向社会主义过渡的步骤；D 错——当时社会主义公有制尚未建立，无从\"巩固\"。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"从 1949 年至 1952 年，党领导人民集中力量恢复国民经济，继续完成民主革命遗留的任务。与此同时，实际上开始了向社会主义的过渡。这期间的主要任务有（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"c5bd0acecb","lessonId":"随堂练习-毛中特4","kind":"choice","question":"下列关于党在过渡时期总路线的提出的说法，正确的是（ ）","options":[{"value":"A","text":"其是国家独立和富强的必然要求"},{"value":"B","text":"其是实现社会主义工业化的客观要求"},{"value":"C","text":"我国已经有了相对强大和迅速发展的社会主义国营经济"},{"value":"D","text":"当时的国际形势有利于中国向社会主义过渡"}],"answer":["A","B","C","D"],"explanation":"A/B 是总路线提出的必然性（实现国家工业化是国家独立和富强的必然要求与客观要求）；C/D 是其现实依据（相对强大和迅速发展的社会主义国营经济、有利的国际形势）。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"下列关于党在过渡时期总路线的提出的说法，正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"7919be1433","lessonId":"随堂练习-毛中特4","kind":"choice","question":"下列关于过渡时期对农业的社会主义改造的说法，正确的是（ ）","options":[{"value":"A","text":"积极引导农民组织起来，走互助合作道路"},{"value":"B","text":"遵循自愿互利、典型示范和国家帮助的原则"},{"value":"C","text":"正确分析农村的阶级和阶层状况，制定正确的阶级政策"},{"value":"D","text":"坚持积极领导、稳步前进的方针，采取循序渐进的步骤"}],"answer":["A","B","C","D"],"explanation":"与农业改造四条经验一一对应：走互助合作道路／自愿互利、典型示范、国家帮助／正确阶级政策／积极领导、稳步前进＋循序渐进。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"下列关于过渡时期对农业的社会主义改造的说法，正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"2dab2b3450","lessonId":"随堂练习-毛中特4","kind":"choice","question":"下列关于党和政府对资本主义工商业的社会主义改造的说法，正确的是（ ）","options":[{"value":"A","text":"用和平赎买的方法改造资本主义工商业"},{"value":"B","text":"采取从低级到高级的国家资本主义的过渡形式"},{"value":"C","text":"对资本主义工商业的社会主义改造经历了两个步骤，第一步主要实行个别企业的公私合营，第二步是实行全行业的公私合营"},{"value":"D","text":"把资本主义工商业者改造成为自食其力的社会主义劳动者"}],"answer":["A","B","D"],"explanation":"A/B/D 为教材口径的改造方法与经验；C 不选——对资改造整体经历\"初级形式国家资本主义→个别企业公私合营→全行业公私合营\"三步，\"两个步骤\"仅指公私合营阶段内部的划分。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"下列关于党和政府对资本主义工商业的社会主义改造的说法，正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"e317fd3d33","lessonId":"随堂练习-毛中特4","kind":"choice","question":"下列关于社会主义基本制度的确立的说法，正确的是（ ）","options":[{"value":"A","text":"为当代中国一切发展进步奠定了制度基础"},{"value":"B","text":"使广大劳动人民真正成为国家的主人"},{"value":"C","text":"是世界社会主义运动史上又一个历史性的伟大胜利"},{"value":"D","text":"丰富和发展了马克思主义的科学社会主义理论"}],"answer":["A","B","C","D"],"explanation":"与社会主义基本制度确立的四条重大意义一一对应（制度基础／劳动人民当家作主／世界社会主义运动的伟大胜利／丰富发展科学社会主义）。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"下列关于社会主义基本制度的确立的说法，正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"90d7a0dfba","lessonId":"随堂练习-毛中特4","kind":"choice","question":"下列关于手工业的社会主义改造的说法，正确的是（ ）","options":[{"value":"A","text":"采取积极领导、稳步前进的方针"},{"value":"B","text":"从供销合作入手，逐步发展到走生产合作的道路"},{"value":"C","text":"用和平赎买的方法改造"},{"value":"D","text":"遵循自愿互利、典型示范和国家帮助的原则"}],"answer":["A","B","D"],"explanation":"手工业改造方针\"积极领导、稳步前进\"，从供销合作入手逐步发展到生产合作，遵循自愿互利、典型示范和国家帮助的原则（章笔记口径另记\"说服教育\"）；C 不选——和平赎买只适用于资本主义工商业。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"下列关于手工业的社会主义改造的说法，正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"ce5addd4ba","lessonId":"随堂练习-毛中特4","kind":"choice","question":"对资本主义工商业实行和平赎买的积极作用在于（ ）","options":[{"value":"A","text":"发挥私营工商业在国计民生方面的积极作用，促进国民经济的发展"},{"value":"B","text":"巩固和发展统一战线"},{"value":"C","text":"发挥民族资产阶级中大多数人的知识、才能、技术专长和管理经验"},{"value":"D","text":"争取和团结更多的知识分子为社会主义建设服务"}],"answer":["A","B","C"],"explanation":"和平赎买有利于发挥私营工商业在国计民生中的积极作用、发挥民族资产阶级的知识才能技术专长和管理经验、巩固和发展统一战线；D（争取知识分子）不属于其直接作用。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"对资本主义工商业实行和平赎买的积极作用在于（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"96ed24777e","lessonId":"随堂练习-毛中特4","kind":"choice","question":"在进行社会主义改造、向社会主义过渡的进程中，中国共产党积累了丰富的历史经验，其中包括（ ）","options":[{"value":"A","text":"坚持社会主义工业化建设与社会主义改造同时并举"},{"value":"B","text":"采取积极引导、逐步过渡的方式"},{"value":"C","text":"用和平方法进行改造"},{"value":"D","text":"不能因为出现一些失误而否定社会主义改造的伟大意义"}],"answer":["A","B","C"],"explanation":"社会主义改造三条历史经验：工业化建设与改造同时并举、积极引导逐步过渡、和平方法；D 是对改造意义的评价，不属于\"历史经验\"条目。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"在进行社会主义改造、向社会主义过渡的进程中，中国共产党积累了丰富的历史经验，其中包括（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"38fbbc90da","lessonId":"随堂练习-毛中特4","kind":"choice","question":"在社会主义经济基础建立的同时，我国的政治领域发生了重大变化，具体表现为（ ）","options":[{"value":"A","text":"确立了中国共产党领导的人民民主专政的社会主义基本政治制度"},{"value":"B","text":"人民民主专政实质上已成为无产阶级专政"},{"value":"C","text":"人民代表大会制度、中国共产党领导的多党合作和政治协商制度、民族区域自治制度、基层群众自治制度已经确立"},{"value":"D","text":"结束了由中国人民政治协商会议代行全国人民代表大会职权，由《共同纲领》代行国家宪法的过渡状态"}],"answer":["A","B","D"],"explanation":"政治领域变化：社会主义基本政治制度确立、人民民主专政实质上已成为无产阶级专政、1954 年人大召开与宪法颁布结束了政协代行人大职权和《共同纲领》代行宪法的过渡状态；C 不选——基层群众自治制度系改革开放后逐步确立并概括，1950 年代尚未确立。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"在社会主义经济基础建立的同时，我国的政治领域发生了重大变化，具体表现为（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"0cd0b16e5c","lessonId":"随堂练习-毛中特4","kind":"choice","question":"下列关于\"一化\"和\"三改\"之间关系的表述，正确的有（ ）","options":[{"value":"A","text":"二者相互联系，不可分离"},{"value":"B","text":"二者相互促进，相辅相成"},{"value":"C","text":"\"一化\"是\"主体\"，\"三改\"是\"两翼\""},{"value":"D","text":"体现了社会主义建设与社会主义改造同时并举"}],"answer":["A","B","C","D"],"explanation":"\"一化\"是主体、\"三改\"是两翼，二者相互联系、相互促进、相辅相成，体现社会主义建设与社会主义改造同时并举。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"下列关于\"一化\"和\"三改\"之间关系的表述，正确的有（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"e1c3b671a2","lessonId":"随堂练习-毛中特4","kind":"choice","question":"我国对资本主义工商业进行社会主义改造的经验有（ ）。","options":[{"value":"A","text":"严格区别官僚资本和民族资本的界限，实行了和平赎买，和平地实现了和平关系〔？〕的深刻变革"},{"value":"B","text":"创造了国家资本主义的多种形式，采取了由低级到高级逐步过渡的形势〔？〕"},{"value":"C","text":"把对企业的改造和对资本家的改造结合起来，把资本家改造成自食其力的劳动者"},{"value":"D","text":"对私人资本主义的赎买政策应始终坚持\"四马分肥\""}],"answer":["A","B","C"],"explanation":"严格区别官僚资本与民族资本并实行和平赎买、创造多种国家资本主义形式由低级到高极逐步过渡、改造企业与改造人相结合；D 不选——赎买政策因阶段而异（四马分肥→定股定息），并非始终坚持\"四马分肥\"。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"我国对资本主义工商业进行社会主义改造的经验有（ ）。"},{"schemaVersion":1,"contentVersion":1,"id":"402df11cdb","lessonId":"随堂练习-毛中特4","kind":"choice","question":"新中国对民族资产阶级实行和平赎买的必要性在于（ ）。","options":[{"value":"A","text":"民族资产阶级经济实力雄厚，掌握国家经济命脉"},{"value":"B","text":"民族资产阶级有一定的技术专长和管理经验"},{"value":"C","text":"民族资产阶级经济构成整个国民经济的基础"},{"value":"D","text":"中国经济落后，需要利用民族资本主义经济有利于国计民生的一面"}],"answer":["B","D"],"explanation":"和平赎买的必要性：民族资产阶级有一定的技术专长和管理经验，中国经济落后需要利用民族资本主义经济有利于国计民生的一面；A/C 错——掌握国家经济命脉的是官僚资本（已被没收），民族资本主义经济并不构成国民经济的基础。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"新中国对民族资产阶级实行和平赎买的必要性在于（ ）。"},{"schemaVersion":1,"contentVersion":1,"id":"0839dc7fcb","lessonId":"随堂练习-毛中特4","kind":"choice","question":"我国社会主义改造是一场伟大的社会变革，但是在改造过程中也出现了一些偏差，遗留了一些问题，具体表现在（ ）。","options":[{"value":"A","text":"所有制结构过于单一，在社会主义公有制已居于绝对统治地位的条件下，没有限度地保留一部分有益于国计民生的个体经济和私营经济"},{"value":"B","text":"高度集中的计划经济体制也随之扩大到整个社会经济生活"},{"value":"C","text":"在一定程度上排斥了商品经济的正常运行"},{"value":"D","text":"要求过急，发展过快，工作过粗，改造形式过于简单"}],"answer":["A","B","C","D"],"explanation":"A/B/C 为改造遗留问题（所有制结构过于单一、高度集中的计划经济体制扩大到整个社会经济生活、一定程度排斥商品经济正常运行），D 为《决议》对偏差的固定表述（通行原文为\"要求过急、工作过粗、改变过快、形式过于简单划一\"）。","chapter":"随堂练习 · 毛中特4","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特4","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"我国社会主义改造是一场伟大的社会变革，但是在改造过程中也出现了一些偏差，遗留了一些问题，具体表现在（ ）。"}],"subjs":[],"keyed":33,"doubts":1},{"id":"随堂练习-习概5","name":"随堂练习 · 习概5","zone":"习概","group":"随堂练习","subject":"习概","note":"随堂练习-习概5","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"c48c1cf ,"text":"论述了经济建设和国防建设的关系"},{"value":"B","text":"论述了国家、集体和个人的关系的基本原则"},{"value":"C","text":"要求中央向地方分权和扩大企业自主权"},{"value":"D","text":"提出了从全体人民出发，\"统筹兼顾，适当安排\"的方针"}],"answer":["A","B","C"],"explanation":"A 为前三条之一（经济建设和国防建设的关系）；B 对应\"国家、生产单位和生产者个人的关系\"；C 对应\"中央和地方的关系\"（分权、扩大企业自主权）；D 不选——\"统筹兼顾，适当安排\"方针系统提出于 1957 年《关于正确处理人民内部矛盾的问题》（本卷多选第 3 题 C 项亦印证此归属）。","chapter":"随堂练习 · 毛中特5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特5","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"1956 年 4 月，毛泽东作了《论十大关系》的报告。下列关于《论十大关系》的说法，正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"9e19c015c8","lessonId":"随堂练习-毛中特5","kind":"choice","question":"毛泽东认为，充分调动一切积极因素，尽可能地克服消极因素，并且努力化消极因素为积极因素，这是社会主义事业前进的需要。调动一切积极因素为社会主义事业服务（ ）","options":[{"value":"A","text":"必须坚持中国共产党的领导"},{"value":"B","text":"必须发展社会主义民主政治"},{"value":"C","text":"有一个如何认识社会主义发展阶段和社会主义建设规律的问题"},{"value":"D","text":"有一个如何认识和处理社会主义社会矛盾的问题"}],"answer":["A","B"],"explanation":"\"调动一切积极因素为社会主义事业服务\"的两个\"必须\"：坚持中国共产党的领导、发展社会主义民主政治；C/D 属初步探索其他方面（社会主义发展阶段与建设规律、社会矛盾学说）对应的问题。","chapter":"随堂练习 · 毛中特5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 依据课件内容判定·非原卷答案","paperTitle":"随堂练习 · 毛中特5","course":"毛中特"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"毛泽东认为，充分调动一切积极因素，尽可能地克服消极因素，并且努力化消极因素为积极因素，这是社会主义事业前进的需要。调动一切积极因素为社会主义事业服务（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"e294b25bcd","lessonId":"随堂练习-毛中特5","kind":"choice","question":"1957 年 2 月，毛泽东作了《关于正确处理人民内部矛盾的问题》的报告。关于此次报告的主要内容，下列说法正确的是（ ）","options":[{"value":"A","text":"提出我国社会主义制度还刚刚建立，还没有完全建成，还不完全巩固的思想"},{"value":"B","text":"强调要正确处理人民内部矛盾"},{"value":"C","text":"提出从全体人民出发，\"统筹兼顾，适当安排\"的方针"},{"value":"D","text":"提出发展工业必须同发展农业同时并举的工业化方针"}],"answer":["A","B","C","D"],"explanation":"均为《关于正确处理人民内部矛盾的问题》的要点：社会主义制度还刚建立、还没有完全建成还不完全巩固；强调正确处理人民内部矛盾；提出\"统筹兼顾，适当安排\"；中国工业化道路（发展工业必须同发展农业同时并举）。","chapt 持独立思考，走自己的路"},{"value":"B","text":"坚定不移地维护民族独立、捍卫国家主权"},{"value":"C","text":"把立足点放在依靠自己力量的基础上"},{"value":"D","text":"同时积极争取外援，开展国际经济文化交流，学习外国一切对我们有益的先进事物"}],"answer":[],"explanation":"","chapter":"题海1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海1","course":"题海（混合）"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"独立自主，就是（ ）"}],"subjs":[{"id":"11f1f275c0","num":1,"type":"辨析","supp":false,"stem":"马克思主义中国化就是把马克思主义和中国文化结合起来。","options":[],"answer":"该观点是错误的。马克思主义中国化是将马克思主义基本原理同中国具体实际相结合，不断形成具有中国特色的马克思主义理论成果的过程。具体地说，就是把马克思主义的基本原理进一步同中国实践、中国历史、中国文化结合起来，使马克思主义在中国实现具体化。而马克思主义同中国文化的结合也不是一般意义上的结合，而是把马克思主义基本原理同中国的优秀文化结合起来。所以，该说法既没有看到马克思主义中国化是把马克思主义基本原理与中国的社会实践相结合，也没有看到它是同中国优秀文化的结合，因此是片面的。","src":"原卷附参考答案","exp":"（原卷批注：错误类答题思路——否定观点 + 指出错误 + 纠正正确）","warn":""},{"id":"035755b6fa","num":2,"type":"辨析","supp":false,"stem":"马克思主义中国化，就是将马克思主义基本原理同中国具体实际相结合。","options":[],"answer":"该观点是正确的，马克思主义中国化的科学内涵表现为：","src":"原卷附参考答案","exp":"（1）把马克思主义基本原理同中国具体实际和时代特征结合起来，运用马克思主义的立场、观点、方法研究和解决中国革命、建设、改革中的实际问题。\n（2）总结和提炼中国革命、建设、改革的实践经验，从而认识和掌握客观规律，为马克思主义理论宝库增添新的内容。\n（3）运用中国人民喜闻乐见的民族语言来阐述马克思主义理论，使之成为具有中国特色、中国风格、中国气派的马克思主义。\n（原卷批注：正确类题目答题思路——肯定观点 + 阐释依据）","warn":""},{"id":"69db4a64ac","num":2,"type":"论述","supp":false,"stem":"试述毛泽东思想形成和发展的社会历史条件。","options":[],"answer":"（见下方解析）","src":"原卷附参考答案","exp":"（1）世界进入帝国主义和无产阶级革命时代，战争和革命成为时代主题。\n（2）十月革命给中国送来了马克思列宁主义，帮助中国的先进分子开始用无产阶级的世界观作为观察国家命运的工具，中国革命从此有了科学的指导思想。\n（3）中国革命和建设的特殊国情使得中国革命和建设要求运用马克思主义指导中国革命和建设，必须和中国实际相结合。毛泽东思想形成和发展的过程就是马克思主义同中国革命、建设实际相结合的过程。\n（4）中国革命和建设的实践经验。中国共产党成立后，领导人民求翻身、求解放，经历了艰苦卓绝的斗争，有成功的宝贵经验，也有失败的惨痛教训。毛泽东思想正是对这些经验教训进行深刻总结而形成的理论概括。\n（原卷批注·答题思路总结：从时代背景、经济基础、政治环境、思想文化基础、实践基础、个人因素等角度思考）","warn":""},{"id":"ee942d3d4c","num":2,"type":"简答","supp":false,"stem":"简述毛泽东思想的历史地位。","options":[],"answer":"（见下方解析）","src":"原卷附参考答案","exp":"（1）毛泽东思想是马克思主义中国化的第一个重大理论成果。毛泽东是马克思主义中国化的伟大开拓者，是毛泽东思想的主要创立者。在中国共产党历史上，毛泽东第一个明确提出了\"马克思主义中国化\"的科学命题和重大任务，深刻论证了马克思主义中国化的必要性和极端重要性，系统阐述了马克思主义中国化的科学内涵和实现马克思主义中国化的正确途径，开辟了马克思主义在中国发展的宽广道路，为党领导的革命和建设事业的发展奠定了坚实的思想理论基础。\n（2）毛泽东思想是中国革命和建设的科学指南。毛泽东思想是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结。\n（3）毛泽东思想是中国共产党和中国人民宝贵的精神财富。毛泽东追求和倡导的中华民族重新自立于世界民族之林的远大理想，实事求是的思想路线，全心全意为人民服务的奋斗宗旨，自力更生、艰苦奋斗的革命精神，等等，依然是中国人民不断奋进的强大精神动力，将长期激励和指导我们前进。\n（原卷批注·记忆口诀：第一个财富指南）","warn":""}],"keyed":26,"doubts":0},{"id":"题海02","name":"题海2","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海02","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"82eee19d77","lessonId":"题海02","kind":"choice","question":"中国共产党的根本工作路线是（ ），是我们党永葆青春活力和战斗力的重要传家宝","options":[{"value":"A","text":"实事求是"},{"value":"B","text":"群众路线"},{"value":"C","text":"独立自主"},{"value":"D","text":"自力更生"}],"answer":[],"explanation":"","chapter":"题海2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海2","course":"题海（混合）"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"中国共产党的根本工作路线是（ ），是我们党永葆青春活力和战斗力的重要传家宝"},{"schemaVersion":1,"contentVersion":1,"id":"8caebc934a","lessonId":"题海02","kind":"choice","question":"群众路线，就是一切为了群众，一切依靠群众，从群众中来，到群众中去，这是党的（ ）","options":[{"value":"A","text":"根本思想路线"},{"value":"B","text":"根本工作路线"},{"value":"C","text":"根本政治原则"},{"value":"D","text":"根本制度保证"}],"answer":[],"explanation":"","chapter":"题海2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海2","course":"题海（混合）"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"群众路线，就是一切为了群众，一切依靠群众，从群众中来，到群众中去，这是党的（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"1e838cbd54","lessonId":"题海02","kind":"choice","question":"毛泽东提出，经济工作和其他一切工作的生命线是（ ）","options":[{"value":"A","text":"思想政治工作"},{"value":"B","text":"组织建设工作"},{"value":"C","text":"作风建设工作"},{"value":"D","text":"军队建设工作"}],"answer":[],"explanation":"","chapter":"题海2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海2","course":"题海（ id":"fc7eea51bb","lessonId":"题海02","kind":"choice","question":"在社会主义改造时期，手工业的社会主义改造经历了（ ）的步骤","options":[{"value":"A","text":"手工业互助小组"},{"value":"B","text":"手工业供销小组"},{"value":"C","text":"手工业供销合作社"},{"value":"D","text":"手工业生产合作社"}],"answer":["B","C","D"],"explanation":"","chapter":"题海2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"依据原卷第 51 页红色步骤框：手工业供销小组（社会主义萌芽）→手工业供销社（半社会主义性质）→手工业生产合作社（完全社会主义性质）","paperTitle":"题海2","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"在社会主义改造时期，手工业的社会主义改造经历了（ ）的步骤"},{"schemaVersion":1,"contentVersion":1,"id":"9b55aa921d","lessonId":"题海02","kind":"choice","question":"在社会主义改造时期，对资本主义工商业的社会主义改造经历的步骤是（ ）","options":[{"value":"A","text":"实行初级形式的国家资本主义"},{"value":"B","text":"实行个别企业的公私合营"},{"value":"C","text":"实行高级形式的国家资本主义"},{"value":"D","text":"实行全行业的公私合营"}],"answer":["A","B","D"],"explanation":"","chapter":"题海2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"依据原卷第 52 页归纳：初级形式——加工订货、统购包销、经销代销；高级形式——公私合营（个别行业和全行业）★。即步骤为：初级形式的国家资本主义→个别企业的公私合营→全行业的公私合营","paperTitle":"题海2","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"在社会主义改造时期，对资本主义工商业的社会主义改造经历的步骤是（ ）"}],"subjs":[{"id":"c59f421e07","num":1,"type":"辨析","supp":false,"stem":"马克思主义中国化就是把马克思主义和中国文化结合起来。","options":[],"answer":null,"src":"","exp":"","warn":"原卷未见答案标注（原卷第 3 页仅给出辨析题答题思路：错误类——否定观点＋指出错误＋纠正正确；本题即按\"错误类\"思路讲评。同一题目在《题海1》原卷中附有参考答案：该观点错误，参见笔记《题海01》辨析题第 1 题）"},{"id":"dd3f1615cc","num":2,"type":"辨析","supp":false,"stem":"马克思主义中国化，就是将马克思主义基本原理同中国具体实际相结合。","options":[],"answer":null,"src":"","exp":"","warn":"原卷未见答案标注（原卷第 3 页仅给出辨析题答题思路：正确类——肯定观点＋阐释依据；本题即按\"正确类\"思路讲评。同一题目在《题海1》原卷中附有参考答案：该观点正确，参见笔记《题海01》辨析题第 2 题）"},{"id":"86671c4081","num":11,"type":"辨析","supp":false,"stem":"新民主主义革命是无产阶级领导的，因而是无产阶级革命。","options":[],"answer":"该观点错误。","src":"原卷第 31 页附参考答案","exp":"新民主主义革命的领导力量是无产阶级，其实质上是无产阶级领导下的农民革命，但就其性质而言，新民主主义革命仍属于资产阶级民主主义革命的范畴。\n（1）无产阶级的领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题。区别新旧两种不同范畴的民主主义革命的根本标志是，革命的领导权是掌握在无产阶级手中还是掌握在资产阶级手中。\n（2）近代中国半殖民地半封建社会的性质和中国革命的历史任务，决定了中国革命的性质不是无产阶级社会主义革命，而是资产阶级民主主义革命。\n（3）新民主主义革命与旧民主主义革命相比有新的内容和特点，集中表现在中国革命处于世界无产阶级社会主义革命的时代，是世界无产阶级社会主义革命的一部分；革命的领导力量是中国无产阶级及其先锋队——中国共产党；革命的指导思想是马克思列宁主义；革命的前途是社会主义而不是资本主义。\n（4）新民主主义革命与社会主义革命是互相联系、紧密衔接的，中间不容横插一个资产阶级专政。","warn":""},{"id":"525246cd0a","num":2,"type":"简答","supp":false,"stem":"简述毛泽东思想的历史地位。","options":[],"answer":"（见下方解析）","src":"原卷第 11 页附参考答案","exp":"（1）毛泽东思想是马克思主义中国化的第一个重大理论成果。毛泽东是马克思主义中国化的伟大开拓者，是毛泽东思想的主要创立者。在中国共产党历史上，毛泽东第一个明确提出了\"马克思主义中国化\"的科学命题和重大任务，深刻论证了马克思主义中国化的必要性和极端重要性，系统阐述了马克思主义中国化的科学内涵和实现马克思主义中国化的正确途径，开辟了马克思主义在中国发展的宽广道路，为党领导的革命和建设事业的发展奠定了坚实的思想理论基础。\n（2）毛泽东思想是中国革命和建设的科学指南。毛泽东思想是被实践证明了的关于中国革命和建设的正确的理论原则和经验总结。\n（3）毛泽东思想是中国共产党和中国人民宝贵的精神财富。毛泽东追求和倡导的中华民族重新自立于世界民族之林的远大理想，实事求是的思想路线，全心全意为人民服务的奋斗宗旨，自力更生、艰苦奋斗的革命精神，等等，依然是中国人民不断奋进的强大精神动力，将长期激励和指导我们前进。\n（原卷批注·记忆口诀：第一个财富指南）\n（原卷批注·评价地位类答题思路/模板总结：理论层面——它是什么？（马克思主义中国化的开创性成果/第一次历史性飞跃）；实践层面——它有什么用？（中国革命和建设的科学指南/被实践证明的正确原则）；当代层面——它现在还有什么价值？（党和国家的指导思想基础/精神财富）；个人层面（如适用）——与创立者的关系？（集体智慧的结晶，某某同志的伟大贡献））","warn":""},{"id":"785faa5c2c","num":5,"type":"简答","supp":false,"stem":"简述新民主主义总路线及其基本纲领的主要内容。","options":[],"answer":"（见下方解析）","src":"原卷第 38 页附参考答案","exp":"1948 年，毛泽东在晋绥干部会议上的讲话中将新民主主义革命总路线概括为：无产阶级领导的，人民大众的，反对帝国主义、封建主义和官僚资本主义的革命。\n（1）新民主主义的政治纲领是：推翻帝国主义和封建主义的统治，建立一个无产阶级领导、以工农联盟为基础的、各革命阶级联合专政的新民主主义的共和国。\n（2）新民主主义的经济纲领是：没收封建地主阶级的土地归农民所有，没收官僚资产阶级的垄断资本归新民主主义的国家所有，保护民族工商业。\n（3）新民主主义的文化纲领：无产阶级领导的人民大众的反帝反封建的文化，即民族的科学的大众的文化。\n（原卷批注·总路线概括注：谁来领导？无产阶级——革命的领导；领导谁？人民大众——革命的动力；去打谁？帝封资——革命的对象）","warn":""},{"id":"c0bd832f96","num":8,"type":"简答","supp":false,"stem":"简述社会主义改造的历史经验。","options":[],"answer":"（见下方解析）","src":"原卷第 57 页附参考答案","exp":"一是坚持社会主义工业化建设与社会主义改造同时并举。\n二是采取积极引导、逐步过渡的方式。\n三是用和平的方法进行改造。\n（原卷第 56 页另附填空背诵版：一是坚持【　】与【　】同时并举；二是采取积极【　】、逐步【　】的方式；三是用【　】的方法进行改造）\n（原卷批注·记忆口诀：\"和平引导，并举过渡\"）","warn":""},{"id":"caf31aa958","num":9,"type":"简答","supp":false,"stem":"我国确立社会主义基本制度的重大意义是什么？","options":[],"answer":"（见下方解析）","src":"原卷第 59 页附参考答案","exp":"（1）极大地提高了工人阶级和广大劳动人民的积极性和创造性，极大地促进了我国社会生产力的发展，使广大劳动人民真正成为国家的主人。\n（2）使占世界人口四分之一的东方大国进入了社会主义，是世界社会主义发展史上又一个历史性的伟大胜利，再次证明了马克思主义的真理性，而且有自己的独创，丰富和发展了马克思主义。\n（原卷批注·意义类答题思路/模板总结：对事件本身/直接影响——完成了什么，改变了什么，结束了什么；对国家和民族——对国家前途、民族命运、社会发展产生了怎样的深远影响；对人民——给人民生活、阶级关系、社会地位带来了什么根本性变化；对世界和理论贡献——在国际上和思想理论层面有什么独特贡献或启示）","warn":""}],"keyed":34,"doubts":0},{"id":"题海03","name":"题海3","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海03","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"ce4f9294eb","lessonId":"题海03","kind":"choice","question":"新民主主义的政体是（ ）","options":[{"value":"A","text":"各革命阶级的联合专政"},{"value":"B","text":"多党合作的政治协商制度"},{"value":"C","text":"民主集中制的人民代表大会制度"},{"value":"D","text":"无产阶级专政"}],"answer":[],"explanation":"","chapter":"题海3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海3","course":"题海（混合）"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"新民主主义的政体是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"3d0af5ffa9","lessonId":"题海03","kind":"choice","question":"包含着新民主主义革命和社会主义革命双重性质的经济政策是（ ）","options":[{"value":"A","text":"没收封建地主阶级的土地"},{"value":"B","text":"保护民族工商业"},{"value":"C","text":"没收官僚垄断资本"},{"value":"D","text":"没收民族资本"}],"answer":[],"explanation":"","chapter":"题海3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海3","course":"题海（混合）"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"包含着新民主主义革命和社会主义革命双重性质的经济政策是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"ccaf84d3cf","lessonId":"题海03","kind":"choice","question":"秋收起义失败后毛泽东创建的（ ）革命根据地，把武装斗争的主攻方向首先指向农村","options":[{"value":"A","text":"井冈山"},{"value":"B","text":"中央"},{"value":"C","text":"湘鄂西"},{"value":"D","text":"百色"}],"answer":[],"explanation":"","chapter":"题海3","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海3","course":"题海（混合）" ,{"id":"188f9909c7","num":14,"type":"简答","supp":false,"stem":"简述如何认识党对社会主义建设道路初步探索的重大意义。","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"党领导人民进行社会主义建设道路的探索，虽然历经艰辛和曲折，但是在实践上取得了巨大的成就，在理论上取得了一系列重要成果，这对于巩固和发展社会主义制度、开创中国特色社会主义，对于促进世界社会主义事业的发展，具有极其重要的意义。\n（1）巩固和发展了我国的社会主义制度；\n（2）为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础；\n（3）丰富了科学社会主义的理论和实践。\n关键词记忆：巩固制度、开创基础、丰富理论（原卷附）。","warn":""},{"id":"77dff2393d","num":15,"type":"简答","supp":false,"stem":"党对社会主义建设道路的初步探索有哪些经验教训？","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"第一，必须把马克思主义与中国实际相结合，探索符合中国特点的社会主义建设道路。\n第二，必须正确认识社会主义社会的主要矛盾和根本任务，集中力量发展生产力。\n第三，必须从实际出发进行社会主义建设，建设规模和速度要和国力相适应，不能急于求成。\n第四，必须发展社会主义民主，健全社会主义法制。\n第五，必须坚持党的民主集中制和集体领导制度，加强执政党建设。\n第六，必须坚持对外开放，借鉴和吸收人类文明成果建设社会主义，不能关起门来搞建设。","warn":""}],"keyed":1,"doubts":0},{"id":"题海05","name":"题海5","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海05","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"a29a69a51a","lessonId":"题海05","kind":"choice","question":"习近平新时代中国特色社会主义思想是\"两个结合\"的重要成果，其中\"第二个结合\"指的是（ ）","options":[{"value":"A","text":"马克思主义基本原理同中国具体实际相结合"},{"value":"B","text":"马克思主义基本原理同中华优秀传统文化相结合"},{"value":"C","text":"马克思主义基本原理同中国综合国力相结合"},{"value":"D","text":"马克思主义基本原理同中华传统文化相结合"}],"answer":["B"],"explanation":"","chapter":"题海5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海5","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"习近平新时代中国特色社会主义思想是\"两个结合\"的重要成果，其中\"第二个结合\"指的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"178795bf68","lessonId":"题海05","kind":"choice","question":"（ ）是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝。","options":[{"value":"A","text":"\"两个结合\""},{"value":"B","text":"\"四项原则\""},{"value":"C","text":"\"一个中心，两个基本点\""},{"value":"D","text":"\"四个伟大\""}],"answer":["A"],"explanation":"📝 讲义注（原卷附）：特别要注意理解马克思主义（魂脉）与中华优秀传统文化（根脉）之间的关系。（1）坚守好魂（马克思主义）和根（中华优秀传统文化），是理论创新的基础和前提。（2）中华优秀传统文化是中华文明的智慧结晶和精华所在，是中华民族的根和魂，是我们在世界文化激荡中站稳脚跟的根基，是我们党创新理论的\"根\"。","chapter":"题海5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海5","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"（ ）是我们党在探索中国特色社会主义道路中得出的规律性认识，是我们取得成功的最大法宝。"},{"schemaVersion":1,"contentVersion":1,"id":"1fd4b6d8c4","lessonId":"题海05","kind":"choice","question":"以下说法不正确的是（ ）","options":[{"value":"A","text":"党的十九大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想"},{"value":"B","text":"党的二十大把习近平新时代中国特色社会主义思想确立为党必须长期坚持的指导思想"},{"value":"C","text":"习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义"},{"value":"D","text":"习近平新时代中国特色社会主义思想继承和发展马克思列宁主义、毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观"}],"answer":["B"],"explanation":"","chapter":"题海5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海5","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"以下说法不正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"79acb6bce8","lessonId":"题海05","kind":"choice","question":"（ ）是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素，是党和人民应对一切不确定性的最大确定性、最大底气、最大保证。","options":[{"value":"A","text":"\"四个全面\"战略布局"},{"value":"B","text":"\"五位一体\"总体布局"},{"value":"C","text":"\"两个确立\""},{"value":"D","text":"\"十三个方面成就\""}],"answer":["C"],"explanation":"","chapter":"题海5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海5","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"（ ）是新时代党和国家事业取得历史性成就、发生历史性变革的决定性因素，是党和人民应对一切不确定性的最大确定性、最大底气、最大保证。"},{"schemaVersion":1,"contentVersion":1,"id":"5f4799661d","lessonId":"题海05","kind":"choice","question":"（ ）是党和人民历经千辛万苦、付出巨大代价取得的根本成就，是实现中华民族伟大复兴的必由之路。","options":[{"value":"A","text":"中国特色社会主义"},{"value":"B","text":"\"五位一体\"总体布局"},{"value":"C","text":"\"两个确立\""},{"value":"D","text":"\"十三个方面成就\""}],"answer":["A"],"explanation":"","chapter":"题海5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperT ,"grp":"题库","legacyQuestion":"中国特色社会主义是实现中华民族伟大复兴的必由之路，要更加自觉地坚定中国特色社会主义（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"7815250541","lessonId":"题海05","kind":"choice","question":"党的十八大以来，党和国家事业发展站上了新的历史起点，处于新的历史方位，（ ）是我们党面临的重大课题。","options":[{"value":"A","text":"如何把握当今世界和当代中国的发展大势"},{"value":"B","text":"如何应对外部环境变化带来的风险挑战"},{"value":"C","text":"如何破解国内改革发展稳定面临的新矛盾新问题"},{"value":"D","text":"更好地坚持和发展中国特色社会主义"}],"answer":["A","B","C","D"],"explanation":"","chapter":"题海5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海5","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"党的十八大以来，党和国家事业发展站上了新的历史起点，处于新的历史方位，（ ）是我们党面临的重大课题。"},{"schemaVersion":1,"contentVersion":1,"id":"e8e0f2af94","lessonId":"题海05","kind":"choice","question":"改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是（ ）","options":[{"value":"A","text":"开辟了中国特色社会主义道路"},{"value":"B","text":"形成了中国特色社会主义理论体系"},{"value":"C","text":"确立了中国特色社会主义制度"},{"value":"D","text":"发展了中国特色社会主义文化"}],"answer":["A","B","C","D"],"explanation":"","chapter":"题海5","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海5","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是（ ）"}],"subjs":[{"id":"be96a96c36","num":28,"type":"简答","supp":false,"stem":"简述习近平新时代中国特色社会主义思想创立的时代背景。","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"（1）世界百年未有之大变局加速演进；\n（2）中华民族伟大复兴进入关键时期；\n（3）中国式现代化全面推进拓展；\n（4）科学社会主义在 21 世纪的中国焕发新的蓬勃生机；\n（5）中国共产党自我革命开辟新的境界。\n精简关键词记忆：世变复兴，现化社义，党自革命（原卷附）。","warn":""},{"id":"529cc757de","num":4,"type":"简答","supp":false,"stem":"简述中国特色社会主义进入新时代的内涵。","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"（1）中国特色社会主义新时代，是承前启后、继往开来、在新的历史条件下继续夺取中国特色社会主义伟大胜利的时代；\n（2）是决胜全面建成小康社会、进而全面建设社会主义现代化强国的时代；\n（3）是全国各族人民团结奋斗、不断创造美好生活、逐步实现全体人民共同富裕的时代；\n（4）是全体中华儿女勠力同心、奋力实现中华民族伟大复兴中国梦的时代；\n（5）是我国不断为人类作出更大贡献的时代。\n精简关键词记忆：历史、实践、人民、民族、世界（原卷附）。","warn":""},{"id":"5edd12abe6","num":3,"type":"论述","supp":false,"stem":"论述习近平新时代中国特色社会主义思想的历史地位。","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"习近平新时代中国特色社会主义思想是当代中国马克思主义、二十一世纪马克思主义，是中华文化和中国精神的时代精华，实现了马克思主义中国化时代化新的飞跃。\n（1）习近平新时代中国特色社会主义思想继承和发展马克思列宁主义、毛泽东思想、邓小平理论、\"三个代表\"重要思想、科学发展观，是马克思主义在当代中国发展的最新理论成果，开辟了马克思主义中国化时代化新境界。\n（2）习近平新时代中国特色社会主义思想，把马克思主义基本原理同中国具体实际相结合、同中华优秀传统文化相结合，使马克思主义这个魂脉和中华优秀传统文化这个根脉内在贯通、相互成就，是中华民族的文化主体性最有力的体现，是中华文化和中国精神的时代精华。\n（3）习近平新时代中国特色社会主义思想，是全党全国各族人民为实现中华民族伟大复兴而奋斗的行动指南，是新时代党和国家事业发展的根本遵循。这一思想指导我们党团结带领全国各族人民，统揽伟大斗争、伟大工程、伟大事业、伟大梦想（四个伟大），开创了中国特色社会主义新时代。\n精简关键词记忆：21世纪马克思主义、新飞跃、最新理论成果、时代精华、开创新时代（原卷附）。","warn":""}],"keyed":30,"doubts":0},{"id":"题海06","name":"题海6","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海06","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"230e8979ac","lessonId":"题海06","kind":"choice","question":"（改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是：开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化。其中，实现途径是）","options":[{"value":"A","text":"中国特色社会主义道路"},{"value":"B","text":"中国特色社会主义理论体系"},{"value":"C","text":"中国特色社会主义制度"},{"value":"D","text":"中国特色社会主义文化"}],"answer":["A"],"explanation":"","chapter":"题海6","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"小试牛刀·P42","paperTitle":"题海6","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"（改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是：开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化。其中，实现途径是）"},{"schemaVersion":1,"contentVersion":1,"id":"a9ad8ad503","lessonId":"题海06","kind":"choice","question":"（改革开放以来我们取得一切成绩和进步的根本原因，归结起来就是：开辟了中国特色社会主义道路，形成了中国特色社会主义理论体系，确立了中国特色社会主义制度，发展了中国特色社会主义文化。其中，根本保障是）","options":[{"value":"A","text":"中国特色社会主义道路"},{"value":"B","text":"中国特色社会主义理论体系"},{"value":"C","text":"中国特色社会主义制度"},{"value":"D","text":"中国特色社会主义文化"}],"answer":["C"],"explanation":"","chapter":"题海6","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"小试牛刀·P42","paperTitle":"题海6","course": ssonId":"题海07","kind":"choice","question":"全面深化改革开放，改什么、怎么改，其根本标准是（ ）","options":[{"value":"A","text":"是否有利于坚持和改善党的全面领导"},{"value":"B","text":"是否有利于坚持和完善中国特色社会主义制度"},{"value":"C","text":"是否有利于维护世界和平、促进共同发展"},{"value":"D","text":"是否有利于维护和谐社会的构建"}],"answer":["A","B"],"explanation":"","chapter":"题海7","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海7","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"全面深化改革开放，改什么、怎么改，其根本标准是（ ）"}],"subjs":[{"id":"06e642f8f5","num":15,"type":"辨析","supp":false,"stem":"人民立场是中国共产党的根本政治立场。","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"（1）人民性是马克思主义的本质属性和鲜明品格。人民是创造历史的真正动力，是历史发展和社会进步的主体力量。坚持以人民为中心，体现了历史唯物主义基本原理，是我们党总结历史经验、把握历史规律得出的重要结论。坚持以人民为中心，是新时代坚持和发展中国特色社会主义的根本立场，是贯穿党治国理政全部活动的一条红线。必须坚持人民至上，站稳人民立场、把握人民愿望、尊重人民创造、集中人民智慧，不断实现人民对美好生活的向往，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。\n（2）政治立场是一个政党观察、认识、处理政治问题的立足点，反映了这个政党的世界观、方法论和执政理念，体现了这个政党的根本属性。人民立场是中国共产党的根本政治立场，是我们党区别于其他政党的显著标志。坚持这一根本立场，就要坚持以人民为中心的执政理念，将其贯穿于党和国家事业发展各方面。","warn":""},{"id":"9827c87d70","num":8,"type":"论述","supp":false,"stem":"如何全面落实以人民为中心的发展思想？","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"（1）坚持和贯彻党的群众路线。习近平指出：\"群众路线是我们党的生命线和根本工作路线，是我们党永葆青春活力和战斗力的重要传家宝。\"我们要坚持一切为了群众、一切依靠群众，从群众中来到群众中去，把党的正确主张变为群众的自觉行动，把群众路线贯彻到治国理政全部活动之中。群众路线是我们党始终坚持的根本工作方法。调查研究是获得真知灼见的源头活水，是贯彻群众路线的有效途径。\n（2）把为人民造福的事情真正办好办实。① 为人民造福，要落实到新时代中国特色社会主义的各项事业、全部工作之中。② 为人民造福，要着力解决好人民群众最关心最直接最现实的利益问题。③ 为人民造福，要一件事情接着一件事情办，一年接着一年干。\n（3）推动全体人民共同富裕取得更为明显的实质性进展。① 共同富裕是中国特色社会主义的本质要求，是中国式现代化的重要特征。② 实现共同富裕不仅是经济问题，而且是关系党的执政基础的重大政治问题。③ 推动全体人民共同富裕与促进人的全面发展是高度统一的。","warn":""},{"id":"6f24dea3f7","num":34,"type":"简答","supp":false,"stem":"如何坚持全面深化改革开放的正确方向？","options":[],"answer":"（见下方解析）","src":"原卷附【参考答案】","exp":"（1）必须坚持和改善党的全面领导、坚持和完善中国特色社会主义制度。\n（2）必须坚持以人民为中心，促进社会公平正义、增进人民福祉。\n（3）必须有利于进一步解放思想、进一步解放和发展社会生产力、进一步解放和增强社会活力。（三个进一步解放）","warn":""}],"keyed":29,"doubts":0},{"id":"题海08","name":"题海8","zone":"题海（混合）","group":"题海","subject": urse":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"新发展阶段是我国社会主义初级阶段历史进程中的一个重要阶段，下列关于新发展阶段说法正确的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"30ad692925","lessonId":"题海08","kind":"choice","question":"坚持和完善社会主义基本经济制度，必须坚持\"两个毫不动摇\"。\"两个毫不动摇\"包括（ ）","options":[{"value":"A","text":"毫不动摇地坚持党在社会主义初级阶段的基本路线"},{"value":"B","text":"毫不动摇巩固和发展公有制经济"},{"value":"C","text":"毫不动摇鼓励、支持、引导非公有制经济发展"},{"value":"D","text":"毫不动摇坚持和巩固党的领导和长期执政地位"}],"answer":["B","C"],"explanation":"","chapter":"题海8","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海8","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"坚持和完善社会主义基本经济制度，必须坚持\"两个毫不动摇\"。\"两个毫不动摇\"包括（ ）"}],"subjs":[{"id":"2eaf77387d","num":35,"type":"简答","supp":false,"stem":"简述如何构建高水平社会主义市场经济体制？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）构建高水平社会主义市场经济体制，关键是要处理好政府和市场的关系。\n（2）加快建设高标准市场体系。\n（3）推进宏观经济治理体系和治理能力现代化。\n（4）依法规范和引导资本健康发展。","warn":""},{"id":"4322d00da2","num":1,"type":"论述","supp":false,"stem":"论述新发展理念的科学内涵及实践要求。 （原卷未编号，题库 P112 页）","options":[],"answer":"（见下方解析）","src":"","exp":"（1）创新是引领发展的第一动力，创新发展注重的是解决发展动力问题，必须坚持创新在我国现代化建设全局中的核心地位，让创新贯穿党和国家一切工作，全面提升创新能力和效率，把创新发展主动权牢牢掌握在自己手中。\n（2）协调是持续健康发展的内在要求，协调发展注重的是解决发展不平衡问题，必须正确处理局部和全局、当前和长远、重点和非重点的关系，在发展中促进相对平衡，不断增强发展的整体性。\n（3）绿色是永续发展的必要条件和人民对美好生活追求的重要体现，绿色发展注重的是解决人与自然和谐共生问题，必须实现经济社会发展和生态环境保护协同共进，加快发展方式绿色转型，推动形成绿色低碳的生产方式和生活方式。\n（4）开放是国家繁荣发展的必由之路，开放发展注重的是解决发展内外联动问题，必须推动形成更大范围、更宽领域、更深层次对外开放格局，不断增强我国国际经济合作和竞争新优势。\n（5）共享是中国特色社会主义的本质要求，共享发展注重的是解决社会公平正义问题，必须坚持全民共享、全面共享、共建共享、渐进共享，不断推进全体人民共同富裕。","warn":""}],"keyed":23,"doubts":0},{"id":"题海09","name":"题海9","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海09","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"fd1a280d81","lessonId":"题海09","kind":"choice","question":"（ ）是实施乡村振兴战略的总目标","options":[{"value":"A","text":"坚持农业农村优先发展"},{"value":"B","text":"农业农村现代化"},{"value":"C","text":"产业兴旺、生态宜居、乡风文明、治理有效、生活富裕"},{"v "074174920d","num":38,"type":"简答","supp":false,"stem":"简述坚持和拓展中国特色社会主义法治道路必须坚持的原则。 （题库 P107 页）","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持中国共产党的领导。党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。\n（2）坚持以人民为中心。全面依法治国最广泛、最深厚的基础是人民。推进全面依法治国，根本目的是依法保障人民权益。\n（3）坚持法律面前人人平等。平等是社会主义法律的基本属性。\n（4）坚持依法治国和以德治国相结合。\n（5）坚持从中国实际出发。","warn":""},{"id":"d65eb6be01","num":41,"type":"简答","supp":false,"stem":"如何更好推进中国特色社会主义法治体系建设？ （题库 P108 页）","options":[],"answer":"（见下方解析）","src":"","exp":"（1）加快形成完备的法律规范体系。\n（2）加快形成高效的法治实施体系。\n（3）加快形成严密的法治监督体系。法治监督体系以规范和约束公权力的运行为重点。\n（4）加快形成有力的法治保障体系。\n（5）加快形成完善的党内法规体系。","warn":""},{"id":"d4db09b4a4","num":40,"type":"简答","supp":false,"stem":"简述如何坚持中国特色社会主义文化发展道路？ （题库 P108 页）","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持举旗帜、聚民心、育新人、兴文化、展形象。\n（2）坚持\"二为\"方向、\"双百\"方针。坚持为人民服务、为社会主义服务的根本方向，是决定社会主义文化事业前途命运的关键。坚持百花齐放、百家争鸣，是繁荣发展社会主义文化的重要方针。\n（3）激发全民族文化创新创造活力。","warn":""}],"keyed":36,"doubts":0},{"id":"题海11","name":"题海11","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海11","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"b38f6f3811","lessonId":"题海11","kind":"choice","question":"习近平指出，我们党的根本执政理念是（ ） （题库 P57 页）","options":[{"value":"A","text":"以人民为中心"},{"value":"B","text":"立党为公、执政为民"},{"value":"C","text":"全心全意为人民服务"},{"value":"D","text":"人民当家作主"}],"answer":["A"],"explanation":"📝 讲义注（原卷附）：执政理念是指建立在对执政规律认识基础上的党的执政宗旨和指导思想。","chapter":"题海11","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海11","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"习近平指出，我们党的根本执政理念是（ ） （题库 P57 页）"},{"schemaVersion":1,"contentVersion":1,"id":"f82f61d354","lessonId":"题海11","kind":"choice","question":"社会主义生产的根本目的，坚持立党为公、执政为民的本质要求是（ ） （题库 P57 页）","options":[{"value":"A","text":"推进生产力快速发展"},{"value":"B","text":"赢得与资本主义比较优势"},{"value":"C","text":"促进科技进步"},{"value":"D","text":"增进民生福祉"}],"answer":["D"],"explanation":"","chapter":"题海11","knowledgePoint":"","source":{"path":" e.html","label":"","paperTitle":"题海12","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"在新民主主义社会中，主要的经济成分有哪几种（ ） （卷首遗留题，题海 2 的问题订正）"},{"schemaVersion":1,"contentVersion":1,"id":"77ba40e10b","lessonId":"题海12","kind":"choice","question":"维护国家政治安全，包括（ ）","options":[{"value":"A","text":"维护政权安全"},{"value":"B","text":"维护制度安全"},{"value":"C","text":"维护意识形态安全"},{"value":"D","text":"维护主权安全"}],"answer":["A","B","C","D"],"explanation":"📝 讲义注（原卷附）：维护政权安全，就是要毫不动摇坚持和巩固党的领导和长期执政地位；维护制度安全，就是要毫不动摇坚持和完善中国特色社会主义制度；维护意识形态安全，就是要毫不动摇坚持和巩固马克思主义在意识形态领域的指导地位，不断巩固全党全国人民团结奋斗的共同思想基础。","chapter":"题海12","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"原卷注明：题海 189 答案改为 ABCD","paperTitle":"题海12","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"维护国家政治安全，包括（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"835f53f607","lessonId":"题海12","kind":"choice","question":"维护政治安全，要（ ）。","options":[{"value":"A","text":"维护政权安全"},{"value":"B","text":"维护制度安全"},{"value":"C","text":"维护意识形态安全"},{"value":"D","text":"维护中国共产党执政安全"}],"answer":["A","B","C","D"],"explanation":"","chapter":"题海12","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海12","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"维护政治安全，要（ ）。"},{"schemaVersion":1,"contentVersion":1,"id":"6b136b925f","lessonId":"题海12","kind":"choice","question":"发展和安全是两件大事，下列关于发展和安全的关系的说法，正确的是（ ）","options":[{"value":"A","text":"发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑"},{"value":"B","text":"安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石"},{"value":"C","text":"发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全"},{"value":"D","text":"发展是安全的条件和保障"}],"answer":["A","B","C"],"explanation":"","chapter":"题海12","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"D 项应为\"安全是发展的条件和保障\"","paperTitle":"题海12","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"发展和安全是两件大事，下列关于发展和安全的关系的说法，正确的是（ ）"}],"subjs":[{"id":"335923c2d3","num":45,"type":"简答","supp":false,"stem":"为什么要统筹发展和安全？","options":[],"answer":"统筹发展和安全，是党和国家的一项基础性工作，是我们党治国理政的一个重大原则。","src":"","exp":"（1）发展和安全是两件大事。\n发展解决的是动力问题，是推动国家和民族赓续绵延的根本支撑；安全解决的是保障问题，是确保国家和民族行稳致远的坚强柱石。\n发展具有基础性、根本性，是解决安全问题的总钥匙，发展就是最大的安全。安全是发展的条件和保障，没有国家安全，发展只能是\"镜花水月\"，取得的成果也可能毁于一旦。发展和安全是一体之两翼、驱动之双轮，必须同步推进。\n（2）以新安全格局保障新发展格局。牢牢守住安全发展这条底线是构建新发展格局的重要前提和保障。","warn":""}],"keyed":42,"doubts":0},{"id":"题海13","name":"题海13","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海13","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"070f115f1b","lessonId":"题海13","kind":"choice","question":"回答了\"新时代建设一支什么样的强大人民军队、怎样建设强大人民军队\"的是（ ）","options":[{"value":"A","text":"习近平法治思想"},{"value":"B","text":"习近平经济思想"},{"value":"C","text":"习近平文化思想"},{"value":"D","text":"习近平强军思想"}],"answer":["D"],"explanation":"","chapter":"题海13","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海13","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"回答了\"新时代建设一支什么样的强大人民军队、怎样建设强大人民军队\"的是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"2e93585044","lessonId":"题海13","kind":"choice","question":"党的十八大以来，以习近平同志为核心的党中央深刻把握强国对强军的战略需求，围绕新时代建设一支什么样的强大人民军队、怎样建设强大人民军队，深入进行理论探索和实践创造，形成习近平强军思想并不断丰富和发展。习近平强军思想明确军民融合发展是（ ）","options":[{"value":"A","text":"建军之本、强军之魂"},{"value":"B","text":"党建军治军基本方式"},{"value":"C","text":"我军鲜明特色和政治优势"},{"value":"D","text":"兴国之举、强军之策"}],"answer":["D"],"explanation":"","chapter":"题海13","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海13","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"党的十八大以来，以习近平同志为核心的党中央深刻把握强国对强军的战略需求，围绕新时代建设一支什么样的强大人民军队、怎样建设强大人民军队，深入进行理论探索和实践创造，形成习近平强军思想并不断丰富和发展。习近平强军思想明确军民融合发展是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"98520cd0b4","lessonId":"题海13","kind":"choice","question":"习近 -politics/lessons/practice.html","label":"","paperTitle":"题海13","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"推动构建新型国际关系，必须坚持的周边外交理念和方针是（ ）"}],"subjs":[{"id":"009b0182bd","num":12,"type":"简答","supp":false,"stem":"论述党在新时代的强军目标的科学内涵。","options":[],"answer":"（见下方解析）","src":"","exp":"习近平指出，建设强大军队是接续奋斗的伟大事业。党的十九大明确提出，党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。\n（1）听党指挥是灵魂，决定军队建设的政治方向。坚持党对人民军队的绝对领导是人民军队永远不变的军魂。听党指挥是人民军队建设的首要，是人民军队的命脉所在。\n（2）能打胜仗是核心，反映军队的根本职能和军队建设的根本指向。人民军队必须牢固树立战斗力这个唯一的根本的标准。\n（3）作风优良是保证，关系军队的性质、宗旨、本色。在长期实践中，人民军队形成了一整套光荣传统和优良作风，这是人民军队的鲜明特色和政治优势，也是人民军队战无不胜、攻无不克的重要保证。\n（4）听党指挥、能打胜仗、作风优良，三者相互联系、密不可分，抓住了建设强大人民军队最根本、最紧要、最现实的问题，明确了加强军队建设的聚焦点和着力点，体现了坚持党的建军原则、人民军队根本职能、特有政治优势的高度统一。\n📝 讲义标注：小试牛刀-简答，教材 P158 页。","warn":""},{"id":"2aa5cc0e41","num":13,"type":"简答","supp":false,"stem":"如何加快推进国防和军队现代化？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持党对人民军队的绝对领导。坚持党对人民军队的绝对领导，是马克思主义建党建军的一条基本原则。①党对人民军队的绝对领导，是建军之本、强军之魂。②党的绝对领导，使我们党的政治优势转化成了军事上的胜势。新的时代条件下，坚定不移听党话、跟党走，是人民军队战胜一切强敌、克服一切困难、抵住一切诱惑，永葆人民军队性质、宗旨、本色的根本保证。\n（2）坚持政治建军、改革强军、科技强军、人才强军、依法治军。①政治建军是人民军队的立军之本。②改革是决定人民军队发展壮大、制胜未来的关键一招。③科技是核心战斗力，是军事发展中最活跃、最具革命性的因素。④强军之道，要在得人。人才是推动人民军队高质量发展、赢得军事竞争和未来战争主动的关键因素。⑤依法治军是我们党建军治军基本方式。\n（3）全面加强练兵备战。①牢固树立战斗力这个唯一的根本的标准。②深入推进实战化军事训练。③创新军事战略指导。④大力培育\"一不怕苦、二不怕死\"的战斗精神。\n（4）巩固提高一体化国家战略体系和能力。关键是要在一体化上下功夫，实现国家战略能力最大化。军政军民团结是实现富国和强军相统一的重要政治保障。\n📝 讲义标注：小试牛刀-简答，教材 P113 页。","warn":""}],"keyed":45,"doubts":0},{"id":"题海14","name":"题海14","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海14","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"a9fe5f8cc0","lessonId":"题海14","kind":"choice","question":"中国特色大国外交的宗旨是（ ）","options":[{"value":"A","text":"坚持主持公道，努力伸张正义"},{"value":"B","text":"富有中国特色，引领人类发展"},{"value":"C","text":"弘扬中国精神，凝聚中国力量"},{"value":"D","text":"维护世界和平，促进共同发展"}],"answer":["D"],"explanation":"","chapter":"题海14","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"题海14","cou 设的统领性作用，必须（ ）"}],"subjs":[{"id":"a248b24e04","num":19,"type":"论述","supp":false,"stem":"如何理解以伟大自我革命引领伟大社会革命？","options":[],"answer":"（见下方解析）","src":"课件附答案，全文转录","exp":"（1）中国共产党的不懈奋斗史，就是一部伟大自我革命和伟大社会革命相互促进的历史。伟大社会革命锻造和成就伟大的党，伟大自我革命保障和推动伟大的事业，这是党 100 多年来把握历史发展规律、不断从胜利走向新的胜利的宝贵经验。\n（2）以伟大自我革命引领伟大社会革命是新时代中国特色社会主义发展的显著特点。新时代坚持和发展中国特色社会主义，是一场艰巨而伟大的社会革命，这就要求我们党以更清醒的自觉、更坚定的决心、更高的标准进行伟大自我革命。\n（3）党的伟大事业是一代一代接续推进的，党的自我革命永远在路上。新时代中国特色社会主义是我们党领导人民进行伟大社会革命的成果。我们要站在中国特色社会主义事业长远发展、党长期执政的高度，把全面从严治党作为长期战略、永恒课题，把党的伟大自我革命进行到底，以彻底的自我革命把中国特色社会主义伟大事业不断推向前进。\n课件\"主观题评分逻辑\"提示：踩点给分，逻辑加分。① 踩点分：答案须包含教材/真题参考答案的核心关键词（如\"自我革命\"\"社会革命\"\"相互促进\"\"全面从严治党\"等），这是得分基础；② 逻辑分：要点之间有层次（如\"是什么—为什么—怎么做\"\"历史—现实—未来\"），不是杂乱堆砌，这是提分关键；③ 表达分：用官方规范表述（如\"宝贵经验\"\"显著特点\"\"长期战略、永恒课题\"），避免口语化，意思对、关键词全即可。","warn":""}],"keyed":29,"doubts":0},{"id":"题海课-692284675ba02","name":"题海课（692284675ba02）","zone":"题海（混合）","group":"题海","subject":"题海（混合）","note":"题海课-692284675ba02","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"b61051e993","lessonId":"题海课-692284675ba02","kind":"choice","question":"走中国工业化道路的关键问题是（ ）","options":[{"value":"A","text":"正确处理重工业和轻工业、农业的关系"},{"value":"B","text":"正确处理人民内部的矛盾"},{"value":"C","text":"正确处理两类不同性质的矛盾"},{"value":"D","text":"调动一切积极因素为社会主义建设服务"}],"answer":["A"],"explanation":"","chapter":"题海课（692284675ba02）","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"图核对：P9 页 A 标红","paperTitle":"题海课（692284675ba02）","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"走中国工业化道路的关键问题是（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"77e6c5da6c","lessonId":"题海课-692284675ba02","kind":"choice","question":"我国走工业化道路的根本原因是（ ）","options":[{"value":"A","text":"新中国的工业基础十分薄弱"},{"value":"B","text":"中国民族工业发展已经具有了深厚的基础"},{"value":"C","text":"是中国共产党重视国家工业化的一贯政策"},{"value":"D","text":"实现民族独立和国家富强的内在要求和必要条件"}],"answer":["D"],"explanation":"","chapter":"题海课（692284675ba02）","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practi ce":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"图核对：P66 页 A/B/C/D 全部标红","paperTitle":"题海课（692284675ba02）","course":"题海（混合）"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"科学发展观最鲜明的精神实质是（ ）"}],"subjs":[{"id":"12524af934","num":12,"type":"简答","supp":false,"stem":"简述社会主义建设道路初步探索的重要成果。","options":[],"answer":"原卷附参考答案","src":"P25 页","exp":"社会主义建设道路初步探索时期取得的重要思想成果包括：\n① 调动一切积极因素为社会主义事业服务的思想；\n② 正确认识和处理社会主义社会矛盾的思想；\n③ 走中国工业化道路的思想；\n④ 初步探索的其他理论成果等，如：关于社会主义发展阶段；关于社会主义现代化建设的战略目标和步骤；关于经济建设方针；关于所有制结构的调整；关于经济体制和运行机制改革；关于社会主义民主政治建设；关于教育科学文化工作；关于知识分子工作等方面。","warn":""},{"id":"854c8f31c1","num":14,"type":"简答","supp":false,"stem":"简述如何认识党对社会主义建设道路初步探索的重大意义。","options":[],"answer":"原卷附参考答案","src":"P28 页","exp":"党领导人民进行社会主义建设道路的探索，虽然历经艰辛和曲折，但是在实践上取得了巨大的成就，在理论上取得了一系列重要成果，这对于巩固和发展社会主义制度、开创中国特色社会主义，对于促进世界社会主义事业的发展，具有极其重要的意义。\n（1）巩固和发展了我国的社会主义制度；\n（2）为开创中国特色社会主义提供了宝贵经验、理论准备和物质基础；\n（3）丰富了科学社会主义的理论和实践。\n关键词记忆：巩固制度、开创基础、丰富理论","warn":""},{"id":"758f552172","num":15,"type":"简答","supp":false,"stem":"党对社会主义建设道路的初步探索有哪些经验教训？","options":[],"answer":"原卷附参考答案","src":"P30 页","exp":"第一，必须把马克思主义与中国实际相结合，探索符合中国特点的社会主义建设道路。\n第二，必须正确认识社会主义社会的主要矛盾和根本任务，集中力量发展生产力。\n第三，必须从实际出发进行社会主义建设，建设规模和速度要和国力相适应，不能急于求成。\n第四，必须发展社会主义民主，健全社会主义法制。\n第五，必须坚持党的民主集中制和集体领导制度，加强执政党建设。\n第六，必须坚持对外开放，借鉴和吸收人类文明成果建设社会主义，不能关起门来搞建设。","warn":""},{"id":"8d3b12bcdf","num":10,"type":"论述","supp":false,"stem":"如何把握邓小平理论的主要内容？","options":[],"answer":"原卷附参考答案","src":"P46、P48 页","exp":"邓小平理论贯穿解放思想、实事求是的思想路线，围绕着\"什么是社会主义，怎样建设社会主义\"这个基本的理论问题，第一次比较系统地初步回答了建设中国特色社会主义的一系列基本问题，形成了一个比较完备的科学体系。这个理论内容具体展开主要有：\n（1）解放思想、实事求是的思想路线。\n（2）社会主义初级阶段的理论。这是对当代中国基本国情的科学判断。\n（3）党的基本路线：领导和团结全国各族人民，以经济建设为中心，坚持四项基本原则，坚持改革开放，自力更生，艰苦创业，为把我国建设成为富强、民主、文明的社会主义现代化国家而奋斗。\n（4）社会主义的根本任务是发展生产力。\n（5）\"三步走\"战略。1987 年 4 月，邓小平第一次提出了分\"三步走\"基本实现现代化的战略。\n（6）【改革开放】理论。新时期最鲜明的特点是改革开放。\n（7）【社会主义市场】经济理论。\n（8）\"两手【抓】，两手都要【硬】\"。为我们党的领导方法和工作方法充实了新的内容。\n（9）\"【一国两制】\"。坚持一个中国。在祖国统一的前提下，国家的主体部分实行社会主义制度，同时，在台湾、香港、澳门保持原有的社会制度和生活方式长期不变。\n（10）中国的问题关键在于【党】。加强党的建设，是我们党领导人民取得革命和建设胜利的一个法宝。","warn":""}],"keyed":37,"doubts":0},{"id":"押题卷01","name":"押题卷1","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"押题卷01","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"f3635ff023","lessonId":"押题卷01","kind":"choice","question":"2025 年是\"十五五规划\"的（ ）。","options":[{"value":"A","text":"开局之年"},{"value":"B","text":"谋划之年"},{"value":"C","text":"评估之年"},{"value":"D","text":"收官之年"}],"answer":["B"],"explanation":"","chapter":"押题卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：国家发展改革委明确，2025 年是“十四五”规划收官之年，也是“十五五”规划编制的谋划之年。","paperTitle":"押题卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025 年是\"十五五规划\"的（ ）。"},{"schemaVersion":1,"contentVersion":1,"id":"7eac00c0fa","lessonId":"押题卷01","kind":"choice","question":"2025 年 9 月，习近平总书记在\"上海合作组织+\"会议上提出（ ）。","options":[{"value":"A","text":"全球发展倡议"},{"value":"B","text":"全球安全倡议"},{"value":"C","text":"全球文明倡议"},{"value":"D","text":"全球治理倡议"}],"answer":["D"],"explanation":"","chapter":"押题卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：2025 年 9 月 1 日，习近平在“上海合作组织+”会议上提出全球治理倡议，并阐述主权平等、国际法治、多边主义、以人为本、行动导向五项内容。","paperTitle":"押题卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"2025 年 9 月，习近平总书记在\"上海合作组织+\"会议上提出（ ）。"},{"schemaVersion":1,"contentVersion":1,"id":"25ffcaa9c0","lessonId":"押题卷01","kind":"choice","question":"习近平在广东考察时强调，广东增强创新优势、实现新突破，必须大力弘扬（ ），以全面深化改革开放推动高质量发展。","options":[{"value":"A","text":"创新精神、实干精神"},{"value":"B","text":"改革开放精神、特区精神"},{"value":"C","text":"斗争精神、奋斗精神"},{"value":"D","text":"企业家精神、工匠精神"}],"answer":["B"],"explanation":"","chapter":"押题卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 联网核实·非原卷答案：习近平在广东考察时强调，广东增创新优势、实现新突破，必须大力弘扬改革开放精神、特区精神，以全面深化改革开放推动高质量发展。","paperTitle":"押题卷1","course":"模拟押题"},"answerStatus":"provided","warn":""," 标注","grp":"题库","legacyQuestion":"中国特色社会主义法治道路的核心要义，就是要（ ）。"},{"schemaVersion":1,"contentVersion":1,"id":"315e1b75e6","lessonId":"押题卷01","kind":"choice","question":"（ ）是新时代我国保障和改善民生的核心工作思路，这一思路明确了民生工作的方向与方法。","options":[{"value":"A","text":"坚守底线"},{"value":"B","text":"突出重点"},{"value":"C","text":"完善制度"},{"value":"D","text":"引导预期"}],"answer":[],"explanation":"","chapter":"押题卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷1","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"（ ）是新时代我国保障和改善民生的核心工作思路，这一思路明确了民生工作的方向与方法。"},{"schemaVersion":1,"contentVersion":1,"id":"9c83249fc2","lessonId":"押题卷01","kind":"choice","question":"党在领导新民主主义革命的过程中，逐步形成了（ ）的三大优良作风，这是中国共产党区别于其他任何政党的显著标志。","options":[{"value":"A","text":"理论联系实际"},{"value":"B","text":"密切联系群众"},{"value":"C","text":"批评与自我批评相结合"},{"value":"D","text":"独立自主"}],"answer":[],"explanation":"","chapter":"押题卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷1","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"党在领导新民主主义革命的过程中，逐步形成了（ ）的三大优良作风，这是中国共产党区别于其他任何政党的显著标志。"}],"subjs":[{"id":"ecb4c61625","num":31,"type":"辨析","supp":false,"stem":"中国特色社会主义进入新时代，意味着我国已脱离社会主义初级阶段。","options":[],"answer":"错误","src":"","exp":"**参考答案（全文转录）：**\n理由：①新时代是社会主义初级阶段中的一个阶段，是经过几十年积累、站到新起点的阶段，并非超越初级阶段的新历史时期。②我国仍处于并将长期处于社会主义初级阶段的基本国情没有变，我国是世界最大发展中国家的国际地位没有变。③这一判断既明确了发展方位，又坚守了基本国情，是制定政策的根本依据。","warn":""},{"id":"bccdc1843d","num":32,"type":"辨析","supp":false,"stem":"党在新时代的强军目标是建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队。","options":[],"answer":"正确","src":"","exp":"**参考答案（全文转录）：**\n该表述正确。党在新时代的强军目标，谋的是民族复兴伟业，布的是强国强军大局，立的是发展安全之基，理论意蕴深邃，实践意义重大：\n①听党指挥是灵魂，决定军队建设的政治方向。坚持党对人民军队的绝对领导是人民军队永远不变的军魂。\n②能打胜仗是核心，反映军队的根本职能和军队建设的根本指向。能打仗、打胜仗是军队的根本价值所在。\n③作风优良是保证，关系军队的性质、宗旨、本色，这是人民军队的鲜明特色和政治优势，也是人民军队战无不胜、攻无不克的重要保证。\n④在此基础上，建设世界一流军队是强军目标的战略指向，明确了新时代军队建设的长远发展目标。综上所述，该观点正确。","warn":""},{"id":"0b78d3b810","num":33,"type":"简答","supp":false,"stem":"简述科学发展观的科学内涵。","options":[],"answer":"（见下方解析）","src":"","exp":"科学发展观，第一要义是发展，核心立场是以人为本，基本要求是全面协调可持续，根本方法是统筹兼顾。这是对科学发展观的集中概括。\n①推动经济社会发展是科学发展观的第一要义；\n②以人为本是科学发展观的核心立场；\n③全面协调可持续是科学发展观的基本要求；\n④统筹兼顾是科学发展观的根本方法。","warn":""},{"id":"2b44938f1a","num":34,"type":"简答","supp":false,"stem":"简述大力推动建设新发展格局的举措。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）着力推动实施扩大内需战略同深化供给侧结构性改革有机结合。\n（2）着力发展实体经济。实体经济是一国经济的立身之本、财富之源，是构筑未来发展战略优势的重要支撑。\n（3）着力加快科技自立自强。构建新发展格局最本质的特征是实现高水平的自立自强。\n（4）着力推动产业链供应链优化升级。","warn":""},{"id":"1318630fd8","num":35,"type":"简答","supp":false,"stem":"如何理解人民对美好生活的向往就是党的奋斗目标？","options":[],"answer":"（见下方解析）","src":"","exp":"（1）坚持人民至上，必须始终把人民放在心中最高的位置，想人民之所想，行人民之所嘱。\n（2）为人民谋幸福是党始终坚守的初心，让人民过上好日子是党一贯的追求。\n（3）人民对美好生活的向往就是党的奋斗目标，这体现了我国社会主要矛盾转化对党和国家工作的新要求。","warn":""},{"id":"9998709c60","num":36,"type":"论述","supp":false,"stem":"论述新民主主义革命的意义。","options":[],"answer":"（见下方解析）","src":"","exp":"新民主主义革命理论，是以毛泽东为主要代表的中国共产党人，把马克思列宁主义基本原理同中国革命具体实践相结合，在认真总结中国革命实践经验基础上形成的具有独创性的革命理论。\n（1）新民主主义革命的理论，揭示了近代中国革命发展的客观规律，解决了在一个以农民为主体的、落后的半殖民地半封建的东方大国里进行革命的一系列理论问题，在当时的历史条件下科学地回答了中国革命向何处去的问题，以及中国革命的发展阶段问题，极大地丰富了马克思主义的理论宝库。\n（2）新民主主义革命理论是马克思主义中国化的重要理论成果，开辟了马克思主义中国化的发展道路。它是对中国革命实践经验的概括和总结，是中国共产党集体智慧的结晶。\n（3）在新民主主义革命理论的指导下，党团结带领人民找到了一条农村包围城市、武装夺取政权的正确革命道路，完成了新民主主义革命，建立了中华人民共和国。中国人民从此站起来了，劳动人民成为国家和社会的主人，开创了中国历史的新纪元。\n（4）中国新民主主义革命的伟大胜利，是 20 世纪继俄国十月革命以后改变世界面貌的伟大历史事件，有力地鼓舞和推动了世界上被压迫民族和被压迫人民反抗帝国主义、殖民主义的斗争，极大地增强了他们反对帝国主义斗争的信心，增强了世界人民争取和平的力量。\n📌 **本卷附：新民主主义革命理论的意义·要点与记忆点拨（原卷第 54 页）**\n（1）是具有独创性的革命理论。（2）揭示了近代中国革命的客观规律，解决了中国革命的一系列理论问题。（3）是马克思主义中国化的重要理论成果，开辟了马克思主义中国化的道路。（4）确定了农村包围城市，武装夺取政权的正确革命道路。（5）中国新民主主义革命的胜利，产生了重大的世界影响。\n【记忆点拨】创理论、揭规律、马克思、革命路、世界好","warn":""},{"id":"7bd7f49b4e","num":37,"type":"材料","supp":false,"stem":"阅读材料，回答问题。 **材料一：** 兴文化，就是要坚持中国特色社会主义文化发展道路，推动中华优秀传统文化创造性转化、创新性发展，继承革命文化，发展社会主义先进文化，激发全民族文化创新创造活力，建设社会主义文化强国。——习近平总书记在全国宣传思想工作会议上的讲话 【课件白话翻译】\"兴文化\"就是坚持走中国特色社会主义文化发展道路，推动传统文化传承创新，传承革命文化，发展先进文化，激发全民文化创造活力，建设社会主义文化强国。 **材料二：** 党的二十大报告指出：\"全面建设社会主义现代化国家，必须坚持中国特色社会主义文化发展道路，建设社会主义文化强国。\"这一重大论断立足全面建设社会主义现代化国家的战略全局、着眼建设社会主义文化强国的内在要求，科学回答了新时代文化建设走什么路、朝着什么目标迈进这一重大问题，为推动社会主义文化大发展大繁荣提供了根本遵循。——习近平总书记在中国共产党第二十次全国代表大会上的报告 【课件白话翻译】党的二十大明确要全面建成社会主义现代化国家，就必须走中国特色社会主义文化发展道路，朝着建设社会主义文化强国的目标不断前进。 **材料三：** 中国特色社会主义文化发展道路既造福中国，也惠及世界。在新时代，我们要主动作为，久久为功，以高度的文化自信走好中国特色社会主义文化发展道路，为人类文化多样性和文明跨越式发展作出更大的贡献。——习近平总书记关于中国特色社会主义文化发展道路的相关论述 【课件白话翻译】中国特色社会主义文化发展道路，不仅对我国自身发展有益，也能给世界带来积极影响。进入新时代，我们要积极行动、持之以恒，以坚定的文化自信走好这条道路，为维护世界文化多样性、推动人类文明不断进步作出更大贡献。 **（1）上述材料说明了什么？**","options":[],"answer":"（见下方解析）","src":"","exp":"答：材料说明了：\n①坚持中国特色社会主义文化发展道路，要推动中华优秀传统文化创造性转化、创新性发展，继承革命文化，发展社会主义先进文化，激发全民族文化创新创造活力，建设社会主义文化强国。\n②党的二十大明确，全面建设社会主义现代化国家必须坚持这条道路，为新时代文化建设指明方向、提供根本遵循。中国特色社会主义文化发展道路既造福中国，也惠及世界。\n③新时代我们要坚定文化自信，主动作为、久久为功，不断繁荣发展社会主义文化，为人类文明进步和文化多样性作出更大贡献。\n**（2）如何走中国特色社会主义文化发展道路？**","warn":"原卷未附参考答案（课件仅列出问题，无作答页）"}],"keyed":9,"doubts":0},{"id":"模拟卷01","name":"模拟卷1","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"模拟卷01","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"647173d12f","lessonId":"模拟卷01","kind":"choice","question":"2025 年 6 月，我国自主研制的 ______ 载人潜水器完成万米深潜任务，标志着我国深海探测技术进入全球领先行列。","options":[{"value":"A","text":"\"奋斗者\"号升级版"},{"value":"B","text":"\"蛟龙\"号改进型"},{"value":"C","text":"\"深海勇士\"号增强版"},{"value":"D","text":"\"潜龙\"号新一代"}],"answer":[],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"missing","warn":"时政题，课件未附答案。AI 联网复核：未检索到 2025 年 6 月\"新研载人潜水器完成万米深潜\"的权威报道——我国万米载人潜水器为\"奋斗者\"号（2020 年 11 月完成万米深潜），选项中的\"升级版/改进型/增强版/新一代\"命名无权威出处，疑题源有误，建议核对。","grp":"题库","legacyQuestion":"2025 年 6 月，我国自主研制的 ______ 载人潜水器完成万米深潜任务，标志着我国深海探测技术进入全球领先行列。"},{"schemaVersion":1,"contentVersion":1,"id":"bfa38256d9","lessonId":"模拟卷01","kind":"choice","question":"2025 年 9 月 4 日，在上海举行的世界智慧城市大会中国＆区域颁奖典礼上，______ 荣获 2025 世界智慧城市大奖·中国最高荣誉\"城市大奖\"和\"能源与环境大奖\"。","options":[{"value":"A","text":"上海"},{ acyQuestion":"激励全党全国各族人民前进的强大精神动力是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"0357d69bbd","lessonId":"模拟卷01","kind":"choice","question":"中国特色社会主义理论体系包含 ______。","options":[{"value":"A","text":"邓小平理论"},{"value":"B","text":"\"三个代表\"重要思想"},{"value":"C","text":"科学发展观"},{"value":"D","text":"习近平新时代中国特色社会主义思想"}],"answer":["A","B","C","D"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"据课件解析：邓论是开篇之作、\"三个代表\"推动跨世纪发展、科学发展观实现新世纪新阶段新发展、习思想谱写新时代新篇章","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"中国特色社会主义理论体系包含 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"1336105e80","lessonId":"模拟卷01","kind":"choice","question":"毛泽东思想是马克思主义中国化的第一个重大理论成果，以独创性的理论丰富和发展了马克思列宁主义。毛泽东思想是 ______。","options":[{"value":"A","text":"毛泽东的思想"},{"value":"B","text":"马克思列宁主义在中国的运用和发展"},{"value":"C","text":"被实践证明了的关于中国革命和建设的正确的理论原则和经验总结"},{"value":"D","text":"中国共产党集体智慧的结晶"}],"answer":["B","C","D"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"毛泽东思想是马克思主义中国化的第一个重大理论成果，以独创性的理论丰富和发展了马克思列宁主义。毛泽东思想是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"e262f16062","lessonId":"模拟卷01","kind":"choice","question":"我国全面推进依法治国的总目标是 ______。","options":[{"value":"A","text":"坚持法律面前人人平等"},{"value":"B","text":"建设社会主义法治国家"},{"value":"C","text":"建设中国特色社会主义法治体系"},{"value":"D","text":"推进国家治理体系和治理能力的现代化"}],"answer":["B","C"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 判定·非原卷答案：全面推进依法治国总目标是建设中国特色社会主义法治体系、建设社会主义法治国家；依据：习概09-第九章 全面依法治国。","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"我国全面推进依法治国的总目标是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"abf11e2fd4","lessonId":"模拟卷01","kind":"choice","question":"群众路线是以毛泽东为主要代表的中国共产党人坚持把马克思列宁主义关于人民群众是历史创造者的原理，系统地运用在党的全部活动中，形成的党的根本工作路线。群众路线，就是 ______。","options":[{"value":"A","text":"一切为了群众"},{"value":"B","text":"一切依靠群众"},{"value":"C","text":"从群众中来，到群众中去"},{"value":"D","text":"把党的正确主张变为群众的自觉行动"}],"answer":["A","B","C","D"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"群众路线是以毛泽东为主要代表的中国共产党人坚持把马克思列宁主义关于人民群众是历史创造者的原理，系统地运用在党的全部活动中，形成的党的根本工作路线。群众路线，就是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"3dc4268096","lessonId":"模拟卷01","kind":"choice","question":"新民主主义革命的动力包括 ______。","options":[{"value":"A","text":"工人阶级"},{"value":"B","text":"农民阶级"},{"value":"C","text":"城市小资产阶级（包括广大的知识分子、小商人、手工业者和自由职业者）"},{"value":"D","text":"民族资产阶级"}],"answer":["A","B","C","D"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"据课件解析：无产阶级的领导权是中国革命的中心问题，也是新民主主义革命理论的核心问题","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"新民主主义革命的动力包括 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"8d802c4ec7","lessonId":"模拟卷01","kind":"choice","question":"下列关于手工业的社会主义改造的说法，正确的是 ______。","options":[{"value":"A","text":"采取积极领导、稳步前进的方针"},{"value":"B","text":"从供销合作入手，逐步发展到走生产合作的道路"},{"value":"C","text":"用和平赎买的方法改造"},{"value":"D","text":"实行全行业的公私合营"}],"answer":["A","B"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 判定·非原卷答案：手工业改造采取积极领导、稳步前进的方针，从供销合作入手逐步走向生产合作；C、D 是资本主义工商业的改造方式；依据：毛中特03-第三章 社会主义改造理论。","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"下列关于手工业的社会主义改造的说法，正确的是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"089ec7741d","lessonId":"模拟卷01","kind":"choice","question":"\"三个代表\"重要思想的核心观点包括 ______。","options":[{"value":"A","text":"中国共产党必须始终代表中国先进生产力的发展要求"},{"value":"B","text":"中国共产党必须始终代表中国先进文化的前进方向"},{"value":"C","text":"中国共产党必须始终代表中国最广大人民的根本利益"},{"value":"D","text":"中国共产党必须始终代表工人阶级的利益"}],"answer":["A","B","C"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"\"三个代表\"重要思想的核心观点包括 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"cb6f380730","lessonId":"模拟卷01","kind":"choice","question":"习近平新时代中国特色社会主义思想的历史地位体现在它是 ______。","options":[{"value":"A","text":"马克思主义中国化时代化最新成果"},{"value":"B","text":"新时代的精神旗帜"},{"value":"C","text":"实现中华民族伟大复兴的行动指南"},{"value":"D","text":"中国特色社会主义理论体系的开篇之作"}],"answer":["A","B","C"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 判定·非原卷答案：A、B、C 均属于习近平新时代中国特色社会主义思想的历史地位，D 所称中国特色社会主义理论体系的开篇之作是邓小平理论；依据：习概00-导论。","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"习近平新时代中国特色社会主义思想的历史地位体现在它是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"07fb51a7a4","lessonId":"模拟卷01","kind":"choice","question":"我国外交政策的宗旨是 ______。","options":[{"value":"A","text":"维护国家核心利益"},{"value":"B","text":"促进共同发展"},{"value":"C","text":"维护世界公平正义"},{"value":"D","text":"维护世界和平"}],"answer":["B","D"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 判定·非原卷答案：我国外交政策的宗旨是维护世界和平、促进共同发展；依据：习概16-第十六章 中国特色大国外交和推动构建人类命运共同体。","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"我国外交政策的宗旨是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"c3a3959e2a","lessonId":"模拟卷01","kind":"choice","question":"新时代党的建设的根本方针是 ______。","options":[{"value":"A","text":"坚持党要管党全面从严治党"},{"value":"B","text":"全面从严治党"},{"value":"C","text":"\"一个中心、两个基本点\""},{"value":"D","text":"\"两手抓，两手都要硬\""}],"answer":["A"],"explanation":"","chapter":"模拟卷1","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"AI 判定·非原卷答案：新时代党的建设总要求明确“坚持党要管党、全面从严治党”是党的建设根本方针；本题虽按多选题编排，但只有 A 完整对应；依据：习概17-第十七章 全面从严治党。","paperTitle":"模拟卷1","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"新时代党的建设的根本方针是 ______。"}],"subjs":[{"id":"f31ce8e18f","num":31,"type":"辨析","supp":false,"stem":"毛泽东思想就是毛泽东个人的思想。","options":[],"answer":"错误。","src":"参考答案全文","exp":"（1）毛泽东思想是毛泽东同志个人的杰出贡献和党的集体智慧的相得益彰、交相辉映共同构筑的理论大厦。\n（2）在马克思主义中国化这一伟大工程的建设中，毛泽东的贡献最大、创造最多、水平最高，因此，以他的名字来命名的中国化的马克思主义是天经地义的。毛泽东思想主要是毛泽东同志的思想，毛泽东的科学著作是它的集中概括。\n（3）毛泽东思想又不是毛泽东同志个人的独创，党的许多卓越领导人都对它的形成和发展做出了重要的贡献，党的许多重要会议和文献都丰富了毛泽东思想的理论宝库。因此，毛泽东思想是中国共产党人集体智慧的结晶，而不是毛泽东同志个人的独创。\n📌 课件附【辨析题答题模板】：\"判断 + 考点 + 结论\"三步——①明确判断（该说法正确/错误）；②对应考点纠正/论证（错误的写正确考点对比，正确的写考点强化，用教材原文不口语化）；③以\"因此，以上说法是正确/错误的\"收尾。","warn":""},{"id":"eefd0a5505","num":32,"type":"辨析","supp":false,"stem":"新民主主义革命是无产阶级领导的，所以，中国革命实质上是无产阶级社会主义革命。","options":[],"answer":"错误。","src":"参考答案全文","exp":"（1）近代中国是一个半殖民地半封建社会，这就决定了近代中国革命的两大历史任务，即对外推翻帝国主义压迫，对内推翻封建主义的统治。近代中国革命的历史证明，农民阶级和资产阶级都不能担当起反帝反封建革命的领导责任。这样，中国革命的领导权就历史地落到了无产阶级的肩上。\n（2）决定革命性质的力量，是主要的敌人和主要的革命者两方面。新民主主义革命的主要敌人仍然是帝国主义和封建主义，因此，它仍然是反帝反封建的资产阶级民主主义革命，而不是无产阶级社会主义革命。\n（3）新民主主义是无产阶级及其政党领导的，它不是一般的、旧式的资产阶级民主主义革命，它不是以建立资产阶级专政的共和国为目标，而是要建立各革命阶级联合专政的共和国，并经过新民主主义走向社会主义。\n📌 课件附【老师拓展】对比表：\n| 对比维度 | 新民主主义革命 | 社会主义革命 |\n|---|---|---|\n| 革命对象 | 三座大山 | 资产阶级、资本主义所有制 |\n| 革命任务 | 推翻\"三座大山\"，实现民族独立、人民解放 | 消灭剥削制度，建立社会主义制度 |\n| 革命性质 | 资产阶级民主主义革命 | 无产阶级社会主义革命 |\n| 革命前途 | 先建立新民主主义社会，再过渡到社会主义社会 | 直接建立社会主义社会 |","warn":""},{"id":"24e0651912","num":33,"type":"简答","supp":false,"stem":"简述毛泽东思想的历史意义。 ✅ 参考答案要点：（1）是马克思主义中国化第一个重大理论成果，开辟了马克思主义在中国发展的道路，为党领导的革命和建设的发展奠定了坚定的思想理论基础。（2）是中国革命和建设的科学指南。在毛泽东思想指引下，我们党领导全国人民，找到了一条新民主主义革命的正确道路，确立了社会主义基本制度，实现了中国历史上最伟大的变革。（3）是中华人民的宝贵精神财富。毛泽东思想依然是中国人民不断奋进的强大精神动力，将长期激励和指导我们前进。","options":[],"answer":null,"src":"","exp":"","warn":""},{"id":"286a6e8484","num":34,"type":"简答","supp":false,"stem":"简述中国梦的实现途径。 ✅ 参考答案要点：（1）道路：实现中国梦必须走中国道路，这就是中国特色社会主义道路；（2）精神：实现中国梦必须弘扬中国精神；（3）团结：实现中国梦必须凝聚中国力量，这就是中国各族人民大团结的力量；（4）努力：需要脚踏实地依靠全体人民的创造性劳动，需要一代又一代中国人为之顽强、艰苦和不懈的奋斗。","options":[],"answer":null,"src":"","exp":"","warn":""},{"id":"7d0bf1592b","num":35,"type":"简答","supp":false,"stem":"简述社会主义改革开放理论。 【教材 127-128 页】 ✅ 参考答案要点：（1）改革是一场深刻的社会变革，是中国的第二次革命，是实现中国现代化的必由之路；（2）改革是社会主义社会发展的直接动力；（3）改革是一项崭新的事业，是一个大试验；（4）开放也是改革，对外开放是建设中国特色社会主义的一项基本国策，和改革一起成为新时期最鲜明的特征；（5）实行对外开放是对中国经济发展停滞落后历史教训深刻总结的结果；（6）对外开放是对世界所有国家的开放，包括对发达国家的开放，也包括对发展中国家的开放；不仅是经济领域的开放，还包括科技、教育、文化等领域的开放。","options":[],"answer":null,"src":"","exp":"","warn":""},{"id":"00064cb481","num":36,"type":"论述","supp":false,"stem":"论述构建人类命运共同体的内涵以及意义。 ✅ 参考答案要点：（1）人类命运共同体就是每个民族、每个国家的前途命运都紧紧联系在一起，应该风雨同舟、荣辱与共，努力把我们生于斯、长于斯的这个星球建成一个和睦的大家庭，把世界各国人民对美好生活的向往变成现实。（2）构建人类命运共同体，就是要携手世界各国人民共同建设持久和平、普遍安全、共同繁荣、开放包容、清洁美丽的世界。（3）构建人类命运共同体理念顺应了历史潮流，回应了时代要求，凝聚了各国共识，为人类社会实现共同发展、持续繁荣、长治久安绘制了蓝图，对中国的和平发展、世界的繁荣进步都具有重大而深远的意义。","options":[],"answer":null,"src":"","exp":"","warn":""},{"id":"0bd21d4976","num":37,"type":"材料","supp":false,"stem":"请结合所学知识分析材料回答问题。 **材料 1**：我们党的百年历史，就是一部践行党的初心使命的历史，就是一部党与人民心连心、同呼吸、共命运的历史。历史充分证明，江山就是人民，人民就是江山，人心向背关系党的生死存亡，赢得人民信任，得到人民支持，党就能够克服任何困难，就能够无往而不胜。要教育引导全党深刻认识党的性质宗旨，坚持一切为了人民、一切依靠人民，始终把人民放在心中最高位置、把人民对美好生活的向往作为奋斗目标，推动改革发展成果更多更公平惠及全体人民，推动共同富裕取得更为明显的实质性进展，把 14 亿中国人民凝聚成推动中华民族伟大复兴的磅礴力量。——摘自习近平在党史学习教育动员大会上的讲话（2021 年 2 月 20 日） （课件翻译：党的百年历史是践行初心使命、与人民心连心共命运的历史，\"江山就是人民，人民就是江山\"的论断印证了民心的关键作用，全党需坚守人民立场、推动共同富裕，凝聚力量助力中华民族伟大复兴。） **材料 2**：我国全过程人民民主是最广泛、最真实、最管用的社会主义民主。全过程人民民主，是人民当家作主的生动实践和必由之路。人民依法通过各种途径和形式管理国家事务、管理经济和文化事业、管理社会事务，享有广泛的民主权利和自由。从民主选举、民主协商到民主决策、民主管理、民主监督各个环节紧密贯通、相互协调，确保人民的意愿在决策、执行、监督等各个环节都能得到体现和保障，真正实现了人民当家作主。——摘自《中国的民主》白皮书（2021 年 12 月） （课件翻译：我国全过程人民民主是最广泛、最真实、最管用的社会主义民主，通过民主选举、协商、决策、管理、监督全环节贯通，保障人民依法管理各项事务，真正实现人民当家作主。） **材料 3**：我们要始终与人民风雨同舟、与人民心心相印，想人民之所想，行人民之所嘱，不断把人民对美好生活的向往变为现实。要坚持全心全意为人民服务的根本宗旨，树牢群众观点，贯彻群众路线，尊重人民首创精神，坚持一切为了人民、一切依靠人民，从群众中来、到群众中去，始终保持同人民群众的血肉联系，始终接受人民批评和监督，始终同人民同呼吸、共命运、心连心。——摘自习近平在二〇二三年新年贺词（2022 年 12 月 31 日） （课件翻译：我们要坚守全心全意为人民服务的根本宗旨，贯彻群众路线、尊重人民首创精神，始终与人民风雨同舟、心连心，把人民对美好生活的向往变为现实。） **（1）以上材料说明什么。（5 分）** ✅ 参考答案（言之有理即可给分）：三则材料立足历史、聚焦民主、着眼实践，从不同维度共同阐明了坚持人民立场以及坚持发挥全过程人民民主。 ①人民性是马克思主义的本质属性和鲜明品格。坚持以人民为中心，是新时代坚持和发展中国特色社会主义的根本立场，是贯穿党治国理政全部活动的一条红线。必须坚持人民至上，站稳人民立场、把握人民愿望、尊重人民创造、集中人民智慧，不断实现人民对美好生活的向往，推动人的全面发展、全体人民共同富裕取得更为明显的实质性进展。 ②全过程人民民主，是中国共产党团结带领人民追求民主、发展民主、实现民主的伟大创造，是党不断推进中国民主理论创新、制度创新、实践创新的经验结晶。全过程人民民主是社会主义民主政治的本质属性，是最广泛、最真实、最管用的民主。要充分发挥全过程人民民主的优势和特点，为全面建成社会主义现代化强国和实现中华民族伟大复兴凝聚起最广大人民的智慧和力量。 **（2）结合材料，谈谈健全人民当家作主政治制度体系的内容。（10 分）** ✅ 参考答案： 第一，人民代表大会制度。 第二，社会主义协商民主。 第三，中国共产党领导的多党合作和政治协商制度。 第四，民族区域自治制度。 第五，基层群众自治制度。","options":[],"answer":null,"src":"","exp":"","warn":""}],"keyed":28,"doubts":0},{"id":"押题卷02","name":"押题卷2","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"押题卷02","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"c1c0cafcd9","lessonId":"押题卷02","kind":"choice","question":"第十五届全国运动会由广东、香港、澳门共同承办，其主题口号需体现赛事激情与粤港澳大湾区特色，下列选项中哪项是该届全运会的官方主题口号？（ ）","options":[{"value":"A","text":"\"逐梦全运，乐享广东\""},{"value":"B","text":"\"激情全运会，活力大湾区\""},{"value":"C","text":"\"湾区同心，运动同行\""},{"value":"D","text":"\"全运聚能，广东出彩\""}],"answer":["B"],"explanation":"","chapter":"押题卷2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"据题面所配新华社发布图（原卷第 24 页）：十五运会主题口号\"激情全运会，活力大湾区\"，残特奥会主题口号\"追梦大湾区，出彩人生路\"","paperTitle":"押题卷2","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"第十五届全国运动会由广东、香港、澳门共同承办，其主题口号需体现赛事激情与粤港澳大湾区特色，下列选项中哪项是该届全运会的官方主题口号？（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"c9d05e4db7","lessonId":"押题卷02","kind":"choice","question":"近日，（ ）环绕器利用高分辨率相机，成功观测到一颗来自太阳系以外的彗星——阿特拉斯（3I/ATLAS），这是人类已知造访太阳系的第三颗星际天体，也是我国航天器首次观测到星际天体。","options":[{"value":"A","text":"天问一号"},{"value":"B","text":"嫦娥五号"},{"value":"C","text":"祝融号"},{"value":"D","text":"羲和号"}],"answer":["A"],"explanation":"","chapter":"押题卷2"," ","text":"完善和发展中国特色社会主义制度"},{"value":"C","text":"社会主义现代化"},{"value":"D","text":"中华民族伟大复兴"}],"answer":[],"explanation":"","chapter":"押题卷2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷2","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"坚持和发展中国特色社会主义，总任务是实现（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"986b8ac80c","lessonId":"押题卷02","kind":"choice","question":"建设美丽中国、实现中华民族永续发展必须树立的生态文明理念包括（ ）","options":[{"value":"A","text":"尊重自然"},{"value":"B","text":"顺应自然"},{"value":"C","text":"保护自然"},{"value":"D","text":"遵循自然"}],"answer":[],"explanation":"","chapter":"押题卷2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷2","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"建设美丽中国、实现中华民族永续发展必须树立的生态文明理念包括（ ）"},{"schemaVersion":1,"contentVersion":1,"id":"58d3ce5a8e","lessonId":"押题卷02","kind":"choice","question":"共建\"一带一路\"应坚持的理念包括（ ）","options":[{"value":"A","text":"绿色"},{"value":"B","text":"廉洁"},{"value":"C","text":"互利"},{"value":"D","text":"开放"}],"answer":[],"explanation":"","chapter":"押题卷2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"押题卷2","course":"模拟押题"},"answerStatus":"missing","warn":"原卷未见答案标注","grp":"题库","legacyQuestion":"共建\"一带一路\"应坚持的理念包括（ ）"}],"subjs":[{"id":"ef23a7e573","num":31,"type":"辨析","supp":false,"stem":"新民主主义革命的三大法宝是实事求是、独立自主、群众路线。","options":[],"answer":"错误。","src":"","exp":"","warn":""},{"id":"82aed342d1","num":32,"type":"辨析","supp":false,"stem":"中国最大的国情是坚持中国共产党的领导。","options":[],"answer":"该观点正确。","src":"","exp":"①中国共产党的领导地位是在历史奋斗中形成的。\n②中国共产党领导是人民当家作主的可靠保障。\n③中国共产党领导关系中国特色社会主义的性质、方向和命运。\n④中国共产党领导是实现中华民族伟大复兴的根本保证。","warn":""},{"id":"68904bb2d5","num":33,"type":"简答","supp":false,"stem":"如何正确认识和处理改革、发展、稳定的关系。","options":[],"answer":"（见下方解析）","src":"","exp":"（1）改革是动力，发展是目的，稳定是前提。\n（2）没有改革，就不可能走出一条建设中国特色社会主义的正确道路，我们的事业就不可能顺利前进；没有发展，就不可能实现现代化，也就不可能保持党和国家的长治久安；没有稳定，改革和发展都无从进行。\n（3）要把改革的力度、发展的速度和社会可承受的程度统一起来，把不断改善人民生活作为处理改革发展稳定关系的重要结合点，在社会稳定中推进改革发展，通过改革发展促进社会稳定。","warn":""},{"id":"14e746b9cf","num":34,"type":"简答","supp":false,"stem":"简述\"一国两制\"方针的内涵。","options":[],"answer":"（见下方解析）","src":"","exp":"①坚持一个中国，这是\"和平统一、一国两制\"的核心，是发展两岸关系和实现和平统一的基础；\n②两制并存，在祖国统一的前提下，国家的主体部分实行社会主义制度，同时在香港、澳门、台湾保持原有的社会制度和生活方式长期不变；\n③高度自治，祖国完全统一后，香港、澳门、台湾作为中央政府全面管辖下的特别行政区，享有不同于中国其他省、市、自治区的高度自治权，台湾、香港、澳门同胞各种合法权益将得到切实尊重和维护；\n④尽最大努力争取和平统一，但不承诺放弃使用武力；解决台湾问题，实现祖国完全统一，寄希望于台湾人民。","warn":""},{"id":"a46c883ce8","num":35,"type":"简答","supp":false,"stem":"简述党对社会主义建设道路初步探索的重大意义。","options":[],"answer":"（见下方解析）","src":"","exp":"第一，巩固和发展了我国的社会主义制度。\n第二，为开创中国特色社会主义提供了宝贵经验、理论准备、物质基础。\n第三，丰富了科学社会主义的理论和实践。","warn":""},{"id":"21c5b3688f","num":36,"type":"论述","supp":false,"stem":"论述全面深化改革路线图的主要内容。","options":[],"answer":"（见下方解析）","src":"","exp":"①紧紧围绕使市场在资源配置中起决定性作用和更好发挥政府作用，深化经济体制改革；\n②紧紧围绕坚持党的领导、人民当家作主、依法治国有机统一，深化政治体制改革；\n③紧紧围绕建设社会主义核心价值体系、建设社会主义文化强国，深化文化体制改革；\n④紧紧围绕更好保障和改善民生、促进社会公平正义，深化社会体制改革；\n⑤紧紧围绕建设美丽中国，深化生态文明体制改革；\n⑥紧紧围绕提高科学执政、民主执政、依法执政水平，深化党的建设制度改革。","warn":""},{"id":"45df60c8bd","num":37,"type":"材料","supp":false,"stem":"结合材料回答问题： **材料一：** 兴文化，就是要坚持中国特色社会主义文化发展道路，推动中华优秀传统文化创造性转化、创新性发展，继承革命文化，发展社会主义先进文化，激发全民族文化创新创造活力，建设社会主义文化强国。 ——习近平总书记在全国宣传思想工作会议上的讲话 课件\"翻译\"：\"兴文化\"就是坚持走中国特色社会主义文化发展道路，推动传统文化传承创新，传承革命文化，发展先进文化，激发全民文化创造活力，建设社会主义文化强国。 **材料二：** 党的二十大报告指出：\"全面建设社会主义现代化国家，必须坚持中国特色社会主义文化发展道路，建设社会主义文化强国。\"这一重大论断立足全面建设社会主义现代化国家的战略全局、着眼建设社会主义文化强国的内在要求，科学回答了新时代文化建设走什么路、朝着什么目标迈进这一重大问题，为推动社会主义文化大发展大繁荣提供了根本遵循。 ——习近平总书记在中国共产党第二十次全国代表大会上的报告 课件\"翻译\"：党的二十大明确要全面建成社会主义现代化国家，就必须走中国特色社会主义文化发展道路，朝着建设社会主义文化强国的目标不断前进。 **材料三：** 中国特色社会主义文化发展道路既造福中国，也惠及世界。在新时代，我们要主动作为，久久为功，以高度的文化自信走好中国特色社会主义文化发展道路，为人类文化多样性和文明跨越式发展作出更大的贡献。 ——习近平总书记关于中国特色社会主义文化发展道路的相关论述 课件\"翻译\"：中国特色社会主义文化发展道路，不仅对我国自身发展有益，也能给世界带来积极影响。进入新时代，我们要积极行动、持之以恒，以坚定的文化自信走好这条道路，为维护世界文化多样性、推动人类文明不断进步作出更大贡献。 **（1）** 结合材料和实际谈谈以上材料说明了什么？","options":[],"answer":"（见下方解析）","src":"","exp":"**（2）** 坚持和拓展中国特色社会主义法治道路是一个深入探索和不断实践的过程，必须牢牢把握核心要义，请阐述一下我们需要毫不动摇坚持什么原则？\n①坚持中国共产党的领导。党的领导是中国特色社会主义法治之魂，是我们的法治同西方资本主义国家的法治最大的区别。\n②坚持以人民为中心。全面依法治国最广泛、最深厚的基础是人民，必须坚持法治为了人民、依靠人民、造福人民、保护人民。\n③坚持法律面前人人平等。平等是社会主义法律的基本属性。任何组织和个人都必须尊重宪法法律权威，都必须在宪法法律范围内活动，都必须依照宪法法律行使权力或权利、履行职责或义务，都不得有超越宪法法律的特权。\n④坚持依法治国和以德治国相结合。法安天下，德润人心。国家和社会治理需要法律和道德共同发挥作用。\n⑤坚持从中国实际出发。从中国实际出发，就是要突出法治的中国特色、实践特色、时代特色。\n课件记忆口诀：**党人平德实**（谐音：\"让人评得失\"）","warn":"课件未附本题参考答案（仅给出三则材料的\"翻译\"辅助理解，见上）"}],"keyed":10,"doubts":0},{"id":"模拟课2","name":"模拟课2","zone":"模拟押题","group":"模拟押题","subject":"模拟押题","note":"模拟课2","mcqs":[{"schemaVersion":1,"contentVersion":1,"id":"4dfbf30645","lessonId":"模拟课2","kind":"choice","question":"2025 年 7 月 31 日，国务院常务会议审议通过《关于深入实施\"人工智能+\"行动的意见》，会议指出要大力推进人工智能 ______ 应用。","options":[{"value":"A","text":"全领域"},{"value":"B","text":"重点领域"},{"value":"C","text":"传统领域"},{"value":"D","text":"新兴领域"}],"answer":[],"explanation":"课件外检索备注（非课件内容）：据新华社报道，7 月 31 日国常会新闻稿的表述为\"大力推进人工智能**规模化商业化**应用\"，四个选项中并无\"规模化/商业化\"；8 月印发的《意见》正式文本则表述为\"推动人工智能与经济社会各行业各领域广泛深度融合\"。命题措辞与官方表述有出入，请以老师讲评为准。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未附答案。","grp":"题库","legacyQuestion":"2025 年 7 月 31 日，国务院常务会议审议通过《关于深入实施\"人工智能+\"行动的意见》，会议指出要大力推进人工智能 ______ 应用。"},{"schemaVersion":1,"contentVersion":1,"id":"29dfcb83b8","lessonId":"模拟课2","kind":"choice","question":"2025 年 4 月 28 日上午，庆祝中华全国总工会成立 100 周年暨全国劳动模范和先进工作者表彰大会隆重举行，习近平强调 100 年来党的工运事业最重要成果是 ______。","options":[{"value":"A","text":"工人阶级成为领导阶级"},{"value":"B","text":"形成党领导下的工会工作体系"},{"value":"C","text":"实现工人阶级当家作主"},{"value":"D","text":"工会组织覆盖各行业领域"}],"answer":[],"explanation":"课件外检索备注（非课件内容）：讲话原文为\"100 年来，党的工运事业理论创新和实践发展的最重要成果，就是形成了**中国特色社会主义工会发展道路**\"（来源：新华网讲话全文）。四个选项中未出现原文，B 项\"形成党领导下的工会工作体系\"与之最接近，应为命题意图所指。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.ht "模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"missing","warn":"课件未直接标注答案。","grp":"题库","legacyQuestion":"近代中国的社会性质和主要矛盾决定了中国民主革命的性质是 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"cc0bc3f329","lessonId":"模拟课2","kind":"choice","question":"农业社会主义改造经历的由低级到高级的步骤和形式包括 ______。","options":[{"value":"A","text":"互助组、初级社、高级社"},{"value":"B","text":"初级社、高级社、人民公社"},{"value":"C","text":"供销小组、供销合作社、生产合作社"},{"value":"D","text":"个别企业公私合营、行业公私合营"}],"answer":["A"],"explanation":"课件解析（第 18 页红字标注）：互助组：换工互助，土地、资料归个人（社会主义萌芽）；初级社：土地入股、统一经营，按劳 + 按股分红（半社会主义）；高级社：土地、资料归集体，只按劳分配（完全社会主义）。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"农业社会主义改造经历的由低级到高级的步骤和形式包括 ______。"},{"schemaVersion":1,"contentVersion":1,"id":"4c5320140e","lessonId":"模拟课2","kind":"choice","question":"______ 第一次比较系统论述了社会主义初级阶段的理论。【这个考点不熟悉的看教材 102 页】","options":[{"value":"A","text":"党的十三大"},{"value":"B","text":"党的七大"},{"value":"C","text":"党的十四大"},{"value":"D","text":"党的十二大"}],"answer":["A"],"explanation":"课件解析（第 20 页红字标注）：1987 年召开的党的十三大，第一次比较系统地论述了我国社会主义初级阶段理论，明确概括和全面阐发了党的\"一个中心、两个基本点\"的基本路线，从马克思主义哲学、政治经济学和科学社会主义等方面，第一次对中国特色社会主义理论的主要内容作了系统概括。 选项批注：党的十四大正式把建立社会主义市场经济体制确立为我国经济体制改革的目标；1982 年邓小平在党的十二大开幕词中明确提出\"走自己的道路，建设有中国特色的社会主义\"，从此\"中国特色社会主义\"成为我们党的全部理论和实践创新的主题。","chapter":"模拟课2","knowledgePoint":"","source":{"path":"/blog/lessons/zsb-politics/lessons/practice.html","label":"","paperTitle":"模拟课2","course":"模拟押题"},"answerStatus":"provided","warn":"","grp":"题库","legacyQuestion":"______ 第一次比较系统论述了社会主义初级阶段的理论。【这个考点不熟悉的看教材 102 页】"},{"schemaVersion":1,"contentVersion":1,"id":"587313b095","lessonId":"模拟课2","kind":"choice","question":"中国革命第一个和最凶恶的敌人是 ______。","options":[{"value":"A","text":"帝国主义"},{"value":"B","text":"民族资本主义"},{"value":"C","text":"封建

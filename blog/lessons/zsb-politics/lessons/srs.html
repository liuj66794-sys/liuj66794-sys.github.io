<script type="application/json" id="cards">[{"schemaVersion":1,"id":"4d0c1626c5","lessonId":"mzt00","question":"“马克思主义中国化”命题由谁在何年、哪次会议的哪篇报告中正式提出？","answer":"1938 年六届六中全会，毛泽东《论新阶段》","knowledgePoint":"\"马克思主义中国化\"命题正式提出","chapter":"马克思主义中国化时代化","source":{"label":"课1 p12"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"868f4ac67c","lessonId":"mzt00","question":"1945年党的七大上，谁在《关于修改党章的报告》中将毛泽东思想概括为什么？","answer":"1945 年，刘少奇《关于修改党章的报告》，毛泽东思想=\"中国化的马克思主义\"","knowledgePoint":"七大理论阐述","chapter":"马克思主义中国化时代化","source":{"label":"课1 p12/p33"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"df53a02534","lessonId":"mzt00","question":"为什么要推进马克思主义中国化时代化？分别从理论发展和中国实际问题两个方面回答。","answer":"理论本身发展的内在要求 + 解决中国实际问题的客观需要","knowledgePoint":"中国化时代化两大原因","chapter":"马克思主义中国化时代化","source":{"label":"课1 p14-15"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"38cbf7fa49","lessonId":"mzt00","question":"马克思主义中国化时代化的内涵包括哪三层意思？从解决问题、理论提炼和表达形式回答。","answer":"解决实际问题 / 实践经验上升为理论 / 民族语言+中国特色中国风格中国气派","knowledgePoint":"内涵三层意思","chapter":"马克思主义中国化时代化","source":{"label":"课1 p40"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1b28c2091e","lessonId":"mzt00","question":"推进马克思主义中国化时代化，必须把马克思主义基本原理同哪两个方面相结合？","answer":"同中国具体实际相结合、同中华优秀传统文化相结合","knowledgePoint":"\"两个结合\"","chapter":"马克思主义中国化时代化","source":{"label":"课1 p28"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"713d77a5dd","lessonId":"mzt00","question":"马克思主义中国化第一次历史性飞跃形成了哪一理论成果？","answer":"毛泽东思想","knowledgePoint":"第一次历史性飞跃","chapter":"马克思主义中国化时代化","source":{"label":"课2 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4ee292a006","lessonId":"mzt00","question":"中国特色社会主义理论体系的开篇之作是哪一理论？它在哪次党代会上写入党章？","answer":"邓小平理论（十五大写入党章）","knowledgePoint":"开篇之作","chapter":"马克思主义中国化时代化","source":{"label":"课2 p43/p21"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"fb83adda95","lessonId":"mzt00","question":"十三届四中全会以后，以江泽民同志为主要代表的中国共产党人形成了哪一重要思想，实现了中国特色社会主义理论体系的跨世纪发展？","answer":"\"三个代表\"重要思想（十三届四中全会后，江泽民）","knowledgePoint":"跨世纪发展","chapter":"马克思主义中国化时代化","source":{"label":"课2 p24/p43"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f618e822e9","lessonId":"mzt00","question":"党的十六大以后，以胡锦涛同志为主要代表的中国共产党人形成了哪一理论成果，推动了中国特色社会主义理论体系在新世纪新阶段的发展？","answer":"科学发展观（十六大后，胡锦涛）","knowledgePoint":"新世纪新阶段新发展","chapter":"马克思主义中国化时代化","source":{"label":"课2 p27-28/p44"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c7c1be7de6","lessonId":"mzt00","question":"“中国特色社会主义理论体系”概念在哪次党代会上提出？","answer":"党的十七大","knowledgePoint":"\"中特理论体系\"概念提出","chapter":"马克思主义中国化时代化","source":{"label":"课2 p44"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"06b1055478","lessonId":"mzt00","question":"党的十八大以来，哪一思想实现了马克思主义中国化时代化新的飞跃？","answer":"习近平新时代中国特色社会主义思想（十八大后）","knowledgePoint":"新的飞跃","chapter":"马克思主义中国化时代化","source":{"label":"课2 p32"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"dda2fdb421","lessonId":"mzt00","question":"习近平新时代中国特色社会主义思想回答了哪三大时代课题？每个课题都要说明“什么样”和“怎样”。","answer":"坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","knowledgePoint":"三大时代课题","chapter":"马克思主义中国化时代化","source":{"label":"课2 p32"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a287aa9bed","lessonId":"mzt00","question":"“中国共产党为什么能，中国特色社会主义为什么好，归根到底是……”这句话应如何补全？","answer":"归根到底是马克思主义行，是中国化时代化的马克思主义行","knowledgePoint":"金句","chapter":"马克思主义中国化时代化","source":{"label":"课2 p40"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d3c28ace52","lessonId":"mzt00","question":"贯穿毛泽东思想的活的灵魂包括哪三个基本方面？","answer":"实事求是、群众路线、独立自主","knowledgePoint":"活的灵魂","chapter":"马克思主义中国化时代化","source":{"label":"课2 p45"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"774b1a7177","lessonId":"mzt01","question":"毛泽东思想形成和发展的实践基础指党领导人民进行的哪些实践？","answer":"党领导人民进行革命和建设的成功实践","knowledgePoint":"形成发展的实践基础","chapter":"毛泽东思想","source":{"label":"课1 p17"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"22147b1877","lessonId":"mzt01","question":"毛泽东思想在哪一时期开始萌芽？列出两篇代表著作及其中形成的革命基本思想。","answer":"大革命时期，《中国社会各阶级的分析》《湖南农民运动考察报告》，新民主主义革命基本思想","knowledgePoint":"开始萌芽","chapter":"毛泽东思想","source":{"label":"课1 p19/p21"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e99d540362","lessonId":"mzt01","question":"毛泽东思想在哪一时期初步形成？这一阶段提出了怎样的革命道路？","answer":"土地革命战争时期，农村包围城市、武装夺取政权道路","knowledgePoint":"初步形成","chapter":"毛泽东思想","source":{"label":"课1 p20/p22"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e098f4136c","lessonId":"mzt01","question":"哪一革命理论的系统阐述标志着毛泽东思想走向成熟？","answer":"新民主主义革命理论的系统阐述","knowledgePoint":"走向成熟的标志","chapter":"毛泽东思想","source":{"label":"课1 p24/p28"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6ad2edd4a3","lessonId":"mzt01","question":"遵义会议召开于何时？它对毛泽东的领导地位和独立解决中国革命问题有何意义？","answer":"1935.1，事实上确立毛泽东在党中央和红军的领导地位，独立自主解决中国革命问题","knowledgePoint":"遵义会议","chapter":"毛泽东思想","source":{"label":"课1 p23/p25"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"59a18f7744","lessonId":"mzt01","question":"毛泽东思想在哪一年、哪次党代会上写入党章并确立为党的指导思想？","answer":"1945 年党的七大","knowledgePoint":"写入党章确立指导思想","chapter":"毛泽东思想","source":{"label":"课1 p29-30"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b364bcd97f","lessonId":"mzt01","question":"马克思主义中国化第一次历史性飞跃的理论成果是哪一思想？","answer":"毛泽东思想","knowledgePoint":"第一次历史性飞跃的理论成果","chapter":"毛泽东思想","source":{"label":"课1 p33"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0f464bbda0","lessonId":"mzt01","question":"把毛泽东思想主要内容归纳为六个方面，依据的是哪一年、哪次会议通过的什么文件？","answer":"1981 年十一届六中全会《历史决议》","knowledgePoint":"六个方面内容的划分依据","chapter":"毛泽东思想","source":{"label":"课1 p37"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f76899cf6f","lessonId":"mzt01","question":"毛泽东总结的中国革命战胜敌人的三大法宝分别是什么？","answer":"统一战线、武装斗争、党的建设","knowledgePoint":"三大法宝","chapter":"毛泽东思想","source":{"label":"课1 p45"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"73ec1cfd01","lessonId":"mzt01","question":"毛泽东在哪一年、哪篇著作中首次提出“新民主主义革命”概念？","answer":"1939.12《中国革命和中国共产党》","knowledgePoint":"\"新民主主义革命\"概念首次提出","chapter":"毛泽东思想","source":{"label":"课1 p41"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"246dce23b7","lessonId":"mzt01","question":"毛泽东思想活的灵魂中的三个基本方面分别是什么？","answer":"实事求是、群众路线、独立自主","knowledgePoint":"活的灵魂三方面","chapter":"毛泽东思想","source":{"label":"课2 p2/p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"cd8d39b27a","lessonId":"mzt01","question":"毛泽东思想的精髓和基本点是什么？","answer":"实事求是","knowledgePoint":"毛泽东思想的精髓/基本点","chapter":"毛泽东思想","source":{"label":"课2 p3/p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4fc0fabb78","lessonId":"mzt01","question":"毛泽东在哪一年、哪篇文章中科学界定了“实事求是”的含义？","answer":"1941《改造我们的学习》","knowledgePoint":"实事求是科学含义界定","chapter":"毛泽东思想","source":{"label":"课2 p7/p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1effd2e119","lessonId":"mzt01","question":"“没有调查，没有发言权”出自毛泽东哪一年写的哪篇著作？","answer":"1930《反对本本主义》","knowledgePoint":"\"没有调查，没有发言权\"","chapter":"毛泽东思想","source":{"label":"课2 p3/p8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d2bc1fe59a","lessonId":"mzt01","question":"党的群众路线的完整表述是什么？回答其群众立场、依靠力量和工作方法。","answer":"一切为了群众，一切依靠群众，从群众中来，到群众中去","knowledgePoint":"群众路线","chapter":"毛泽东思想","source":{"label":"课2 p13-14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d0d419c8f2","lessonId":"mzt01","question":"中国共产党执政以后面临的最大危险是什么？","answer":"脱离群众","knowledgePoint":"党执政后的最大危险","chapter":"毛泽东思想","source":{"label":"课2 p16"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"7ee0d28de9","lessonId":"mzt01","question":"毛泽东在哪一年、哪篇著作中最初表述独立自主思想？当时用哪句话强调中国同志了解中国情况的重要性？","answer":"1930《反对本本主义》\"中国革命斗争的胜利要靠中国同志了解中国情况\"","knowledgePoint":"独立自主最初表述","chapter":"毛泽东思想","source":{"label":"课2 p19"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8cae9e6110","lessonId":"mzt01","question":"评价毛泽东的历史功过，应怎样区分功绩与错误、晚年错误与毛泽东思想？","answer":"功绩第一位，错误第二位；晚年错误与毛泽东思想相区别","knowledgePoint":"评价毛泽东的结论","chapter":"毛泽东思想","source":{"label":"课2 p39/p41"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8d82920a3f","lessonId":"mzt02","question":"近代中国的最基本国情，即社会性质是什么？","answer":"半殖民地半封建社会","knowledgePoint":"近代中国最基本国情","chapter":"新民主主义革命理论","source":{"label":"课1 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bd9f8815a5","lessonId":"mzt02","question":"近代中国社会的两对主要矛盾是什么？其中哪一对是最主要矛盾？","answer":"帝国主义和中华民族（最主要）＋封建主义和人民大众","knowledgePoint":"两对主要矛盾","chapter":"新民主主义革命理论","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8b607a8a06","lessonId":"mzt02","question":"新民主主义革命的根本任务是推翻哪三种势力的统治？","answer":"推翻帝国主义、封建主义和官僚资本主义的统治","knowledgePoint":"革命根本任务","chapter":"新民主主义革命理论","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"58e8035759","lessonId":"mzt02","question":"哪一运动标志着新民主主义革命的开端？它与中国无产阶级和马克思主义的历史地位有什么联系？","answer":"五四运动（无产阶级登上历史舞台、马克思主义成为指导思想）","knowledgePoint":"新民主主义革命开端的标志","chapter":"新民主主义革命理论","source":{"label":"课1 p19/p23"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ae8f03c6d2","lessonId":"mzt02","question":"毛泽东在哪一年、哪篇著作中首次提出“新民主主义的革命”概念？","answer":"1939《中国革命和中国共产党》","knowledgePoint":"首次提出\"新民主主义的革命\"概念","chapter":"新民主主义革命理论","source":{"label":"课1 p39"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d2d36f0b05","lessonId":"mzt02","question":"毛泽东在哪一年、哪篇讲话中完整表述了新民主主义革命总路线？","answer":"1948《在晋绥干部会议上的讲话》","knowledgePoint":"总路线完整表述","chapter":"新民主主义革命理论","source":{"label":"课1 p39"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6eefaa4e5b","lessonId":"mzt02","question":"新民主主义革命的首要对象是谁？为什么它被列为首要对象？","answer":"帝国主义（贫困落后和一切灾难祸害的总根源）","knowledgePoint":"革命首要对象","chapter":"新民主主义革命理论","source":{"label":"课1 p40/p51"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bdbf83ae93","lessonId":"mzt02","question":"新民主主义革命的动力包括哪些阶级？哪个是领导力量和最基本动力，哪个是主力军？","answer":"无产阶级（领导·最基本动力）、农民（主力军）、城市小资产阶级、民族资产阶级","knowledgePoint":"革命动力","chapter":"新民主主义革命理论","source":{"label":"课1 p61-63"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"663dd8c806","lessonId":"mzt02","question":"中国革命的中心问题，也是新民主主义革命理论的核心问题，指哪个阶级的什么权利？","answer":"无产阶级的领导权","knowledgePoint":"中国革命的中心问题 / 理论核心问题","chapter":"新民主主义革命理论","source":{"label":"课1 p70"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0cdbffebe5","lessonId":"mzt02","question":"区分新民主主义革命和旧民主主义革命的根本标志是什么？","answer":"领导权在无产阶级手中还是资产阶级手中","knowledgePoint":"区别新旧民主主义革命的根本标志","chapter":"新民主主义革命理论","source":{"label":"课1 p70/p74"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5ccfb58387","lessonId":"mzt02","question":"新民主主义革命在革命性质上属于哪一类型？其发展前途是什么？","answer":"新式的特殊的资产阶级民主主义革命；前途社会主义","knowledgePoint":"革命性质与前途","chapter":"新民主主义革命理论","source":{"label":"课1 p75-76"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8ecd50f990","lessonId":"mzt02","question":"新民主主义的政治纲领规定了怎样的国体和政体？","answer":"国体＝各革命阶级联合专政；政体＝民主集中制的人民代表大会制度","knowledgePoint":"政治纲领","chapter":"新民主主义革命理论","source":{"label":"课2 p4-5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"76b1c3f317","lessonId":"mzt02","question":"新民主主义经济纲领的三项内容是什么？哪项是主要内容，哪项具有双重性质，哪项极具特色？","answer":"没收土地归农民（主要内容）、没收官僚资本（双重性质）、保护民族工商业（极具特色）","knowledgePoint":"经济纲领三条","chapter":"新民主主义革命理论","source":{"label":"课2 p8-10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3d8ea6a380","lessonId":"mzt02","question":"新民主主义文化由谁领导、服务谁、反对什么？用哪三个形容词概括其性质？","answer":"无产阶级领导的人民大众的反帝反封建的文化＝民族的科学的大众的文化","knowledgePoint":"文化纲领","chapter":"新民主主义革命理论","source":{"label":"课2 p13"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"89d91b6240","lessonId":"mzt02","question":"新民主主义革命选择了怎样的道路？用农村、城市和政权三个要素表述。","answer":"农村包围城市、武装夺取政权","knowledgePoint":"革命道路","chapter":"新民主主义革命理论","source":{"label":"课2 p20"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"599ecd5e55","lessonId":"mzt02","question":"农村包围城市、武装夺取政权道路包含哪三项内容？分别指出基本内容、主要形式和战略阵地。","answer":"土地革命（基本内容）、武装斗争（主要形式）、根据地建设（战略阵地）","knowledgePoint":"道路三内容","chapter":"新民主主义革命理论","source":{"label":"课2 p33"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"682cd9f76a","lessonId":"mzt02","question":"《〈共产党人〉发刊词》总结的中国革命三大法宝分别是什么？","answer":"统一战线、武装斗争、党的建设（《〈共产党人〉发刊词》）","knowledgePoint":"三大法宝","chapter":"新民主主义革命理论","source":{"label":"课2 p36"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2c93e17e75","lessonId":"mzt02","question":"在统一战线、武装斗争、党的建设三大法宝中，哪一项居于核心地位？","answer":"党的建设","knowledgePoint":"三大法宝的核心","chapter":"新民主主义革命理论","source":{"label":"课2 p67"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"670abb074e","lessonId":"mzt02","question":"中国共产党在革命实践中形成的三大优良作风分别是什么？","answer":"理论联系实际、密切联系群众、批评与自我批评","knowledgePoint":"三大优良作风","chapter":"新民主主义革命理论","source":{"label":"课2 p59"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"90c6a55689","lessonId":"mzt03","question":"我国从新民主主义到社会主义的过渡时期，以哪两个年份和事件为起止标志？","answer":"1949 建国 → 1956 三大改造基本完成","knowledgePoint":"过渡时期起止","chapter":"社会主义改造理论","source":{"label":"课1 p11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4996d1d20e","lessonId":"mzt03","question":"新民主主义社会是否是独立的社会形态？它具有何种过渡性质、属于什么体系？","answer":"过渡性社会形态，非独立社会形态，属于社会主义体系","knowledgePoint":"新民主主义社会性质","chapter":"社会主义改造理论","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"02bfdeb451","lessonId":"mzt03","question":"新民主主义社会的三种主要经济成分分别是什么？","answer":"社会主义经济、个体经济、资本主义经济","knowledgePoint":"主要经济成分（3 种）","chapter":"社会主义改造理论","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"32776b4842","lessonId":"mzt03","question":"土地改革完成以后，我国国内的主要矛盾是哪两个阶级之间的矛盾？","answer":"工人阶级和资产阶级的矛盾","knowledgePoint":"主要矛盾（土改完成后）","chapter":"社会主义改造理论","source":{"label":"课1 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9396427fa8","lessonId":"mzt03","question":"党在过渡时期的总路线于何年何月正式提出，又于何月得到完整表述？","answer":"1953 年 6 月（12 月完整表述）","knowledgePoint":"总路线正式提出","chapter":"社会主义改造理论","source":{"label":"课1 p26"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c73c7bb1e3","lessonId":"mzt03","question":"过渡时期总路线的“一化三改”分别指什么？哪一部分是主体，哪些是两翼？","answer":"一化=社会主义工业化（主体）；三改=农业/手工业/资本主义工商业改造（两翼）","knowledgePoint":"一化三改","chapter":"社会主义改造理论","source":{"label":"课1 p28"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"223806d3a6","lessonId":"mzt03","question":"农业社会主义改造依次经历哪三个步骤？各步骤具有何种社会主义性质？","answer":"互助组（萌芽）→初级社（半社会主义）→高级社（社会主义）","knowledgePoint":"农业改造步骤","chapter":"社会主义改造理论","source":{"label":"课1 p59-60"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a07ec36ea8","lessonId":"mzt03","question":"手工业社会主义改造从小组到合作社，依次经历哪三个组织步骤？","answer":"供销小组→供销合作社→生产合作社","knowledgePoint":"手工业改造步骤","chapter":"社会主义改造理论","source":{"label":"课1 p72-73"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d2d529c755","lessonId":"mzt03","question":"我国对资本主义工商业进行社会主义改造采用什么方法？国家资本主义经历怎样的发展层次？","answer":"和平赎买；国家资本主义（初级→高级）","knowledgePoint":"工商业改造方法","chapter":"社会主义改造理论","source":{"label":"课1 p76-78"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"aaec599863","lessonId":"mzt03","question":"资本主义工商业改造中的“四马分肥”把利润分为哪四部分？资方红利约占多少？","answer":"国家所得税+企业公积金+工人福利费+资方红利（约1/4）","knowledgePoint":"四马分肥","chapter":"社会主义改造理论","source":{"label":"课1 p80"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"83ac1c56a7","lessonId":"mzt03","question":"我国社会主义改造的三条主要历史经验是什么？从工业化与改造的关系、过渡方式和改造方法回答。","answer":"坚持社会主义工业化建设与社会主义改造同时并举；采取积极引导、逐步过渡的方式；用和平方法进行改造。","knowledgePoint":"历史经验（3 条）","chapter":"社会主义改造理论","source":{"label":"课3 p2-4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"30f1e853b4","lessonId":"mzt03","question":"1956年底社会主义改造基本完成，如何标志着社会主义基本制度在经济领域的确立？","answer":"1956年底社会主义改造基本完成，社会主义公有制成为我国社会的经济基础，社会主义基本制度在我国确立。","knowledgePoint":"基本制度确立标志","chapter":"社会主义改造理论","source":{"label":"课3 p17"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"30f1e853b4-constitution","lessonId":"mzt03","question":"1954年通过的哪部法律为我国社会主义政治制度提供了宪法依据？","answer":"《中华人民共和国宪法》。","knowledgePoint":"1954年通过的哪部法律为我国社会主义政治制度提供了宪法依据","chapter":"社会主义改造理论","source":{"label":"课3 p17"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"30f1e853b4"},{"schemaVersion":1,"id":"5d9a3faa8e","lessonId":"mzt03","question":"我国社会主义政治制度中，人民代表大会制度属于哪个层级？多党合作和政治协商、民族区域自治属于哪个层级？","answer":"人大制度（根本）；多党合作政治协商、民族区域自治（基本）","knowledgePoint":"根本/基本政治制度","chapter":"社会主义改造理论","source":{"label":"课3 p17"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"91c6d37adc","lessonId":"mzt04","question":"《论十大关系》提出于何时？它以谁为鉴，在探索社会主义建设道路上具有什么标志性意义？","answer":"1956 年 4 月；以苏为鉴；**标志着党探索中国社会主义建设道路的良好开端**","knowledgePoint":"《论十大关系》","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p9/p31"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d42c3e169d","lessonId":"mzt04","question":"《论十大关系》提出了怎样的社会主义建设基本方针？需要调动哪些方面的积极因素？","answer":"把党内党外、国内国外的一切积极因素，直接的、间接的积极因素，全部调动起来，为社会主义建设服务","knowledgePoint":"《论十大关系》基本方针","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p10/p36"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"86ce71f32f","lessonId":"mzt04","question":"社会主义建设初步探索中的“第二次结合”要求把什么同中国实际相结合，探索什么道路？","answer":"马克思列宁主义基本原理同中国具体实际相结合，找出在中国怎样建设社会主义的道路","knowledgePoint":"第二次结合","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p8-9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"65e0c4505e","lessonId":"mzt04","question":"判断政治言论和行动是非的六条标准中，最重要的两条是什么？","answer":"社会主义道路和党的领导","knowledgePoint":"六条标准中最重要的两条","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p13"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2e08bc3b54","lessonId":"mzt04","question":"毛泽东在哪一年哪月、哪篇著作中系统论述了社会主义社会矛盾问题？","answer":"1957 年 2 月《关于正确处理人民内部矛盾的问题》","knowledgePoint":"系统论述社会矛盾的著作","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p38/p51"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"13b7fd3b2c","lessonId":"mzt04","question":"社会主义社会的基本矛盾是哪两对？其性质、相互关系和解决途径有什么特点？","answer":"生产关系和生产力、上层建筑和经济基础之间的矛盾；非对抗性；又相适应又相矛盾；经社会主义制度本身不断解决","knowledgePoint":"社会主义社会基本矛盾","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p39"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5c8ce0ea68","lessonId":"mzt04","question":"党的八大怎样概括我国人民的需要与当时经济文化状况之间的主要矛盾？","answer":"人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾","knowledgePoint":"八大主要矛盾","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p40"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"df863704e6","lessonId":"mzt04","question":"社会主义社会的敌我矛盾与人民内部矛盾，性质和处理方法分别是什么？","answer":"敌我矛盾（对抗性）—专政方法；人民内部矛盾（非对抗性）—民主方法","knowledgePoint":"两类矛盾与方法","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p43"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e4ee6d9637","lessonId":"mzt04","question":"正确处理人民内部矛盾的总方针是什么？","answer":"用民主的方法解决人民内部矛盾","knowledgePoint":"处理人民内部矛盾总方针","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p44"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2790d4d839","lessonId":"mzt04","question":"毛泽东认为社会主义国家政治生活的主题是什么？","answer":"正确处理人民内部矛盾的问题","knowledgePoint":"社会主义国家政治生活的主题","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p45"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"68b70fe783","lessonId":"mzt04","question":"社会主义建设初步探索中，中国工业化道路主要涉及哪几个产业的发展关系？","answer":"主要指重工业和轻工业、农业的发展关系问题","knowledgePoint":"中国工业化道路的问题","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p63"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"58b013df4f","lessonId":"mzt04","question":"社会主义建设初步探索时期，发展国民经济的总方针如何规定基础、主导及发展顺序？","answer":"以农业为基础，以工业为主导，以农轻重为序","knowledgePoint":"发展国民经济总方针","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p63"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"dc60b04a79","lessonId":"mzt04","question":"工业发展“两条腿走路”方针要求哪四对工业布局或企业类型同时并举？","answer":"重工业和轻工业、中央工业和地方工业、沿海工业和内地工业、大型企业和中小型企业同时并举","knowledgePoint":"两条腿走路","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p63/p71"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8e12a8de55","lessonId":"mzt04","question":"毛泽东提出的“两参一改三结合”中，两参、一改、三结合各指什么？","answer":"干部参加劳动、工人参加管理、改革不合理的规章制度、工人群众+领导干部+技术人员三结合（毛泽东）","knowledgePoint":"两参一改三结合","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p65/p75"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8b6fc509b7","lessonId":"mzt04","question":"陈云提出的“三个主体、三个补充”，在经营、生产和市场三个方面分别如何对应？","answer":"陈云：国家/集体经营与个体经营、计划生产与自由生产、国家市场与国家领导的自由市场","knowledgePoint":"三个主体三个补充","chapter":"社会主义建设道路初步探索","source":{"label":"课1 p64/p73"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3df0d1c2aa","lessonId":"mzt04","question":"毛泽东把社会主义发展划分为哪两个阶段？哪一阶段需要更长时间？","answer":"不发达的社会主义 → 比较发达的社会主义（后一阶段需要更长时间）","knowledgePoint":"社会主义发展阶段","chapter":"社会主义建设道路初步探索","source":{"label":"课2 p3"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bcf8bdea46","lessonId":"mzt04","question":"从1954年到1964年底，“四个现代化”构想经历了哪些提出、补充和正式宣布的节点？","answer":"1954 周恩来首提构想 → 1957 毛泽东加科学文化 → 1959 加国防现代化形成完整提法 → 1964 年底正式宣布","knowle 073c","lessonId":"mzt06","question":"社会主义初级阶段基本路线在哪次党代会上提出？它的简明概括是什么？","answer":"党的十三大；简明概括\"一个中心、两个基本点\"","knowledgePoint":"基本路线提出","chapter":"邓小平理论","source":{"label":"课1 p56/p59"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4060a754a2","lessonId":"mzt06","question":"党的基本路线中，兴国之要、立国之本、强国之路分别对应什么？","answer":"以经济建设为中心 / 四项基本原则 / 改革开放","knowledgePoint":"兴国之要/立国之本/强国之路","chapter":"邓小平理论","source":{"label":"课1 p59-60"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b4192747ee","lessonId":"mzt06","question":"邓小平怎样概括社会主义的根本任务？哪句关于发展的论断体现这一要求？","answer":"发展生产力；\"发展才是硬道理\"","knowledgePoint":"社会主义根本任务","chapter":"邓小平理论","source":{"label":"课1 p61-63"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"af8d3d1928","lessonId":"mzt06","question":"“科学技术是第一生产力”于何年何月提出，又在哪一重要谈话中得到再次明确？","answer":"1988.9 提出，南方谈话再次明确","knowledgePoint":"\"科学技术是第一生产力\"","chapter":"邓小平理论","source":{"label":"课1 p64"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"512c3564cf","lessonId":"mzt06","question":"邓小平“三步走”发展战略中，1990年、2000年、21世纪中叶各要达到什么目标？","answer":"1990 温饱 → 2000 小康 → 21 世纪中叶基本实现现代化","knowledgePoint":"\"三步走\"目标","chapter":"邓小平理论","source":{"label":"课1 p106"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5d1300db0b","lessonId":"mzt06","question":"邓小平何时会见哪位外国领导人时提出“小康之家”？当时怎样称呼我国的现代化？","answer":"1979.12 会见大平正芳，\"中国式的现代化\"\"小康之家\"","knowledgePoint":"\"小康\"概念来源","chapter":"邓小平理论","source":{"label":"课1 p65"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1e3d14275d","lessonId":"mzt06","question":"邓小平提出的经济发展三个战略重点分别是什么？","answer":"农业；能源和交通；教育和科学","knowledgePoint":"三个战略重点","chapter":"邓小平理论","source":{"label":"课1 p67"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a8c185ca32","lessonId":"mzt06","question":"邓小平怎样评价改革的革命性质？改革与社会主义制度是什么关系？","answer":"中国的第二次革命；社会主义制度的自我完善和发展","knowledgePoint":"改革的性质","chapter":"邓小平理论","source":{"label":"课1 p70"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"03873e771b","lessonId":"mzt06","question":"判断改革得失的“三个有利于”标准分别考察什么？哪项是首要、最根本的标准？","answer":"生产力（首要最根本）/综合国力/人民生活水平","knowledgePoint":"\"三个有利于\"标准","chapter":"邓小平理论","source":{"label":"课1 p71"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9f6b77a230","lessonId":"mzt06","question":"哪一谈话标志着社会主义市场经济理论的形成？哪次党代会确立了相应经济体制改革目标？","answer":"1992 南方谈话；十四大确立经济体制改革目标","knowledgePoint":"市场经济理论形成标志","chapter":"邓小平理论","source":{"label":"课1 p77/p119"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e20688544a","lessonId":"mzt06","question":"“一国两制”构想的核心是什么？","answer":"坚持一个中国","knowledgePoint":"\"一国两制\"的核心","chapter":"邓小平理论","source":{"label":"课2 p12"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c901701cd6","lessonId":"mzt06","question":"邓小平1985年对时代主题作出了什么判断？哪次党代会确认了这一判断？","answer":"和平与发展（1985 邓小平提出，1987 十三大确认）","knowledgePoint":"时代主题","chapter":"邓小平理论","source":{"label":"课2 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c8db79e1d7","lessonId":"mzt06","question":"邓小平理论的历史地位体现在哪三个方面？分别说明它与既有理论、理论体系和现代化建设的关系。","answer":"邓小平理论是马克思列宁主义、毛泽东思想的继承和发展；是中国特色社会主义理论体系的开篇之作；是改革开放和社会主义现代化建设的科学指南。","knowledgePoint":"历史地位（3 条）","chapter":"邓小平理论","source":{"label":"课2 p47-50"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6ebd0973a9","lessonId":"mzt07","question":"“三个代表”重要思想要求中国共产党始终代表哪三个方面？","answer":"始终代表中国先进生产力的发展要求、先进文化的前进方向、最广大人民的根本利益","knowledgePoint":"集中概括","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p23"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"59381304c3","lessonId":"mzt07","question":"“三个代表”的三个方面为何是统一整体？说明生产力、人民群众和人民根本利益在其中的关系。","answer":"统一的整体：生产力是基础条件；人民群众是创造主体、根本力量；归根到底为实现人民根本利益","knowledgePoint":"三者关系","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p23"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5502731c57","lessonId":"mzt07","question":"贯彻“三个代表”重要思想，关键、核心、本质各是什么？","answer":"关键在坚持与时俱进，核心在坚持党的先进性，本质在坚持执政为民","knowledgePoint":"贯彻要求","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p23"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"edcd65951e","lessonId":"mzt07","question":"“三个代表”重要思想对党的建设有何根本定位？用“立党、执政、力量”三个维度回答。","answer":"立党之本、执政之基、力量之源","knowledgePoint":"定位","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p24；课2 p34"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"472a5a6488","lessonId":"mzt07","question":"“三个代表”重要思想把什么作为党执政兴国的第一要务？","answer":"发展是党执政兴国的第一要务。","knowledgePoint":"第一要务","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p47/p49"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"12600326a5","lessonId":"mzt07","question":"改革、发展、稳定三者关系中，哪一个是动力、目的和前提？","answer":"改革是动力，发展是目的，稳定是前提","knowledgePoint":"改革发展稳定","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p50"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b762f2c995","lessonId":"mzt07","question":"社会主义市场经济体制经历了哪次会议确立目标、哪次全会勾画框架、何时初步建立三个节点？","answer":"党的十四大确立；十四届三中全会勾画蓝图和基本框架；20 世纪末初步建立","knowledgePoint":"市场经济体制目标","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p53"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"7c812800d8","lessonId":"mzt07","question":"“社会主义市场经济”这一表述中，哪几个字点明了市场经济的性质？","answer":"“社会主义”几个字点明市场经济的性质","knowledgePoint":"画龙点睛","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p55/p75"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"177d6fe161","lessonId":"mzt07","question":"社会主义市场经济宏观调控的四项目标分别是什么？","answer":"促进经济增长、增加就业、稳定物价、保持国际收支平衡","knowledgePoint":"宏观调控目标","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p56"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e26e16a42e","lessonId":"mzt07","question":"20世纪末我国达到的总体小康具有哪三个不足或特点？","answer":"低水平的、不全面的、不平衡的","knowledgePoint":"总体小康特征","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p58"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b3d269a296","lessonId":"mzt07","question":"党的十六大提出在什么时期全面建设小康社会？目标覆盖多少人口、追求什么水平？","answer":"党的十六大提出在本世纪头二十年，全面建设惠及十几亿人口的更高水平的小康社会。","knowledgePoint":"全面建设小康社会","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p59"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"80622be764","lessonId":"mzt07","question":"发展社会主义政治文明，党的领导、人民当家作主、依法治国各处于什么地位？","answer":"党的领导是根本保证、人民当家作主是本质要求、依法治国是基本方略","knowledgePoint":"政治文明三者统一","chapter":"\"三个代表\"重要思想","source":{"label":"课1 p61"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b549a918e2","lessonId":"mzt07","question":"中国加入世界贸易组织的决定于何时、在哪次会议通过？中国何时正式加入？","answer":"2001年11月多哈会议通过中国加入世界贸易组织的决定，同年12月中国正式加入。","knowledgePoint":"加入世贸组织","chapter":"\"三个代表\"重要思想","source":{"label":"课2 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b549a918e2-principles","lessonId":"mzt07","question":"在中国加入世界贸易组织的谈判中，江泽民阐明了哪三条原则？","answer":"①中国加入世贸组织是中国发展的需要，世贸组织也需要中国；②中国只能以发展中国家的条件加入；③权利和义务必须平衡，不接受超出中国承受能力的要价。","knowledgePoint":"加入世贸组织：principles","chapter":"\"三个代表\"重要思想","source":{"label":"课2 p5"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"b549a918e2"},{"schemaVersion":1,"id":"4efcc2fa82","lessonId":"mzt07","question":"加强和改进党的建设的核心问题是什么？党的最大政治优势和执政后的最大危险分别是什么？","answer":"保持党同人民群众的血肉联系；最大政治优势＝密切联系群众，最大危险＝脱离群众","knowledgePoint":"党建核心问题","chapter":"\"三个代表\"重要思想","source":{"label":"课2 p16"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"fbfcb622c1","lessonId":"mzt07","question":"“治国必先……，治党务必……”这句关于从严治党的要求应怎样补全？","answer":"治国必先治党，治党务必从严","knowledgePoint":"从严治党","chapter":"\"三个代表\"重要思想","source":{"label":"课2 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c87f1133ca","lessonId":"mzt07","question":"“三个代表”重要思想的历史地位体现在哪两个方面？从理论体系发展及党建和事业实践回答。","answer":"中国特色社会主义理论体系的丰富发展；加强和改进党的建设、推进中国特色社会主义事业的强大理论武器","knowledgePoint":"历史地位","chapter":"\"三个代表\"重要思想","source":{"label":"课2 p32/p35"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d7981fdfed","lessonId":"mzt08","question":"科学发展观的第一要义、核心立场、基本要求、根本方法分别是什么？","answer":"第一要义发展、核心立场以人为本、基本要求全面协调可持续、根本方法统筹兼顾","knowledgePoint":"科学内涵四要素","chapter":"科学发展观","source":{"label":"课1 p27"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"12c9d52af6","lessonId":"mzt08","question":"科学发展观围绕发展回答了哪四个基本问题？","answer":"为什么发展／发展为了谁和依靠谁／实现什么样的发展／怎样发展","knowledgePoint":"四个回答","chapter":"科学发展观","source":{"label":"课1 p27"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ad2c314748","lessonId":"mzt08","question":"党的十六大把哪一时期判断为我国发展的重要战略机遇期？","answer":"党的十六大：21世纪头二十年","knowledgePoint":"重要战略机遇期","chapter":"科学发展观","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a59b25fa5d","lessonId":"mzt08","question":"从党的十六大到十八大，小康社会目标由“全面建设”变为什么？完成时间指向哪一年？","answer":"十六大\"全面建设\"→十八大：到2020年全面建成","knowledgePoint":"全面建成小康社会","chapter":"科学发展观","source":{"label":"课1 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"200eae476e","lessonId":"mzt08","question":"科学发展观“以人为本”中的“人”包括哪些人，以哪些劳动者为主体？","answer":"以工人、农民、知识分子等劳动者为主体，包括社会各阶层人民在内的中国最广大人民","knowledgePoint":"以人为本的\"人\"","chapter":"科学发展观","source":{"label":"课1 p11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"70225a385a","lessonId":"mzt08","question":"判断马克思主义政党与非马克思主义政党的分水岭和试金石，主要看怎样对待谁、依靠谁、为了谁的问题？","answer":"相信谁、依靠谁、为了谁，是否始终站在最广大人民立场上","knowledgePoint":"分水岭与试金石","chapter":"科学发展观","source":{"label":"课1 p13"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"43ea52870a","lessonId":"mzt08","question":"科学发展观中，“全面”“协调”“可持续”分别强调发展的哪两种特性？","answer":"全面性整体性／协调性均衡性／持久性连续性","knowledgePoint":"全面／协调／可持续","chapter":"科学发展观","source":{"label":"课1 p19"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b82a4003f1","lessonId":"mzt08","question":"“五位一体”建设中，经济、政治、文化、社会、生态文明建设分别发挥什么作用？","answer":"经济中心和基础、政治方向和保障、文化灵魂和血脉、社会支撑和归宿、生态根基和条件","knowledgePoint":"五位一体定位","chapter":"科学发展观","source":{"label":"课1 p19"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"51799d41b1","lessonId":"mzt08","question":"“五个统筹”在哪次全会上提出？哪次党代会又扩展了三个统筹？","answer":"党的十六届三中全会提出；十七大再扩展三个统筹","knowledgePoint":"五个统筹","chapter":"科学发展观","source":{"label":"课1 p22"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"93a290a7b6","lessonId":"mzt08","question":"科学发展观指导下，我国经济社会发展以什么为主题、以什么为主线？","answer":"以科学发展为主题、以加快转变经济发展方式为主线","knowledgePoint":"转方式主线","chapter":"科学发展观","source":{"label":"课2 p3"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"64a86931ea","lessonId":"mzt08","question":"加快转变经济发展方式的关键是什么？其中经济体制改革的核心问题是什么？","answer":"全面深化经济体制改革（核心问题：政府和市场的关系）","knowledgePoint":"转方式的关键","chapter":"科学发展观","source":{"label":"课2 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"df7d801fea","lessonId":"mzt08","question":"解决农业、农村、农民问题的根本途径是什么？","answer":"推动城乡发展一体化","knowledgePoint":"解决\"三农\"问题的根本途径","chapter":"科学发展观","source":{"label":"课2 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f096e045a7","lessonId":"mzt08","question":"人民民主对于社会主义具有什么地位？社会主义民主政治的本质和核心是什么？","answer":"是社会主义的生命；民主政治的本质和核心是人民当家作主","knowledgePoint":"人民民主","chapter":"科学发展观","source":{"label":"课2 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d7743fd1a9","lessonId":"mzt08","question":"依法治国和依法执政首先分别要求坚持什么？","answer":"依法治国首先要依宪治国，依法执政首先要依宪执政","knowledgePoint":"依宪治国","chapter":"科学发展观","source":{"label":"课2 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9197295764","lessonId":"mzt08","question":"社会主义核心价值体系在国家发展中被称为什么？","answer":"社会主义核心价值体系是兴国之魂。","knowledgePoint":"社会主义核心价值体系","chapter":"科学发展观","source":{"label":"课2 p12"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9197295764-components","lessonId":"mzt08","question":"社会主义核心价值体系的四项基本内容分别是什么？","answer":"马克思主义指导思想、中国特色社会主义共同理想、以爱国主义为核心的民族精神和以改革创新为核心的时代精神、社会主义荣辱观。","knowledgePoint":"社会主义核心价值体系的四项基本内容分别是什么","chapter":"科学发展观","source":{"label":"课2 p12"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"9197295764"},{"schemaVersion":1,"id":"c6866e002d","lessonId":"mzt08","question":"构建社会主义和谐社会的六项总要求分别是什么？","answer":"民主法治、公平正义、诚信友爱、充满活力、安定有序、人与自然和谐相处","knowledgePoint":"和谐社会总要求（6条）","chapter":"科学发展观","source":{"label":"课2 p16"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"38a2458422","lessonId":"mzt08","question":"保障和改善民生的“五有”分别涉及教育、劳动、医疗、养老和住房的什么目标？","answer":"学有所教、劳有所得、病有所医、老有所养、住有所居","knowledgePoint":"民生\"五有\"","chapter":"科学发展观","source":{"label":"课2 p17"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"008a61f1fd","lessonId":"mzt08","question":"生态文明建设应树立哪三种对待自然的理念，并以建设什么样的中国为目标？","answer":"尊重自然、顺应自然、保护自然；建设美丽中国","knowledgePoint":"生态文明理念","chapter":"科学发展观","source":{"label":"课2 p19"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3cb02be6ba","lessonId":"mzt08","question":"科学发展观指导下，党的建设主线包括哪三方面建设？","answer":"执政能力建设、先进性和纯洁性建设","knowledgePoint":"党建主线","chapter":"科学发展观","source":{"label":"课2 p22"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"78e6f44142","lessonId":"mzt08","question":"党面临的“四大考验”和“四大危险”分别是什么？请分两组列出。","answer":"执政·改革开放·市场经济·外部环境／精神懈怠·能力不足·脱离群众·消极腐败","knowledgePoint":"四大考验／四大危险","chapter":"科学发展观","source":{"label":"课2 p22"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"efffbd2f22","lessonId":"mzt08","question":"科学发展观最鲜明的精神实质包括哪四个方面？","answer":"解放思想、实事求是、与时俱进、求真务实","knowledgePoint":"精神实质","chapter":"科学发展观","source":{"label":"课3 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"dfdcea3516","lessonId":"mzt08","question":"科学发展观的历史地位体现在哪两个方面？从中国特色社会主义理论体系发展和现代化实践回答。","answer":"中特理论体系在新世纪新阶段的接续发展；全面建设小康社会、加快推进社会主义现代化的根本指针","knowledgePoint":"历史地位（2条）","chapter":"科学发展观","source":{"label":"课3 p3/p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"26c97567a9","lessonId":"xg00","question":"习近平新时代中国特色社会主义思想创立的五方面时代背景分别是什么？","answer":"世界百年未有之大变局加速演进 / 中华民族伟大复兴进入关键时期 / 中国式现代化全面推进拓展 / 科学社会主义在 21 世纪的中国焕发新的蓬勃生机 / 中国共产党自我革命开辟新的境界","knowledgePoint":"创立的时代背景（5 个）","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p5-7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"852102c5b4","lessonId":"xg00","question":"习近平新时代中国特色社会主义思想的创立，在马克思主义中国化时代化进程中实现了怎样的理论发展？","answer":"实现了马克思主义中国化时代化新的飞跃","knowledgePoint":"创立飞跃","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"94c147cd58","lessonId":"xg00","question":"“两个结合”要求把马克思主义基本原理分别同哪两个方面相结合？","answer":"同中国具体实际相结合 + 同中华优秀传统文化相结合","knowledgePoint":"\"两个结合\"内容","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"65963efca0","lessonId":"xg00","question":"“两个结合”在探索中国道路中形成了什么性质的认识？对于取得成功具有什么地位？","answer":"规律性认识，取得成功的最大法宝","knowledgePoint":"\"两个结合\"地位","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b944bc3c6c","lessonId":"xg00","question":"谁明确提出把马克思主义基本原理同中华优秀传统文化相结合？“第二个结合”被评价为怎样的思想解放？","answer":"习近平明确提出，是又一次的思想解放","knowledgePoint":"\"第二个结合\"提出","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b4070be7f9","lessonId":"xg00","question":"推进实践基础上的理论创新，要不断回答哪“四个之问”？","answer":"中国之问、世界之问、人民之问、时代之问","knowledgePoint":"\"四个之问\"","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ae27d2785e","lessonId":"xg00","question":"习近平新时代中国特色社会主义思想回答了哪三大时代课题？分别完整说出“什么样”和“怎样”两方面。","answer":"坚持和发展什么样的中国特色社会主义、怎样坚持和发展中国特色社会主义；建设什么样的社会主义现代化强国、怎样建设社会主义现代化强国；建设什么样的长期执政的马克思主义政党、怎样建设长期执政的马克思主义政党。","knowledgePoint":"三大时代课题","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p12"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b31177ac5d","lessonId":"xg00","question":"“十个明确”在习近平新时代中国特色社会主义思想科学体系中属于什么内容，发挥什么作用？","answer":"主体内容，四梁八柱，统摄作用","knowledgePoint":"\"十个明确\"定位","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c123449c9c","lessonId":"xg00","question":"“十四个坚持”被概括为新时代坚持和发展中国特色社会主义的什么方略？","answer":"基本方略","knowledgePoint":"\"十四个坚持\"定位","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p15"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d0543d65ad","lessonId":"xg00","question":"党的二十大提出的“六个必须坚持”分别是什么？它们体现了习近平新时代中国特色社会主义思想的哪两个方面？","answer":"人民至上、自信自立、守正创新、问题导向、系统观念、胸怀天下（二十大，世界观方法论）","knowledgePoint":"\"六个必须坚持\"","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p12/p17"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8579d2f4b9","lessonId":"xg00","question":"习近平新时代中国特色社会主义思想何时、分别经哪次会议写入党章和载入宪法？","answer":"2017.10 十九大（党章）；2018.3 十三届全国人大一次会议（宪法）","knowledgePoint":"写入党章 / 载入宪法","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p19"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"dc9fcfdd22","lessonId":"xg00","question":"习近平新时代中国特色社会主义思想的历史地位如何表述？从马克思主义发展、中华文化精神、理论飞跃和行动遵循四方面回答。","answer":"当代中国马克思主义、二十一世纪马克思主义；中华文化和中国精神的时代精华；马克思主义中国化时代化新的飞跃；行动指南、根本遵循","knowledgePoint":"历史地位四句","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p19/p22"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5ef8571a50","lessonId":"xg00","question":"习近平新时代中国特色社会主义思想深化了对哪三个领域规律的认识？","answer":"共产党执政规律、社会主义建设规律、人类社会发展规律","knowledgePoint":"三个规律","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p20"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1b73e5fdcb","lessonId":"xg00","question":"推进马克思主义中国化时代化所说的“魂脉”和“根脉”分别指什么？二者应形成怎样的关系？","answer":"马克思主义（魂脉）与中华优秀传统文化（根脉）内在贯通、相互成就","knowledgePoint":"魂脉与根脉","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p21"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"984a4ccdf3","lessonId":"xg00","question":"“两个确立”分别确立了谁的什么地位和哪一思想的什么地位？","answer":"确立习近平同志党中央的核心、全党的核心地位 + 确立习近平新时代中国特色社会主义思想的指导地位","knowledgePoint":"\"两个确立\"内涵","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p23"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f0a0068546","lessonId":"xg00","question":"“两个确立”的意义怎样概括？从重大政治成果、决定性意义和应对不确定性三个角度回答。","answer":"重大政治成果；决定性意义；最大确定性、最大底气、最大保证","knowledgePoint":"\"两个确立\"意义","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p23-24"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"493e40fc92","lessonId":"xg00","question":"《习近平新时代中国特色社会主义思想概论》教材由哪些首尾部分和多少章组成？","answer":"导论、结语和 17 章","knowledgePoint":"教材结构","chapter":"习近平新时代中国特色社会主义思想","source":{"label":"课1 p3/p27"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"acc07e879d","lessonId":"xg01","question":"关于中国发展道路的“三个只有”，分别怎样回答救中国、发展中国和实现民族复兴的问题？","answer":"只有社会主义才能救中国，只有社会主义才能发展中国，只有坚持和发展中国特色社会主义才能实现中华民族伟大复兴。","knowledgePoint":"三个\"只有\"","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"196dbbe1d7","lessonId":"xg01","question":"近代以来中华民族面临的两大历史任务分别是什么？","answer":"争取民族独立、人民解放；实现国家富强、人民幸福","knowledgePoint":"两大历史任务","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"58c91b8318","lessonId":"xg01","question":"中国特色社会主义从开创到进入新时代，邓小平、江泽民、胡锦涛、习近平各作出了怎样的发展贡献？","answer":"邓小平开创；江泽民推向 21 世纪；胡锦涛新形势下坚持和发展；习近平开创新时代","knowledgePoint":"开创/推进/发展","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p7-8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c83f1f3eed","lessonId":"xg01","question":"怎样认识改革开放前后两个历史时期的关系？回答联系、区别、实践本质和评价原则。","answer":"相互联系又有重大区别，本质上都是社会主义建设的实践探索，不能相互否定","knowledgePoint":"两个历史时期","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f11339b1d4","lessonId":"xg01","question":"中国特色社会主义的“六个得来”分别对应哪六段历史及其时间跨度？","answer":"40 多年改革开放 / 70 多年新中国 / 100 多年社会革命 / 180 多年由衰到盛 / 500 多年世界社会主义 / 5000 多年中华文明","knowledgePoint":"六个得来","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"237e728742","lessonId":"xg01","question":"中国特色社会主义是科学社会主义与中国社会发展哪两种逻辑的辩证统一？","answer":"科学社会主义理论逻辑和中国社会发展历史逻辑的辩证统一","knowledgePoint":"中特社的定位","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"cd0c28c19b","lessonId":"xg01","question":"中国特色社会主义不是哪“四个版”？分别说明所指的历史文化、经典作家设想、其他社会主义国家和国外现代化模式。","answer":"不是我国历史文化的母版，不是马克思主义经典作家设想的模板，不是其他国家社会主义实践的再版，也不是国外现代化发展的翻版。","knowledgePoint":"四个\"版\"","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p13"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f3409a5e82","lessonId":"xg01","question":"改革开放以来取得一切成绩和进步的根本原因，体现在道路、理论体系、制度和文化哪四个方面？","answer":"开辟道路、形成理论体系、确立制度、发展文化","knowledgePoint":"取得成绩的根本原因","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f41eec13df","lessonId":"xg01","question":"中国特色社会主义道路、理论体系、制度、文化分别承担实现途径、行动指南、根本保障、精神力量中的哪一作用？","answer":"道路=实现途径；理论体系=行动指南；制度=根本保障；文化=精神力量","knowledgePoint":"四者定位","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"dc43270f3f","lessonId":"xg01","question":"中国特色社会主义最本质的特征、制度的最大优势，共同指向什么？","answer":"中国共产党的领导","knowledgePoint":"最本质特征/最大优势","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课1 p18"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1cc97e907b","lessonId":"xg01","question":"中国特色社会主义进入新时代的三个“意味着”分别涉及民族复兴、科学社会主义和发展中国家现代化的什么变化？","answer":"站起来富起来到强起来 / 科学社会主义焕发生机 / 拓展发展中国家走向现代化途径","knowledgePoint":"新时代三个\"意味着\"","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课2 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8a8a3c9869","lessonId":"xg01","question":"新时代我国社会主要矛盾的两方面分别是什么？","answer":"人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾","knowledgePoint":"新时代社会主要矛盾","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课2 p8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"75a13fabe5","lessonId":"xg01","question":"我国社会主要矛盾变化以后，基本国情和国际地位有哪些“没有变”？","answer":"初级阶段基本国情没有变；世界最大发展中国家国际地位没有变","knowledgePoint":"两个\"没有变\"","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课2 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f14fbdec39","lessonId":"xg01","question":"新时代十年的伟大变革在哪五个历史领域具有里程碑意义？","answer":"党史、新中国史、改革开放史、社会主义发展史、中华民族发展史","knowledgePoint":"里程碑意义","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课2 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"55f1e696c4","lessonId":"xg01","question":"社会主义初级阶段基本路线被称为国家和人民的哪两条“线”？","answer":"党的基本路线是国家的生命线、人民的幸福线。","knowledgePoint":"基本路线定位","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课3 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9e720f256c","lessonId":"xg01","question":"党的十九大把新时代坚持和发展中国特色社会主义的基本方略概括为什么？","answer":"党的十九大概括的\"十四个坚持\"","knowledgePoint":"基本方略","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课3 p5-6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a7ff70120d","lessonId":"xg01","question":"“四个全面”战略布局包括哪些内容？哪项是战略目标，另外三项是什么性质？","answer":"全面建设社会主义现代化国家（战略目标、引领）+ 全面深化改革、全面依法治国、全面从严治党（三大战略举措）","knowledgePoint":"四个全面","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课3 p8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0ce44e249f","lessonId":"xg01","question":"“中国共产党为什么能，中国特色社会主义为什么好”的根本原因怎样用两个“马克思主义行”表述？","answer":"马克思主义行，中国化时代化的马克思主义行","knowledgePoint":"归根到底","chapter":"新时代坚持和发展中国特色社会主义","source":{"label":"课3 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3badebf46a","lessonId":"xg02","question":"推进中国式现代化从事业创新性和工程复杂性来看，具有怎样的总体定位？","answer":"前无古人的开创性、探索性事业，也是复杂的系统工程","knowledgePoint":"事业总体定位","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p3"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0e9d4ea673","lessonId":"xg02","question":"把推进中国式现代化比作“新的长征”，应怎样认识它的前途和任务？","answer":"前途光明，任重道远","knowledgePoint":"\"新的长征\"","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b79fd578f5","lessonId":"xg02","question":"在全面建设社会主义现代化国家的进程中，中国共产党发挥怎样的主心骨和领航作用？","answer":"全面建设社会主义现代化国家的主心骨和领航者","knowledgePoint":"党的地位","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1c7d5e2c27","lessonId":"xg02","question":"推进中国式现代化必须避免哪两条道路？分别用“老路”和“邪路”表述。","answer":"既不走封闭僵化的老路，也不走改旗易帜的邪路","knowledgePoint":"两条道路警示","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5a37a327dc","lessonId":"xg02","question":"中国式现代化为何被称为造福人民的现代化？说明发展的目的、依靠力量和成果归属。","answer":"中国式现代化是造福人民的现代化；发展为了人民、依靠人民、成果由人民共享","knowledgePoint":"现代化与人民","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2e234715c7","lessonId":"xg02","question":"推进中国式现代化的动力来自哪项涉及改革与开放的战略举措？","answer":"全面深化改革开放","knowledgePoint":"动力所在","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d0b83c9da7","lessonId":"xg02","question":"推进中国式现代化发扬斗争精神，要增强哪三种精神品质，坚持哪三个“不”，并统筹哪两个方面？","answer":"志气、骨气、底气；不信邪、不怕鬼、不怕压；统筹发展和安全","knowledgePoint":"斗争精神关键词","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"82f619e460","lessonId":"xg02","question":"推进中国式现代化需要处理好哪六对重大关系？","answer":"顶层设计与实践探索、战略与策略、守正与创新、效率与公平、活力与秩序、自立自强与对外开放","knowledgePoint":"六对重大关系","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p6-8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5f28844657","lessonId":"xg02","question":"推进中国式现代化制定战略时，应增强战略的哪三种特性？","answer":"前瞻性、全局性、稳定性","knowledgePoint":"战略三性","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f81ed3b8c1","lessonId":"xg02","question":"推进中国式现代化为什么要守正创新？守正和创新分别防止或实现什么？","answer":"守正才能不迷失方向、不犯颠覆性错误；创新才能把握时代、引领时代","knowledgePoint":"守正创新","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"905fd1e7a6","lessonId":"xg02","question":"独立自主对于中华民族精神和立党立国分别具有什么地位？","answer":"中华民族精神之魂，立党立国的重要原则","knowledgePoint":"独立自主","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"60158404d1","lessonId":"xg02","question":"对外开放在我国政策体系中属于什么层级？对这一政策应持何种态度？","answer":"中国的基本国策，任何时候都不能动摇","knowledgePoint":"对外开放","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3aa45e5fd5","lessonId":"xg02","question":"团结奋斗对于党和中国人民的精神标识、创造历史伟业的道路分别具有什么地位？","answer":"党和中国人民最显著的精神标识，创造历史伟业的必由之路","knowledgePoint":"团结奋斗定位","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2e714b6e46","lessonId":"xg02","question":"推进中国式现代化为什么必须持续团结奋斗？从目标、任务和形势三方面回答。","answer":"目标的宏伟性、任务的艰巨性、形势的复杂性","knowledgePoint":"持续团结奋斗三要求","chapter":"以中国式现代化全面推进中华民族伟大复兴","source":{"label":"课1 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"caceac9370","lessonId":"xg03","question":"关于党的领导，最本质特征、制度最大优势、最高政治领导力量和最高政治原则分别是什么？","answer":"最本质特征=党的领导；最大优势=党的领导；最高政治领导力量=党；最高政治原则=坚持党中央集中统一领导","knowledgePoint":"四句核心论断","chapter":"坚持党的全面领导","source":{"label":"课1 p2"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"903c159819","lessonId":"xg03","question":"“什么是中国特色？这就是中国特色”所强调的中国最大的国情是什么？","answer":"中国共产党的领导——\"什么是中国特色？这就是中国特色\"","knowledgePoint":"中国最大的国情","chapter":"坚持党的全面领导","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"08619fb29d","lessonId":"xg03","question":"中国共产党领导人民创造的“两大奇迹”分别是什么？","answer":"经济快速发展和社会长期稳定","knowledgePoint":"两大奇迹","chapter":"坚持党的全面领导","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"19cdd41517","lessonId":"xg03","question":"坚持党的领导与人民当家作主之间是什么关系？党的领导应支持和保证人民实现什么？","answer":"党的领导就是支持和保证人民实现当家作主","knowledgePoint":"党的领导与人民当家作主","chapter":"坚持党的全面领导","source":{"label":"课1 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2281fe741c","lessonId":"xg03","question":"中国特色社会主义制度的最大优势是什么？这一优势在诸多制度优势中起什么作用？","answer":"中国共产党领导，带有统领性的根本优势","knowledgePoint":"制度最大优势","chapter":"坚持党的全面领导","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"21a8600b7e","lessonId":"xg03","question":"中国共产党需要增强哪四种领导能力？哪种能力居于第一位？","answer":"政治领导力（第一位的能力）、思想引领力、群众组织力、社会号召力","knowledgePoint":"四大领导力","chapter":"坚持党的全面领导","source":{"label":"课1 p13"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"245717a00c","lessonId":"xg03","question":"怎样用“党政军民学、东西南北中”这一论断表述党的最高政治领导力量地位？","answer":"党政军民学，东西南北中，党是领导一切的","knowledgePoint":"最高政治领导力量论断","chapter":"坚持党的全面领导","source":{"label":"课2 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"fe473ef93b","lessonId":"xg03","question":"中共中央“五一口号”发布于哪一年？号召召开什么会议、成立什么政府？","answer":"1948 年发布，号召召开政治协商会议、成立民主联合政府","knowledgePoint":"\"五一口号\"","chapter":"坚持党的全面领导","source":{"label":"课2 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"cb7922aa31","lessonId":"xg03","question":"党的领导在对象、内容、过程和方式上体现出哪三种特性？","answer":"全面的、系统的、整体的（对象/内容/过程/方式）","knowledgePoint":"党的领导三特性","chapter":"坚持党的全面领导","source":{"label":"课2 p7-8"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f10abd650f","lessonId":"xg03","question":"党的领导的最高原则是什么？怎样理解“事在四方，要在中央”？","answer":"党中央集中统一领导（事在四方，要在中央）","knowledgePoint":"党的领导最高原则","chapter":"坚持党的全面领导","source":{"label":"课2 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"148540ea23","lessonId":"xg03","question":"党的“四个服从”中，最核心的服从要求是什么？","answer":"全党各个组织和全体党员服从党的全国代表大会和中央委员会","knowledgePoint":"四个服从的核心","chapter":"坚持党的全面领导","source":{"label":"课2 p12"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ddc58751e5","lessonId":"xg03","question":"我国的根本领导制度是什么？它在国家制度体系中具有什么地位？","answer":"党的领导制度（在制度体系中具有统领地位）","knowledgePoint":"根本领导制度","chapter":"坚持党的全面领导","source":{"label":"课3 p3-4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"063cc601ad","lessonId":"xg03","question":"党的领导制度体系六个方面分别是什么，各承担什么定位？","answer":"不忘初心、牢记使命的制度是基础；维护党中央权威和集中统一领导的各项制度体现最高原则；党的全面领导制度是主体内容；为人民执政、靠人民执政的各项制度体现价值追求；提高党的执政能力和领导水平的制度体现实践要求；全面从严治党制度是坚强保证。","knowledgePoint":"六方面制度定位","chapter":"坚持党的全面领导","source":{"label":"课3 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"7b70ec06ef","lessonId":"xg03","question":"《关于建立报告制度》由谁于何时起草？","answer":"1948 年初毛泽东起草《关于建立报告制度》","knowledgePoint":"报告制度","chapter":"坚持党的全面领导","source":{"label":"课3 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"349bad8325","lessonId":"xg03","question":"党的领导决策核心由党的哪三个中央机构构成？","answer":"党的中央委员会、中央政治局、中央政治局常委会","knowledgePoint":"党的领导决策核心","chapter":"坚持党的全面领导","source":{"label":"课3 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3bf2e6805a","les "contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c6195ffd11","lessonId":"xg12","question":"“山水林田湖草是生命共同体”的命脉链怎样从人依次连接到田、水、山、土、林和草？","answer":"人→田→水→山→土→林和草","knowledgePoint":"生命共同体的命脉链","chapter":"建设社会主义生态文明","source":{"label":"课2 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ba5336d862","lessonId":"xg12","question":"国家生态安全屏障体系中的“三区四带”分别指哪些区域和地带？","answer":"青藏高原、黄河、长江三区 + 东北森林、北方防沙、南方丘陵山地、海岸带","knowledgePoint":"三区四带","chapter":"建设社会主义生态文明","source":{"label":"课2 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9c27a50c99","lessonId":"xg12","question":"我国自然保护地体系以什么为主体、基础和补充？","answer":"国家公园为主体、自然保护区为基础、各类自然公园为补充","knowledgePoint":"自然保护地体系","chapter":"建设社会主义生态文明","source":{"label":"课2 p11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"94f60a9840","lessonId":"xg12","question":"保护生态环境需要怎样的制度和法治？制度生命力体现在哪个环节？","answer":"最严格制度、最严密法治；制度的生命力在于执行","knowledgePoint":"制度保障","chapter":"建设社会主义生态文明","source":{"label":"课2 p14/p17"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3f6b250fbc","lessonId":"xg12","question":"中国在全球生态文明建设中承担哪三种角色？","answer":"全球生态文明建设的重要参与者、贡献者、引领者","knowledgePoint":"中国的全球定位","chapter":"建设社会主义生态文明","source":{"label":"课3 p3"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9cd780f77f","lessonId":"xg12","question":"中国承办的COP15推动达成了什么全球生物多样性治理框架？","answer":"承办 COP15，达成\"昆明—蒙特利尔全球生物多样性框架\"","knowledgePoint":"生物多样性治理里程碑","chapter":"建设社会主义生态文明","source":{"label":"课3 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1bcca2d6d8","lessonId":"xg12","question":"共建“一带一路”应以哪一种发展理念作为鲜明底色？","answer":"绿色","knowledgePoint":"\"一带一路\"的底色","chapter":"建设社会主义生态文明","source":{"label":"课3 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"46c7b769f7","lessonId":"xg13","question":"实现民族复兴、保证人民安居乐业，哪一事务被强调为“头等大事”？","answer":"\"实现中华民族伟大复兴的中国梦，保证人民安居乐业，国家安全是头等大事\"","knowledgePoint":"章引言金句","chapter":"维护和塑造国家安全","source":{"label":"课1 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1ad4dc4fb9","lessonId":"xg13","question":"维护国家安全与塑造国家安全是什么关系？塑造安全比维护安全体现怎样的层次和前瞻性？","answer":"二者是统一的，塑造是更高层次、更具前瞻性的维护","knowledgePoint":"维护与塑造的关系","chapter":"维护和塑造国家安全","source":{"label":"课1 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c8346c7e0e","lessonId":"xg13","question":"国家安全的定义既包含怎样的安全状态，也包含怎样的保障能力？","answer":"重大利益相对处于没有危险和不受内外威胁的**状态** + 保障持续安全状态的**能力**","knowledgePoint":"国家安全的定义","chapter":"维护和塑造国家安全","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a9d766eb42","lessonId":"xg13","question":"国家安全与社会稳定分别是民族复兴和国家强盛的什么条件？","answer":"国家安全是民族复兴的根基，社会稳定是国家强盛的前提","knowledgePoint":"根基与前提","chapter":"维护和塑造国家安全","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bfa27933b9","lessonId":"xg13","question":"总体国家安全观在哪一年哪月哪日、哪次会议上首次提出？","answer":"2014 年 4 月 15 日，中央国家安全委员会第一次会议","knowledgePoint":"总体国家安全观首次提出","chapter":"维护和塑造国家安全","source":{"label":"课1 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6eaa1c550c","lessonId":"xg13","question":"总体国家安全观的五大要素，分别以什么为宗旨、根本、基础、保障和依托？","answer":"人民安全为宗旨、政治安全为根本、经济安全为基础、军事科技文化社会安全为保障、促进国际安全为依托","knowledgePoint":"五大要素","chapter":"维护和塑造国家安全","source":{"label":"课1 p10-11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d86af57c9f","lessonId":"xg13","question":"新时代国家安全工作发生了哪三组从原有状态到新状态的全局性变革？","answer":"从分散到集中、迟缓到高效、被动到主动","knowledgePoint":"全局性变革","chapter":"维护和塑造国家安全","source":{"label":"课1 p15"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a56fe1b0ff","lessonId":"xg13","question":"全民国家安全教育日是每年哪一天？首个教育日出现在哪一年？","answer":"每年 4 月 15 日（2016 年首个）","knowledgePoint":"全民国家安全教育日","chapter":"维护和塑造国家安全","source":{"label":"课1 p18"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0181b6c34c","lessonId":"xg13","question":"统筹发展和安全属于党治国理政的什么原则？它何时纳入“十四五”指导思想、何时写入党章？","answer":"党治国理政的一个重大原则；十九届五中全会纳入\"十四五\"指导思想，二十大写入党章","knowledgePoint":"统筹发展和安全定位","chapter":"维护和塑造国家安全","source":{"label":"课2 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a0947d01fa","lessonId":"xg13","question":"为什么说发展和安全是一体之两翼、驱动之双轮？二者分别提供什么？","answer":"一体之两翼、驱动之双轮；发展是总钥匙、最大的安全；安全是条件和保障","knowledgePoint":"发展和安全关系","chapter":"维护和塑造国家安全","source":{"label":"课2 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"146e2cf25b","lessonId":"xg13","question":"哪一领域安全是国家安全的根本，被比作国家安全肌体的“心脏”？","answer":"国家安全的根本，是国家安全肌体的\"心脏\"","knowledgePoint":"政治安全定位","chapter":"维护和塑造国家安全","source":{"label":"课2 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d6dff3f275","lessonId":"xg13","question":"政治安全、人民安全、国家利益至上在国家安全工作中分别处于什么地位？","answer":"政治安全=根本保证；人民安全=中心地位；国家利益至上=要求和原则","knowledgePoint":"三者有机统一","chapter":"维护和塑造国家安全","source":{"label":"课2 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bcb62d0018","lessonId":"xg13","question":"国土安全、经济安全、社会安全分别被定位为立国之基、基础和晴雨表风向标中的哪一项？","answer":"国土安全=立国之基；经济安全=基础；社会安全=晴雨表风向标","knowledgePoint":"各领域定位","chapter":"维护和塑造国家安全","source":{"label":"课2 p10-11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8ca119ee7a","lessonId":"xg13","question":"维护重点领域国家安全，在国家安全工作中具有什么主阵地和主战场地位？","answer":"维护重点领域国家安全是主阵地、主战场","knowledgePoint":"重点领域安全定位","chapter":"维护和塑造国家安全","source":{"label":"课2 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0d7da5d5e7","lessonId":"xg13","question":"保障国家安全的治本之策是什么？","answer":"保障国家安全的治本之策","knowledgePoint":"健全国家安全体系","chapter":"维护和塑造国家安全","source":{"label":"课4 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8aa86288ba","lessonId":"xg13","question":"平安中国建设要推动公共安全治理由什么模式向什么模式转型？应建立怎样的安全应急框架？","answer":"以事后处置为主 → 以事前预防为主；建立大安全大应急框架","knowledgePoint":"平安中国治理模式转型","chapter":"维护和塑造国家安全","source":{"label":"课4 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f811a10a06","lessonId":"xg13","question":"防范风险的底线思维要求从哪里着眼、做什么准备、朝什么方向努力、争取什么结果？","answer":"从最坏处着眼、做最充分准备、朝好的方向努力、争取最好结果","knowledgePoint":"底线思维口诀","chapter":"维护和塑造国家安全","source":{"label":"课4 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"10ac00a7ae","lessonId":"xg13","question":"防范风险运用“木桶原理”，除了补齐短板，还应特别注意什么？","answer":"既要善于补齐短板，更要注重加固底板","knowledgePoint":"木桶原理","chapter":"维护和塑造国家安全","source":{"label":"课4 p11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e61303d2bb","lessonId":"xg13","question":"防范化解重大风险需要健全哪四个风险防控机制？","answer":"风险研判、决策风险评估、风险防控协同、风险防控责任","knowledgePoint":"四个风险防控机制","chapter":"维护和塑造国家安全","source":{"label":"课4 p12"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"18b08be1b2","lessonId":"xg14","question":"“强国必须……，……才能国安”这句关于国防和军队建设的论断应怎样补全？","answer":"强国必须强军，军强才能国安","knowledgePoint":"强军论断","chapter":"建设巩固国防和强大人民军队","source":{"label":"课2 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0bc774e07d","lessonId":"xg14","question":"巩固国防和强大人民军队，为新时代中国特色社会主义和民族复兴提供什么支撑？","answer":"巩固国防和强大人民军队是新时代坚持和发展中国特色社会主义、实现中华民族伟大复兴的战略支撑","knowledgePoint":"军队战略定位","chapter":"建设巩固国防和强大人民军队","source":{"label":"课2 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ed659a2139","lessonId":"xg14","question":"人民军队的建军之本、强军之魂是什么？","answer":"党对人民军队的绝对领导","knowledgePoint":"建军之本、强军之魂","chapter":"建设巩固国防和强大人民军队","source":{"label":"课2 p6/课1 p5"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8c561c7554","lessonId":"xg14","question":"党在新时代的强军目标怎样规定军队的三项要求和最终建设目标？","answer":"建设一支听党指挥、能打胜仗、作风优良的人民军队，把人民军队建设成为世界一流军队（十九大明确提出）","knowledgePoint":"强军目标","chapter":"建设巩固国防和强大人民军队","source":{"label":"课3 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1416c8b784","lessonId":"xg14","question":"新时代强军目标的提出和明确，从2012年12月至党的十九大经历了哪三个会议节点？","answer":"2012.12 军委扩大会议 → 2013.3 十二届全国人大一次会议 → 党的十九大正式明确","knowledgePoint":"强军目标提出线","chapter":"建设巩固国防和强大人民军队","source":{"label":"课3 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"cd9dbb8d28","lessonId":"xg14","question":"强军目标中的听党指挥、能打胜仗、作风优良分别是灵魂、核心还是保证，各解决什么问题？","answer":"听党指挥是灵魂（政治方向）；能打胜仗是核心（根本职能、根本指向）；作风优良是保证（性质、宗旨、本色）","knowledgePoint":"三者定位","chapter":"建设巩固国防和强大人民军队","source":{"label":"课3 p7-9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"eec6f85f07","lessonId":"xg14","question":"新时代人民军队使命任务要求提供哪四个战略支撑？","answer":"巩固党的领导和社会主义制度 / 捍卫主权统一领土完整 / 维护海外利益 / 促进世界和平与发展","knowledgePoint":"四个战略支撑","chapter":"建设巩固国防和强大人民军队","source":{"label":"课2 p9-11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6832ede5bc","lessonId":"xg14","question":"国防和军队现代化新“三步走”战略，2027年、2035年、本世纪中叶各对应什么目标？","answer":"2027 建军一百年 → 2035 基本实现国防和军队现代化 → 本世纪中叶全面建成世界一流军队","knowledgePoint":"新\"三步走\"","chapter":"建设巩固国防和强大人民军队","source":{"label":"课3 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e8746faa70","lessonId":"xg14","question":"到2035年基本实现国防和军队现代化，关键要推进哪四个方面的现代化？","answer":"军事理论现代化、军队组织形态现代化、军事人员现代化、武器装备现代化","knowledgePoint":"2035 关键","chapter":"建设巩固国防和强大人民军队","source":{"label":"课3 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"939cb5ca0e","lessonId":"xg14","question":"保证党对人民军队绝对领导的制度体系包括哪些主要制度和组织原则？","answer":"军委主席负责制 + 党委制、政治委员制、政治机关制 + 首长分工负责制 + 支部建在连上","knowledgePoint":"党对军队绝对领导的制度","chapter":"建设巩固国防和强大人民军队","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9090a501c3","lessonId":"xg14","question":"军委主席负责制在党对军队绝对领导的制度体系中具有什么根本地位和统领作用？","answer":"党对军队绝对领导的根本制度和根本实现形式，最高层次、统领地位","knowledgePoint":"军委主席负责制","chapter":"建设巩固国防和强大人民军队","source":{"label":"课1 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"61019b67ed","lessonId":"xg14","question":"政治建军、改革强军、科技强军、人才强军、依法治军分别在军队建设中发挥什么作用？","answer":"政治建军=立军之本；改革=关键一招/必由之路；科技=核心战斗力；人才=强军之道要在得人；依法治军=建军治军基本方式","knowledgePoint":"五军布局定位","chapter":"建设巩固国防和强大人民军队","source":{"label":"课1 p8-11/课2 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"89adb62f86","lessonId":"xg14","question":"人民军队建设唯一的根本标准是什么？主责主业是什么？","answer":"战斗力这个唯一的根本的标准；人民军队主责主业是备战打仗","knowledgePoint":"战斗力标准","chapter":"建设巩固国防和强大人民军队","source":{"label":"课1 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e77b51a931","lessonId":"xg14","question":"军民融合发展与军政军民团结，分别怎样支撑富国与强军相统一？","answer":"军民融合发展是兴国之举、强军之策；军政军民团结是实现富国和强军相统一的重要政治保障","knowledgePoint":"军民融合与团结","chapter":"建设巩固国防和强大人民军队","source":{"label":"课2 p6/课1 p20"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1279b4b518","lessonId":"xg15","question":"“一国两制”中，统一国家的主体与个别地区分别实行什么制度？","answer":"统一国家之内，国家主体实行社会主义制度，个别地区依法实行资本主义制度","knowledgePoint":"“一国两制”定义","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bcad4044be","lessonId":"xg15","question":"香港、澳门特别行政区的高度自治权主要包括哪些权力？","answer":"行政管理权、立法权、独立的司法权和终审权","knowledgePoint":"特区高度自治权内容","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"779dad8596","lessonId":"xg15","question":"“一国两制”构想最早针对什么问题提出，首先用于解决哪些地区的问题？","answer":"最早针对**台湾问题**提出，首先运用于解决**香港、澳门**问题","knowledgePoint":"构想的提出与运用","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8d65dd3bed","lessonId":"xg15","question":"香港于何年何月何日回归祖国？此前《中英联合声明》何时签署？","answer":"1997.7.1（1984.12.19 中英联合声明签署）","knowledgePoint":"香港回归","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"096f3f10b9","lessonId":"xg15","question":"澳门于何年何月何日回归祖国？此前《中葡联合声明》何时签署？","answer":"1999.12.20（1987.4.13 中葡联合声明签署）","knowledgePoint":"澳门回归","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4bef44f95f","lessonId":"xg15","question":"坚持“一国两制”的根本宗旨，在国家利益与港澳发展方面分别是什么？","answer":"维护国家主权、安全、发展利益，保持港澳长期繁荣稳定","knowledgePoint":"根本宗旨","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6a29f76591","lessonId":"xg15","question":"贯彻“一国两制”方针，应坚持哪两点要求？分别防止什么变化或偏差？","answer":"坚定不移（不会变不动摇）+ 全面准确（不走样不变形）","knowledgePoint":"贯彻方针两点","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ddbfa5d6cc","lessonId":"xg15","question":"“一国”与“两制”之间，谁是前提和基础，谁具有从属和派生关系？","answer":"“一国”是前提和基础；“两制”从属和派生于“一国”并统一于“一国”之内","knowledgePoint":"“一国”与“两制”关系","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bba8e391b2","lessonId":"xg15","question":"中央全面管治权与特别行政区高度自治权是什么关系？特别行政区是否存在“剩余权力”？","answer":"全面管治权是前提和基础（源与本），高度自治权是其体现（流与末）；不存在“剩余权力”","knowledgePoint":"两权关系","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p12"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"34070b0dc7","lessonId":"xg15","question":"香港、澳门特别行政区的宪制基础由哪两类法律共同构成？","answer":"宪法和基本法**共同构成**特区宪制基础","knowledgePoint":"宪制基础","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课1 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"150e127960","lessonId":"xg15","question":"香港国安法由哪个机构于何年何月通过？它在维护香港稳定中被比作什么？","answer":"2020 年 6 月全国人大常委会通过；维护香港稳定的“定海神针”","knowledgePoint":"香港国安法","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课2 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e2fdc2de1a","lessonId":"xg15","question":"完善香港特别行政区选举制度的决定于何年何月、哪次会议通过？它落实了什么原则？","answer":"2021 年 3 月十三届全国人大四次会议通过决定；落实“爱国者治港”","knowledgePoint":"完善选举制度","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课2 p11"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"92e9357adf","lessonId":"xg15","question":"对港澳发展而言，最大优势、最大舞台和新机遇分别来自哪些制度与国家战略？","answer":"“一国两制”最大优势；国家改革开放最大舞台；“一带一路”、大湾区建设是新机遇","knowledgePoint":"港澳三个“最”","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课2 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"7eed59504e","lessonId":"xg15","question":"解决台湾问题、实现祖国完全统一，对于党、中华儿女和民族复兴分别意味着什么？","answer":"党矢志不渝的历史任务 + 全体中华儿女共同愿望 + 民族复兴必然要求","knowledgePoint":"解决台湾问题三重定位","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课3 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9ce6138b9b","lessonId":"xg15","question":"新时代党解决台湾问题总体方略中，推进祖国统一的根本保证是什么？","answer":"坚持党中央对对台工作的集中统一领导。","knowledgePoint":"总体方略十定位","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课3 p9-10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"9ce6138b9b-2","lessonId":"xg15","question":"新时代党解决台湾问题总体方略中，历史方位是什么？","answer":"坚持在中华民族伟大复兴进程中推进祖国统一。","knowledgePoint":"对台工作总体方略·历史方位","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课3 p9-10"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"9ce6138b9b"},{"schemaVersion":1,"id":"9ce6138b9b-3","lessonId":"xg15","question":"新时代党解决台湾问题总体方略中，战略思路是什么？","answer":"坚持在祖国大陆发展进步基础上解决台湾问题。","knowledgePoint":"对台工作总体方略·战略思路","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课3 p9-10"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"9ce6138b9b"},{"schemaVersion":1,"id":"9ce6138b9b-4","lessonId":"xg15","question":"新时代党解决台湾问题总体方略中，大政方针是什么？","answer":"坚持“和平统一、一国两制”基本方针。","knowledgePoint":"对台工作总体方略·大政方针","chapter":"坚持“一国两制”和推进祖国完全统一","source":{"label":"课3 p9-10"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"9ce6138b9b"},{"schemaVersion":1,"id":"9ce6138b9b-5","lessonId":"xg15","question":"新时代党解决台湾问题总体方略中，政治基础是什么？","answer"

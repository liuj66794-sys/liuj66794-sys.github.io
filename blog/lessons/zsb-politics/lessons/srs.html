"全面从严治党","source":{"label":"课2 p13"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"89a182feb8","lessonId":"xg17","question":"党内监督在党和国家各种监督形式中处于什么地位？","answer":"党和国家各种监督形式中最根本的、第一位的","knowledgePoint":"党内监督地位","chapter":"全面从严治党","source":{"label":"课2 p14"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e6c2f8257d","lessonId":"xg17","question":"腐败对于党的健康发展意味着什么？反腐败被称为怎样的自我革命？","answer":"腐败是最大毒瘤、最大威胁；反腐败是最彻底的自我革命","knowledgePoint":"反腐败定性","chapter":"全面从严治党","source":{"label":"课3 p2"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e3729870c3","lessonId":"xg17","question":"反腐败工作坚持什么治理方针、覆盖和容忍要求，并开展哪三类行动？","answer":"标本兼治；无禁区、全覆盖、零容忍；打虎拍蝇猎狐","knowledgePoint":"反腐败方针","chapter":"全面从严治党","source":{"label":"课3 p6-7"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"dd62f61af7","lessonId":"xg17","question":"“不敢腐、不能腐、不想腐”之间，何者是前提、关键和根本？","answer":"不敢是前提、不能是关键、不想是根本","knowledgePoint":"三不腐","chapter":"全面从严治党","source":{"label":"课3 p9"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"99713e2466","lessonId":"xg17","question":"党跳出治乱兴衰历史周期率的第一个答案和第二个答案分别是什么？","answer":"一：让人民来监督政府；二：自我革命","knowledgePoint":"两个答案","chapter":"全面从严治党","source":{"label":"课4 p4"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"e5154b82a7","lessonId":"xg17","question":"党的自我革命要求增强哪“四个自我”能力？","answer":"自我净化、自我完善、自我革新、自我提高","knowledgePoint":"四个自我","chapter":"全面从严治党","source":{"label":"课4 p6"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ba96d5339f","lessonId":"xg17","question":"党的二十大提出的“三个务必”分别是什么？","answer":"不忘初心牢记使命 / 谦虚谨慎艰苦奋斗 / 敢于斗争善于斗争","knowledgePoint":"三个务必","chapter":"全面从严治党","source":{"label":"课4 p10"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8a093b3aef","lessonId":"sz00","question":"党的二十届四中全会于何时、何地举行？审议通过的最重要规划文件是什么？","answer":"**2025年10月20日至23日**在北京举行，最重要的成果是审议通过**《中共中央关于制定国民经济和社会发展第十五个五年规划的建议》**。","knowledgePoint":"二十届四中全会","chapter":"时政·党的二十届四中全会与\"十五五\"规划","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"84d2c669a4","lessonId":"sz00","question":"“十五五”时期在基本实现社会主义现代化进程中是什么关键时期，具有什么衔接地位？","answer":"**基本实现社会主义现代化夯实基础、全面发力的关键时期**，在基本实现社会主义现代化进程中具有**承前启后**的重要地位。","knowledgePoint":"\"十五五\"时期定位","chapter":"时政·党的二十届四中全会与\"十五五\"规划","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"218d9b9744","lessonId":"sz00","question":"“十五五”时期经济社会发展必须遵循的六大原则分别是什么？","answer":"坚持**党的全面领导、人民至上、高质量发展、全面深化改革、有效市场和有为政府相结合、统筹发展和安全**。","knowledgePoint":"\"十五五\"六大原则","chapter":"时政·党的二十届四中全会与\"十五五\"规划","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"073bbf02eb","lessonId":"sz00","question":"“十五五”时期经济社会发展的主题是什么？","answer":"推动**高质量发展**。","knowledgePoint":"\"十五五\"经济社会发展的主题","chapter":"时政·党的二十届四中全会与\"十五五\"规划","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"11a6d1066b","lessonId":"sz00","question":"“十五五”规划建议展望2035年时，对国家实力、人均GDP和现代化程度分别提出什么目标？","answer":"经济实力、科技实力、国防实力、综合国力和国际影响力大幅跃升，**人均国内生产总值达到中等发达国家水平**，基本实现社会主义现代化。","knowledgePoint":"2035年目标","chapter":"时政·党的二十届四中全会与\"十五五\"规划","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5d621076d3","lessonId":"sz00","question":"“十五五”12项重大部署之首是什么？其经济着力点、三大发展方向和物质技术基础定位分别是什么？","answer":"建设**现代化产业体系**——把发展经济的着力点放在**实体经济**上，坚持**智能化、绿色化、融合化**方向；现代化产业体系是**中国式现代化的物质技术基础**。","knowledgePoint":"12项重大部署之首","chapter":"时政·党的二十届四中全会与\"十五五\"规划","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"45118e4378","lessonId":"sz00","question":"伟大抗战精神的四方面内涵分别是什么？请同时说出相应的情怀、气节、气概和信念。","answer":"①天下兴亡、匹夫有责的**爱国情怀**；②视死如归、宁死不屈的**民族气节**；③不畏强暴、血战到底的**英雄气概**；④百折不挠、坚忍不拔的**必胜信念**。","knowledgePoint":"伟大抗战精神","chapter":"时政·重要会议与重要讲话","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2c98eb2e12","lessonId":"sz00","question":"百团大战发生在抗日战争的哪个战略阶段？它体现了中国共产党在全民族抗战中的什么作用？","answer":"百团大战发生在抗日战争的战略相持阶段，体现了中国共产党在全民族抗战中的中流砥柱作用。","knowledgePoint":"百团大战","chapter":"时政·重要会议与重要讲话","source":{"label":"时政·专题背诵版","references":[{"url":"https://m.ccdi.gov.cn/content/bf/ed/5404.html","note":"百团大战处于战略相持阶段。"}]},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c265c9a19e","lessonId":"sz00","question":"2025年全国人大常委会何时决定设立台湾光复纪念日？纪念日定在哪一天，2025年对应光复多少周年？","answer":"2025年**10月24日**十四届全国人大常委会第十八次会议表决通过，以法律形式将**10月25日**设立为台湾光复纪念日；2025年是台湾光复**80周年**；台湾光复是中国人民抗日战争胜利的重要成果、中国政府恢复对台湾行使主权的重要铁证。","knowledgePoint":"台湾光复纪念日","chapter":"时政·重要会议与重要讲话","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4a31f047b5","lessonId":"sz00","question":"生态环境法典草案于2025年何时首次提请审议？在当时的立法安排中，它拟成为我国第几部以“法典”命名的法律？","answer":"**2025年4月27日**提请首次审议，将是继民法典后中国**第二部**以\"法典\"命名的法律。","knowledgePoint":"生态环境法典草案","chapter":"时政·重要会议与重要讲话","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0841e644bc","lessonId":"sz00","question":"修改代表法的决定由哪次会议于2025年哪一天通过？它有利于完善什么制度、发展什么民主？","answer":"十四届全国人大三次会议闭幕（**2025年3月11日**）通过，有利于坚持和完善人民代表大会制度、发展**全过程人民民主**。","knowledgePoint":"修改人大代表法","chapter":"时政·重要会议与重要讲话","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c356cfec7a","lessonId":"sz00","question":"按2025年起施行的弹性退休暂行办法，弹性提前退休最长可提前几年，不得低于哪些原法定年龄？","answer":"《实施弹性退休制度暂行办法》自**2025年1月1日**起施行；可自愿弹性提前退休，提前最长不超过**3年**，且不得低于原法定退休年龄（女**50、55周岁**，男**60周岁**）。","knowledgePoint":"弹性退休制度","chapter":"时政·重要会议与重要讲话","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ef4961a472","lessonId":"sz00","question":"“拥军优属、拥政爱民”在我国具有什么传统和政治优势地位？","answer":"拥军优属、拥政爱民是我党我军我国人民优良传统和**特有政治优势**。","knowledgePoint":"双拥工作","chapter":"时政·重要会议与重要讲话","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6fdfb57f9b","lessonId":"sz00","question":"嫦娥六号完成了人类探月的哪项首次任务？任务团队获得了哪一2025年度航天奖项？","answer":"完成**人类首次月球背面采样返回**，任务团队荣获**2025年度\"世界航天奖\"**（国际宇航联合会航天领域最高奖）。","knowledgePoint":"嫦娥六号","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5668e145d3","lessonId":"sz00","question":"中国载人登月计划瞄准何时实现首次登月？登月服和载人月球车分别叫什么？","answer":"瞄准2030年前实现中国人首次登陆月球；登月服命名为“望宇”，载人月球车命名为“探索”。","knowledgePoint":"载人登月","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5668e145d3-lander","lessonId":"sz00","question":"2025年“揽月”月面着陆器完成了我国载人航天器的哪项首次地外试验？","answer":"我国首次载人航天器地外天体着陆起飞试验。","knowledgePoint":"2025年“揽月”月面着陆器完成了我国载人航天器的哪项首次地外试验","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"5668e145d3"},{"schemaVersion":1,"id":"5668e145d3-bricks","lessonId":"sz00","question":"我国探月工程研制的月壤打砖机，创造了什么设备研制纪录？","answer":"世界第一台月壤打砖机。","knowledgePoint":"我国探月工程研制的月壤打砖机，创造了什么设备研制纪录","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"5668e145d3"},{"schemaVersion":1,"id":"2f6996bb05","lessonId":"sz00","question":"天问二号一次发射计划探测哪颗小行星和哪颗主带彗星？对两类目标分别实施哪些任务？","answer":"一次发射实施小行星 **2016HO3** 伴飞、取样、返回和主带彗星 **311P** 伴飞探测等多项任务。","knowledgePoint":"天问二号","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3bf66b848b","lessonId":"sz00","question":"2025年漳州核电1号机组投入商业运行，它属于哪种自主核电技术路线、所在基地有何规模地位？","answer":"漳州核电1号机组投入商业运行，全球最大\"华龙一号\"核电基地。","knowledgePoint":"\"华龙一号\"","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d5fcacf683","lessonId":"sz00","question":"我国首口超万米科探井深地塔科1井完钻深度是多少？按垂直深度排名在亚洲和世界各居第几？","answer":"我国首口超万米科探井，完钻深度 **10910米**，**亚洲第一、世界第二**垂直深度井。","knowledgePoint":"深地塔科1井","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"87a4602488","lessonId":"sz00","question":"2025年发布的“祖冲之三号”是什么类型的量子计算原型机，拥有多少比特，并刷新了哪类纪录？","answer":"**105比特**超导量子计算原型机，再次打破超导体系量子计算优越性**世界纪录**。","knowledgePoint":"祖冲之三号","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"12f3493370","lessonId":"sz00","question":"龙芯3C6000采用什么指令系统？这一技术路线对国外授权技术有何依赖？","answer":"采用我国自主设计的**龙架构**指令系统，无需依赖任何国外授权技术。","knowledgePoint":"龙芯3C6000","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"0544ab11eb","lessonId":"sz00","question":"AG600“鲲龙”属于什么类型的飞机？2025年获型号合格证时，其起飞重量具有怎样的全球地位？","answer":"全球**起飞重量最大**的民用水陆两栖飞机，获颁型号合格证。","knowledgePoint":"AG600\"鲲龙\"","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"1866ec25aa","lessonId":"sz00","question":"“悟空”（Darwin Monkey）类脑计算机由哪所大学研制，其神经元规模超过多少？","answer":"浙江大学新一代类脑计算机，神经元规模超过**20亿**。","knowledgePoint":"\"悟空\"（Darwin Monkey）","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"cedd54e989","lessonId":"sz00","question":"我国科研人员公布的“天宫尼尔菌”是在哪种航天设施中发现的什么新物种？","answer":"我国科研人员首次公布在**空间站**发现的微生物新物种。","knowledgePoint":"\"天宫尼尔菌\"","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f0182fe4ce","lessonId":"sz00","question":"2025年“三体计算星座”进入组网阶段，它属于什么类型的太空计算星座？","answer":"我国**整轨互联太空计算星座**正式进入组网阶段。","knowledgePoint":"\"三体计算星座\"","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"78cedace72","lessonId":"sz00","question":"海南商业航天发射场双工位首发成功，完整验证了国内首个商业航天发射场的什么能力？","answer":"双工位首发成功，国内**首个**商业航天发射场**双工位**发射能力完整验证。","knowledgePoint":"海南商业航天发射场","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b1594468b7","lessonId":"sz00","question":"2025年朱雀三号动力系统试车实现多少台发动机并联？当时在我国并联热试车中具有什么地位？","answer":"**9台**发动机并联动力系统试车成功，我国迄今**规模最大、自动化水平最高**的并联热试车。","knowledgePoint":"朱雀三号","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"615e74bffb","lessonId":"sz00","question":"2025年北极科考中，“蛟龙”号实现了我国载人深潜的哪项首次突破？","answer":"“蛟龙”号实现了我国首次北极冰区载人深潜。","knowledgePoint":"\"蛟龙\"号","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版","references":[{"url":"https://zrzyt.xinjiang.gov.cn/xjgtzy/mtxc/202510/bbbc8a6906264c049b0ac175408cd3ea.shtml","note":"蛟龙首次北极冰区深潜；母船为深海一号。"},{"url":"https://idsse.cas.cn/xwdt/ywdt/202510/t20251030_7999857.html","note":"探索三号与奋斗者实现密集冰区连续载人深潜。"}]},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"615e74bffb-fendouzhe","lessonId":"sz00","question":"2025年依托“探索三号”在北极密集冰区进行连续载人深潜的潜水器叫什么？","answer":"“奋斗者”号载人潜水器。","knowledgePoint":"2025年依托“探索三号”在北极密集冰区进行连续载人深潜的潜水器叫什么","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版","references":[{"url":"https://zrzyt.xinjiang.gov.cn/xjgtzy/mtxc/202510/bbbc8a6906264c049b0ac175408cd3ea.shtml","note":"蛟龙首次北极冰区深潜；母船为深海一号。"},{"url":"https://idsse.cas.cn/xwdt/ywdt/202510/t20251030_7999857.html","note":"探索三号与奋斗者实现密集冰区连续载人深潜。"}]},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"615e74bffb"},{"schemaVersion":1,"id":"a8b8833ca8","lessonId":"sz00","question":"“奋斗者”号在海洋最深生态系统研究中，助力绘制了什么全球首个图景？","answer":"助力绘制**全球首个**海洋最深生态系统图景。","knowledgePoint":"\"奋斗者\"号","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"df430d193b","lessonId":"sz00","question":"2025年12月26日通车的天山胜利隧道，在高速公路隧道长度方面具有什么世界地位？","answer":"**世界最长**高速公路隧道，12月26日通车。","knowledgePoint":"天山胜利隧道","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6cbb61333f","lessonId":"sz00","question":"玛尔挡水电站在黄河流域水电站中，具有哪项海拔纪录？","answer":"**黄河流域海拔最高**的水电站。","knowledgePoint":"玛尔挡水电站","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6010d3e366","lessonId":"sz00","question":"2025年12月18日投运的金上—湖北±800千伏特高压工程，在海拔和线路覆盖方面创造了什么纪录？","answer":"金上—湖北工程是世界海拔最高的特高压直流输电工程，也是首条深入川藏高原腹地的特高压工程。","knowledgePoint":"金上—湖北±800千伏特高压","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6010d3e366-ningxia","lessonId":"sz00","question":"宁夏—湖南特高压通道是我国首条以输送哪类基地新能源为主的特高压通道？","answer":"以输送“沙戈荒”风电光伏大基地新能源为主的特高压通道。","knowledgePoint":"宁夏—湖南特高压通道是我国首条以输送哪类基地新能源为主的特高压通道","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"6010d3e366"},{"schemaVersion":1,"id":"45a41fe733","lessonId":"sz00","question":"“超碳一号”建于哪里？它是全球首台商用的哪一类型发电机组？","answer":"**全球首台**商用超临界二氧化碳发电机组（贵州六盘水）。","knowledgePoint":"\"超碳一号\"","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a85826c4e9","lessonId":"sz00","question":"在大连交付的“凯拓”轮采用什么动力形式，创造了哪项超大型油轮首制纪录？","answer":"**全球首制**甲醇双燃料动力智能超大型油轮（大连交付）。","knowledgePoint":"\"凯拓\"轮","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8709299ccc","lessonId":"sz00","question":"Agogo FPSO作为海上浮式生产储油卸油船，首次安装了什么碳治理装置？","answer":"**全球首艘**安装海上碳捕集和封存（CCS）装置的海上浮式生产储油卸油船。","knowledgePoint":"Agogo FPSO","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"013892d232","lessonId":"sz00","question":"“雪龙2”号完成中国第41次南极考察历时多少天，创造了我国极地考察的哪项单船纪录？","answer":"完成中国第**41**次南极考察，历时 **208天**，创中国极地考察史上单船执行任务**最长时间**纪录。","knowledgePoint":"\"雪龙2\"号","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bf4bdd07fa","lessonId":"sz00","question":"秦岭站是我国第几个南极科考站、第几个常年考察站？它使中国南极考察进入什么越冬格局？","answer":"秦岭站是我国第五个南极科考站、继长城站和中山站之后的第三个常年考察站；中国南极考察由此进入“三站越冬”时代。","knowledgePoint":"秦岭站","chapter":"时政·科技成就与大国重器","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"33dceb07c3","lessonId":"sz00","question":"海南自由贸易港于2025年哪一天启动全岛封关运作？其“一线”“二线”和岛内管理的基本特征是什么？","answer":"2025年12月18日启动全岛封关运作；基本特征是“一线”放开、“二线”管住、岛内自由。","knowledgePoint":"海南自由贸易港","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"33dceb07c3-zones","lessonId":"sz00","question":"海南“三区一中心”战略定位中的“三区”分别是什么？","answer":"全面深化改革开放试验区、国家生态文明试验区、国家重大战略服务保障区。","knowledgePoint":"海南“三区一中心”战略定位中的“三区”分别是什么","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"33dceb07c3"},{"schemaVersion":1,"id":"8de992472c","lessonId":"sz00","question":"《市场准入负面清单（2025年版）》的四项核心要求是什么？其中最核心的原则是哪项？","answer":"核心要求——**全国统一、事权法定、公开透明、非禁即入**；其中最核心的是**\"非禁即入\"**。","knowledgePoint":"《市场准入负面清单（2025年版）》","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"450bf48b7d","lessonId":"sz00","question":"2025年免费学前教育政策从哪个学期开始，免除公办幼儿园哪个学段儿童的什么费用？","answer":"自**2025年秋季学期**起免除公办幼儿园**学前一年**在园儿童保育教育费。","knowledgePoint":"免费学前教育","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b85910ac46","lessonId":"sz00","question":"《加快建设农业强国规划（2024—2035年）》怎样定位农业强国与社会主义现代化强国的关系？","answer":"强国必先强农，**农业强国是社会主义现代化强国的根基**。","knowledgePoint":"《加快建设农业强国规划（2024—2035年）》","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"8817f3c3d1","lessonId":"sz00","question":"保障国家粮食安全的根本是什么？建设高标准农田在其中发挥什么作用？","answer":"保障国家粮食安全，**根本在耕地**，建设高标准农田是重要抓手。","knowledgePoint":"高标准农田","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a71cbe86cf","lessonId":"sz00","question":"第四次全国农业普查安排在哪一年开展？","answer":"将于**2026年**开展。","knowledgePoint":"第四次全国农业普查","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"fdf32aa689","lessonId":"sz00","question":"按再生稻发展目标，到2030年全国再生稻面积力争新增多少万亩？","answer":"力争到**2030年**全国面积新增 **1000万亩**左右。","knowledgePoint":"再生稻","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"6326fcc614","lessonId":"sz00","question":"2024年我国氢能全年生产消费规模超过多少万吨，居世界第几位？","answer":"2024年我国氢能全年生产消费规模超 **3650万吨**，位列**世界第一**。","knowledgePoint":"氢能","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3db1e0e673","lessonId":"sz00","question":"2024年上海港汽车吞吐量达到多少万辆，在世界港口中排名第几？","answer":"2024年上海港汽车吞吐量达363万辆，首次跃升世界第一。","knowledgePoint":"港口","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3db1e0e673-national","lessonId":"sz00","question":"2024年全国港口货物和集装箱吞吐量分别是多少，在世界各居第几位？","answer":"货物吞吐量176亿吨、集装箱吞吐量3.3亿标箱，均居世界第一。","knowledgePoint":"2024年全国港口货物和集装箱吞吐量分别是多少，在世界各居第几位","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"3db1e0e673"},{"schemaVersion":1,"id":"a3e34992eb","lessonId":"sz00","question":"塔里木油田在我国超深油气生产基地中具有什么规模地位？","answer":"我国**最大超深油气生产基地**。","knowledgePoint":"塔里木油田","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2102f604a0","lessonId":"sz00","question":"惠州19-6油田的发现，在海上深层至超深层哪种储层、整装油田和储量规模方面取得突破？","answer":"我国首次探获海上深层—超深层碎屑岩大型**整装油田**（**亿吨级**）。","knowledgePoint":"惠州19-6油田","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"af56c2c0fc","lessonId":"sz00","question":"流花油田是我国首个什么水深类型的油田？其礁灰岩油田地质储量具有什么国内地位？","answer":"我国**首个深水油田**，二次开发项目全面投产（我国海上探明地质储量最大的**礁灰岩油田**）。","knowledgePoint":"流花油田","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4b3ddd496b","lessonId":"sz00","question":"渤海油田在我国海上油田中具有什么规模地位？2025年油气当量突破多少万吨？","answer":"渤海油田是我国海上最大油田；2025年油气当量突破4000万吨，创历史新高。","knowledgePoint":"渤海油田","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"4b3ddd496b-qinhuangdao","lessonId":"sz00","question":"秦皇岛29-6油田是渤海油田自2019年以来连续发现的第几个亿吨级油田？","answer":"第7个亿吨级油田。","knowledgePoint":"秦皇岛29-6油田是渤海油田自2019年以来连续发现的第几个亿吨级油田","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"4b3ddd496b"},{"schemaVersion":1,"id":"053ceff25c","lessonId":"sz00","question":"大东沟金矿探明金金属量是多少？其规模和品位类型创造了哪些国内纪录？","answer":"国内**首个千吨级**、低品位超大型金矿床，探明金金属量 **1444.49吨**，为新中国成立以来发现的**规模最大单体金矿床**。","knowledgePoint":"大东沟金矿","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"298e588ee1","lessonId":"sz00","question":"新疆油田在2025年的注碳能力上创造了什么国内首次纪录？它在新中国油田发展史中处于什么位置？","answer":"新疆油田成为我国首个年注碳百万吨油田，也是新中国第一个大油田。","knowledgePoint":"新疆油田","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"298e588ee1-grain","lessonId":"sz00","question":"2025年时政资料记录的新疆粮食单产为每亩多少公斤，在全国排名第几？","answer":"552.8公斤/亩，蝉联全国第一。","knowledgePoint":"2025年时政资料记录的新疆粮食单产为每亩多少公斤，在全国排名第几","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"298e588ee1"},{"schemaVersion":1,"id":"164b6bc98a","lessonId":"sz00","question":"国务院同意从哪一年起，把每年4月的哪一周设为“全民阅读活动周”？","answer":"国务院同意自**2026年**起，将每年**4月第四周**设立为\"全民阅读活动周\"。","knowledgePoint":"全民阅读活动周","chapter":"时政·经济民生与重要政策","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"f746c11ba9","lessonId":"sz00","question":"第九届哈尔滨亚冬会上，中国代表团获得多少金牌和奖牌，在两榜各居什么位置？","answer":"中国体育代表团获 **32金**、**85枚奖牌**，名列**金牌榜和奖牌榜首位**，追平单届金牌数纪录。","knowledgePoint":"第九届哈尔滨亚冬会","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5ddf57f880","lessonId":"sz00","question":"2025年成都世界运动会上，中国代表团的金、银、铜牌各有多少，两榜排名如何？","answer":"中国代表团获得36金17银11铜，位居金牌榜和奖牌榜首位。","knowledgePoint":"成都世运会","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"5ddf57f880-torch","lessonId":"sz00","question":"2025年成都世运会火炬叫什么，在世界运动会历史上具有什么首次地位？","answer":"“竹梦”，是世界运动会历史上首支火炬。","knowledgePoint":"2025年成都世运会火炬叫什么，在世界运动会历史上具有什么首次地位","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"5ddf57f880"},{"schemaVersion":1,"id":"7012f02ecd","lessonId":"sz00","question":"第十五届全国运动会于2025年何时、何地开幕？联合举办地区的安排创造了什么首次纪录？","answer":"2025年11月9日在广州开幕，是首次由广东、香港、澳门三地联合举办的全国运动会。","knowledgePoint":"十五运会","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"7012f02ecd-robot","lessonId":"sz00","question":"第十五届全国运动会火炬传递中，“夸父”创造了哪项机器人火炬手纪录？","answer":"成为全球首个5G-A人形机器人火炬手。","knowledgePoint":"第十五届全国运动会火炬传递中，“夸父”创造了哪项机器人火炬手纪录","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":1,"editorialStatus":"reviewed","splitFrom":"7012f02ecd"},{"schemaVersion":1,"id":"651e7497e8","lessonId":"sz00","question":"2025年全国残特奥会于12月哪一天、在哪座城市闭幕？承办方式有何首次特点？","answer":"12月15日在**深圳**闭幕，**粤港澳三地首次联合承办**全国残特奥会。","knowledgePoint":"残特奥会","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"52891b4cf1","lessonId":"sz00","question":"赵心童在2025年斯诺克世锦赛上创造了中国球手的什么纪录？决赛对手和比分分别是什么？","answer":"成为**首位**赢得斯诺克世锦赛冠军的**中国球手**（28岁，18:12胜马克·威廉姆斯）。","knowledgePoint":"赵心童","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"27d3edf8ca","lessonId":"sz00","question":"谁分别获得世界泳联2024年度最佳男子、女子跳水运动员荣誉？","answer":"分获世界泳联2024年度**最佳男子/女子跳水运动员**。","knowledgePoint":"曹缘、全红婵","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"40f89f3503","lessonId":"sz00","question":"2025年世界人形机器人运动会在北京哪个场馆开幕？它的参赛主体和综合性赛事地位有何特点？","answer":"**全球首个**以人形机器人为参赛主体的综合性赛事，在北京\"冰丝带\"开幕。","knowledgePoint":"世界人形机器人运动会","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"d282d0b566","lessonId":"sz00","question":"2025年北京亦庄全球首个人形机器人半程马拉松，冠军机器人叫什么、成绩是多少？","answer":"**全球首个**（北京亦庄），\"**天工**\"机器人以 **2小时40分42秒**夺冠。","knowledgePoint":"人形机器人半程马拉松","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"3b7e03aea2","lessonId":"sz00","question":"清华“火神”队在2025年机器人世界杯获得哪个组别冠军，为中国机器人足球创造了什么首次成绩？","answer":"夺得2025机器人世界杯**人形组冠军**，中国机器人足球队**首次**获此冠军。","knowledgePoint":"清华火神队","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"92f5dcab71","lessonId":"sz00","question":"2025年首届奥林匹克电竞运动会原定于何时何地举办？同年10月合作安排发生了什么变化？","answer":"2025年2月公布的原计划是2027年在沙特阿拉伯利雅得举办；2025年10月30日，国际奥委会宣布与沙特奥委会结束该项目合作，转而探索新的举办路径与合作模式。原计划不能继续当作确定赛程。","knowledgePoint":"首届电竞奥运会","chapter":"时政·体育与文化","source":{"label":"时政·专题背诵版","references":[{"url":"https://spa.gov.sa/en/N2259921","note":"2025年2月原计划。"},{"url":"https://www.thenewsmarket.com/news/ioc-statement-on-the-olympic-esports-g eviewed","splitFrom":"a950c44cd7"},{"schemaVersion":1,"id":"af03463110","lessonId":"sz00","question":"巴黎奥运会上中国体育代表团获得多少金银铜牌，创造了什么境外参赛成绩？","answer":"中国体育代表团 **40金27银24铜**，取得**境外参赛最好成绩**。","knowledgePoint":"巴黎奥运会","chapter":"时政·新年贺词要点","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"a37ba8d831","lessonId":"sz00","question":"粤港澳大湾区建设锚定什么湾区与城市群目标？在新发展格局、高质量发展、中国式现代化中分别承担什么角色？","answer":"要锚定建设**富有活力和国际竞争力的一流湾区和世界级城市群**；大湾区是中国**开放程度最高、经济活力最强**的区域之一；要打造中国新发展格局的**战略支点**、高质量发展的**示范地**、中国式现代化的**引领地**。","knowledgePoint":"粤港澳大湾区","chapter":"时政·广东时政专题","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"c837011dc4","lessonId":"sz00","question":"按2026年APEC“中国年”安排，第33次领导人非正式会议计划在哪个月、哪座城市举办？","answer":"中方将于**2026年11月在深圳**举办亚太经合组织**第三十三次**领导人非正式会议；深圳是**中国人民创造的世界发展史上的一个奇迹**。","knowledgePoint":"APEC\"中国年\"","chapter":"时政·广东时政专题","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"91c5061ec8","lessonId":"sz00","question":"“十五五”时期在现代化进程中处于什么关键阶段，经济社会发展的主题是什么？","answer":"基本实现社会主义现代化夯实基础、全面发力的关键时期；发展主题是**推动高质量发展**","knowledgePoint":"\"十五五\"时期定位","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"b380c2cac8","lessonId":"sz00","question":"“十五五”时期需要遵循的六项发展原则分别是什么？","answer":"党的全面领导、人民至上、高质量发展、全面深化改革、有效市场和有为政府相结合、统筹发展和安全","knowledgePoint":"\"十五五\"六大原则","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"413783146a","lessonId":"sz00","question":"到2035年，人均国内生产总值计划达到哪类国家水平，并基本实现什么目标？","answer":"人均国内生产总值达到**中等发达国家水平**，基本实现社会主义现代化","knowledgePoint":"2035年目标","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"aa45294577","lessonId":"sz00","question":"2025年9月3日抗战胜利80周年纪念大会的目的，用哪四组要求概括？","answer":"铭记历史、缅怀先烈、珍爱和平、开创未来","knowledgePoint":"抗战胜利80周年纪念大会（9.3）目的","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"dafac583e6","lessonId":"sz00","question":"伟大抗战精神中，爱国情怀、民族气节、英雄气概、必胜信念分别如何表述？","answer":"天下兴亡、匹夫有责的爱国情怀；视死如归、宁死不屈的民族气节；不畏强暴、血战到底的英雄气概；百折不挠、坚忍不拔的必胜信念。","knowledgePoint":"伟大抗战精神","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"ac47c0dc71","lessonId":"sz00","question":"全球治理倡议的五项核心理念是什么？哪一项是首要前提？","answer":"主权平等、国际法治、多边主义、以人为本、行动导向（首要前提：奉行主权平等）","knowledgePoint":"全球治理倡议五点","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"bcfb54dd31","lessonId":"sz00","question":"“上海精神”的六方面内容分别是什么？","answer":"互信、互利、平等、协商、尊重多样文明、谋求共同发展","knowledgePoint":"\"上海精神\"","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"7227c6ec06","lessonId":"sz00","question":"台湾光复纪念日定于每年哪一天？2025年对应台湾光复多少周年？","answer":"**10月25日**（2025年是台湾光复80周年）","knowledgePoint":"台湾光复纪念日","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"932aed7562","lessonId":"sz00","question":"2025年中央城市工作会议确定的城市工作主线和目标分别是什么？","answer":"主线是城市内涵式发展，目标是建设现代化人民城市","knowledgePoint":"中央城市工作会议","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"2e682ef13a","lessonId":"sz00","question":"《中国共产党思想政治工作条例》在党的思想政治工作法规建设史上具有什么“第一部”的地位？","answer":"党史上**第一部**思想政治工作统领性、综合性基础主干法规","knowledgePoint":"《中国共产党思想政治工作条例》","chapter":"时政·考前最后一遍","source":{"label":"时政·专题背诵版"},"contentVersion":2,"editorialStatus":"reviewed"},{"schemaVersion":1,"id":"7cb9376b5c","lessonId":"sz00","question":"2025年中央一号文件锚定什么乡村发展目标？这是新世纪以来连续第几年聚焦“三农”？","answer":"锚定推进乡村全面振兴、建设农业强国；是新世纪以来连续第22年聚焦“三农”的中央一号文件。","knowledgePoint":"2025年中央一号文件","chapter":"时政·考前最后一遍"

name: Manually approved static recovery
on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: 'Exact public main SHA reviewed for release'
        required: true
        type: string
      source_sha:
        description: 'Reviewed private source SHA'
        required: true
        type: string
      blog_sha256:
        description: 'Reviewed static blog manifest SHA256'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.release_sha == github.sha
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fixed source, static flags, artifact and real required reviewer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          BLOG_SHA256: ${{ inputs.blog_sha256 }}
        run: |
          gh api repos/${{ github.repository }}/environments/github-pages > /tmp/environment.json
          node release-tools/check-static-release.mjs /tmp/environment.json
      # Preserve the original legacy Jekyll homepage/source, not an unrelated
      # VuePress root build. Only the compiled /blog/ subtree is added.
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check static blog copied byte-for-byte
        run: node release-tools/check-static-release.mjs /tmp/environment.json _site/blog
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          BLOG_SHA256: ${{ inputs.blog_sha256 }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
